<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SportsBizNow! — Sports Industry News</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    /* Base surfaces — layered dark, each step slightly lighter than the last */
    --bg: #0a0c11;           /* page background (the "canvas") */
    --surface: #14171e;      /* cards, toolbar, widgets — one step up from bg */
    --surface-2: #1d2028;    /* elevated / hover states — two steps up */

    /* The deepest black — reserved for the header, ticker, draft tracker:
       visually distinct horizontal bands that frame the content. */
    --ink-deep: #05070a;

    /* Text hierarchy — ink is the brightest text color. High contrast but
       not pure white (avoids that harsh "OLED glare" look). */
    --ink: #edefe8;
    --ink-2: #a5abb5;
    --ink-3: #7d828d;

    /* Dividers — subtle on dark, stronger variant for emphasis */
    --rule: #252a33;
    --rule-strong: #363c48;

    /* Signature accent — electric lime, reads brilliantly on dark */
    --accent: #caff3f;
    --accent-dim: #a8d420;
    --accent-ink: #0a1400;   /* dark text on accent backgrounds */

    /* Semantic colors — slightly brighter than light-mode versions so they
       pop on the dark canvas. The "light" variants are now translucent
       tints that layer cleanly on any dark surface. */
    --green: #22c55e;        --green-light: rgba(34,197,94,0.14);
    --amber: #f59e0b;        --amber-light: rgba(245,158,11,0.14);
    --blue:  #60a5fa;        --blue-light:  rgba(96,165,250,0.14);
    --purple:#c084fc;        --purple-light:rgba(192,132,252,0.14);
    --red:   #f87171;        --red-light:   rgba(248,113,113,0.14);
  }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.55;
    font-feature-settings: 'cv11', 'ss01', 'ss03';
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  .site-header { background: var(--ink-deep); color: #fff; padding: 0 24px; }
  .header-top { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 12px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .logo {
    font-family: 'Archivo', sans-serif;
    font-size: 32px;
    font-weight: 900;
    letter-spacing: -0.035em;
    line-height: 0.95;
    color: #fff;
    font-style: italic;
    text-transform: lowercase;
  }
  .logo em { color: var(--accent); font-style: italic; }
  .logo-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    margin-top: 4px;
    font-weight: 500;
  }
  .header-dateline { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(255,255,255,0.5); text-align: right; letter-spacing: .04em; line-height: 1.4; }
  .nav-bar { display: flex; align-items: center; gap: 2px; padding: 10px 0; flex-wrap: wrap; position: relative; }
  .nav-pill {
    font-family: 'Archivo', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 2px;
    border: 1px solid rgba(255,255,255,0.12);
    cursor: pointer;
    background: transparent;
    color: rgba(255,255,255,0.6);
    white-space: nowrap;
    transition: all .12s ease;
  }
  .nav-pill:hover { background: rgba(255,255,255,0.08); color: #fff; border-color: rgba(255,255,255,0.3); }
  .nav-pill.active {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }
  .nav-chev { display: inline-block; font-size: 8px; margin-left: 4px; opacity: 0.7; transition: transform .15s; }
  .nav-pill.active .nav-chev { transform: rotate(180deg); opacity: 1; }

  /* "All Stories" category dropdown — collapses the five topic filters into a
     menu so the top nav stays clean. Opens on hover (desktop) or tap (mobile). */
  .nav-group { position: relative; display: inline-flex; }
  .nav-menu {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    min-width: 210px;
    background: var(--ink-deep, #0d0d0f);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 4px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.55);
    padding: 5px;
    z-index: 200;
    display: none;
    flex-direction: column;
    gap: 2px;
  }
  .nav-group:hover .nav-menu,
  .nav-group.open .nav-menu { display: flex; }
  .nav-menu-item {
    font-family: 'Archivo', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    text-align: left;
    padding: 8px 12px;
    border-radius: 2px;
    border: none;
    cursor: pointer;
    background: transparent;
    color: rgba(255,255,255,0.7);
    white-space: nowrap;
    transition: all .12s ease;
  }
  .nav-menu-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .nav-menu-item.active { background: rgba(202,255,63,0.14); color: var(--accent); }
  .nav-menu-divider { height: 1px; background: rgba(255,255,255,0.08); margin: 3px 4px; }
  .subnav-bar { display: none; align-items: center; gap: 6px; padding: 10px 0 12px; border-top: 1px solid rgba(255,255,255,0.06); }
  .subnav-bar.open { display: flex; }
  .subnav-prefix { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: rgba(255,255,255,0.3); margin-right: 4px; letter-spacing: 0; }
  .subnav-pill {
    font-family: 'Archivo', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 2px;
    border: 1px solid rgba(255,255,255,0.15);
    cursor: pointer;
    background: transparent;
    color: rgba(255,255,255,0.55);
    white-space: nowrap;
    transition: all .12s ease;
  }
  .subnav-pill:hover { border-color: rgba(255,255,255,0.4); color: #fff; }
  .subnav-pill.active {
    background: rgba(202,255,63,0.14);
    color: var(--accent);
    border-color: var(--accent);
  }
  .ticker-wrap {
    background: var(--ink-deep);
    border-top: 1px solid var(--accent);
    overflow: hidden;
    white-space: nowrap;
    padding: 7px 0;
  }
  .ticker-inner {
    display: inline-block;
    animation: ticker 120s linear infinite;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: rgba(255,255,255,0.85);
    letter-spacing: .04em;
  }
  .ticker-inner .ticker-sep { color: var(--accent); margin: 0 10px; font-weight: 600; }
  @keyframes ticker { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
  .toolbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; border-bottom: 1px solid var(--rule); background: var(--surface); }
  .updated-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-3); letter-spacing: .04em; }
  .refresh-btn {
    display: flex; align-items: center; gap: 6px;
    font-family: 'Archivo', sans-serif;
    font-size: 10px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 2px;
    border: 1px solid var(--rule-strong);
    cursor: pointer;
    background: var(--surface);
    color: var(--ink-2);
    transition: all .12s;
  }
  .refresh-btn:hover { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .refresh-btn:disabled { opacity: .5; cursor: not-allowed; }
  .refresh-btn.spinning svg { animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .page { max-width: 1100px; margin: 0 auto; padding: 20px 24px 40px; display: grid; grid-template-columns: 1fr 260px; gap: 28px; align-items: start; }
  @media (max-width: 760px) { .page { grid-template-columns: 1fr; } }

  /* ─── PHONE LAYOUT (<=600px) ──────────────────────────────────────────────
     One consolidated pass so the site fits and reads well on iOS/Android.
     Tightens edge padding, scales down oversized type, stacks the header,
     wraps the record strips, and enlarges tap targets. */
  @media (max-width: 600px) {
    /* Reclaim horizontal space — 24px side padding wastes a lot on a phone. */
    .site-header { padding: 0 14px; }
    .page { padding: 16px 14px 32px; gap: 22px; }

    /* Header: let the logo and date stack instead of fighting for one row. */
    .header-top { padding: 14px 0 10px; gap: 8px; }
    .logo { font-size: 24px; }
    .logo-sub { font-size: 8px; letter-spacing: .18em; }
    .header-dateline { font-size: 9px; }

    /* Nav: 4 top-level items fit on a phone by wrapping — NO horizontal scroll,
       which is what trapped the dropdown inside a clipped scroll strip. The
       group is static so the menu can escape it. */
    .nav-bar { gap: 6px; padding: 8px 0; flex-wrap: wrap; overflow: visible; }
    .nav-pill { padding: 9px 13px; font-size: 12px; white-space: nowrap; flex: 0 0 auto; }

    /* The category dropdown becomes a full-width panel pinned just under the
       nav, laid OVER the stories (not inside the cramped bar). position:fixed
       takes it out of the nav's box entirely so nothing clips it. */
    .nav-group { position: static; }
    .nav-group.open .nav-menu,
    .nav-group:hover .nav-menu {
      display: flex;
      position: fixed;
      left: 12px;
      right: 12px;
      min-width: 0;
      width: auto;
      max-height: 70vh;
      overflow-y: auto;
      z-index: 500;
      box-shadow: 0 16px 40px rgba(0,0,0,0.7);
    }
    .nav-menu-item { padding: 13px 16px; font-size: 13px; }

    /* Sub-tabs (analytics) can still scroll horizontally — they're a flat row,
       not a dropdown, so scrolling them is fine. */
    .subnav-bar { overflow-x: auto; -webkit-overflow-scrolling: touch; flex-wrap: nowrap; }
    .subnav-bar::-webkit-scrollbar { display: none; }
    .subnav-pill { white-space: nowrap; flex: 0 0 auto; padding: 8px 11px; }

    /* Ticker: smaller, still scrolls. */
    .ticker-inner { font-size: 11px; }

    /* Headlines and body type, scaled for a narrow column. */
    .lead-headline { font-size: 19px; line-height: 1.2; }

    /* Record strips: the title becomes its own full-width row, then the three
       stat cells (Today / All-Time / Hit Rate) sit in a tidy row beneath it.
       The desktop min-width:150px and right-border on the title were fighting
       the 100% width on a narrow screen and squashing the strip — reset them. */
    .picks-record-strip-simple { padding: 11px 13px; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .prs2-name { min-width: 78px; font-size: 10px; }
    .prs2-record { font-size: 18px; }
    .prs2-pct { font-size: 15px; }
    .prs2-status { font-size: 9px; }
    .prs-cell-title {
      flex: 1 1 100%;
      min-width: 0;
      border-right: none;
      border-bottom: 1px solid var(--rule);
      padding: 12px 14px 8px;
    }
    .prs-cell { flex: 1 1 0; min-width: 0; padding: 10px 8px; }
    .prs-cell-value { font-size: 15px; }
    .prs-cell-sub { font-size: 9px; }
    .prs-title-main { font-size: 12px; }
    /* VIEW expander drops to its own full-width tappable row. */
    .prs-expand { flex: 1 1 100%; border-top: 1px solid var(--rule); padding: 10px 14px; text-align: center; }

    /* Pick history modal: full-bleed on phone. */
    .ph-header { padding: 16px; gap: 10px; }
    .ph-title { font-size: 17px; }
    .ph-stat { padding: 12px 8px; }
    .ph-stat-value { font-size: 20px; }

    /* Any grid that uses min column widths near/over phone width: let them go
       single-column so nothing forces a horizontal scrollbar. */
    .dt-list,
    .main-scores-grid,
    .gd-leaders { grid-template-columns: 1fr; }

    /* Poll options on the sidebar: comfortable tap height. */
    .poll-option-btn { padding: 10px 12px; font-size: 13px; }

    /* Article modal: use the screen instead of floating with big margins. */
    .article-modal-overlay { padding: 0; align-items: stretch; }
    .article-modal { padding: 20px 16px 32px; border-radius: 0; min-height: 100%; max-width: 100%; }
    .article-modal-headline { font-size: 21px; }
    .article-modal-body { font-size: 15px; }
    .article-modal-close { top: 12px; right: 14px; font-size: 24px; padding: 4px; }

    /* Prevent any single wide element from making the whole page scroll
       sideways on iOS (a common mobile annoyance). Wide tables scroll inside
       their own wrapper instead. */
    html, body { overflow-x: hidden; }
    .mt-val-row { font-size: 13px; }

    /* iOS zooms the page when you focus an input with font-size < 16px. Force
       16px on the search and date inputs so tapping them doesn't jolt the view. */
    .scores-date-input, #lab-search { font-size: 16px; }
  }
  .loading-state { text-align: center; padding: 60px 0; }
  .spinner { width: 32px; height: 32px; border: 2px solid var(--rule); border-top-color: var(--green); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 14px; }
  .loading-title { font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .loading-step  { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-3); margin-top: 5px; }
  .error-box { background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.25); border-radius: 3px; padding: 24px; }
  .error-box h3 { font-size: 14px; color: var(--red); margin-bottom: 6px; }
  .error-box p  { font-size: 12px; color: var(--ink-2); line-height: 1.6; }
  .try-again-btn { margin-top: 14px; display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 6px 14px; border-radius: 4px; border: 1px solid var(--rule); cursor: pointer; background: var(--surface); color: var(--ink-2); font-family: 'Inter', sans-serif; }
  .main-feed { display: flex; flex-direction: column; }
  .cluster { padding: 18px 0; border-bottom: 1px solid var(--rule); }
  .cluster:first-child { padding-top: 4px; }
  .cat-tag {
    display: inline-block;
    font-family: 'Archivo', sans-serif;
    font-size: 9px; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 2px;
    margin-bottom: 9px;
  }
  .tag-media     { background: var(--green-light);  color: var(--green);  }
  .tag-contracts { background: var(--amber-light);  color: var(--amber);  }
  .tag-leagues   { background: var(--blue-light);   color: var(--blue);   }
  .tag-revenue   { background: var(--purple-light); color: var(--purple); }
  .tag-labor     { background: var(--red-light);    color: var(--red);    }
  .tag-default   { background: var(--surface-2); color: var(--ink-3); }
  .lead-headline {
    font-family: 'Archivo', sans-serif;
    font-size: 22px; font-weight: 800;
    line-height: 1.2;
    letter-spacing: -0.015em;
    color: var(--ink);
    transition: color .12s; text-decoration: none; display: block;
  }
  .lead-headline:hover { color: var(--accent); }
  .lead-source { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-3); margin-top: 6px; letter-spacing: .03em; }
  .lead-summary { font-size: 14px; color: var(--ink-2); margin-top: 9px; line-height: 1.6; max-width: 95%; }
  /* ARTICLE MODAL */
  .article-modal-overlay { position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.55);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto; }
  .article-modal { background:var(--surface);max-width:680px;width:100%;border-radius:4px;padding:32px;position:relative;margin:auto; }
  .article-modal-close { position:absolute;top:14px;right:16px;font-size:20px;cursor:pointer;color:var(--ink-3);background:none;border:none;line-height:1; }
  .article-modal-close:hover { color:var(--ink); }
  .article-modal-tag { display:inline-block;font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:3px;margin-bottom:10px; }
  .article-modal-headline { font-family:'Archivo',sans-serif;font-size:26px;font-weight:800;line-height:1.2;letter-spacing:-0.02em;color:var(--ink);margin-bottom:8px; }
  .article-modal-meta { font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-3);margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--rule); }
  .article-modal-body { font-size:15px;color:var(--ink-2);line-height:1.75; }
  .article-modal-body p { margin-bottom:14px; }

  /* ─── Real X embeds beneath story clusters ─── */
  .posts-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-2);
    margin-top: 18px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .posts-label::after { content: ''; flex: 1; height: 1px; background: var(--rule); }
  .x-logo-icon {
    width: 11px; height: 11px;
    color: var(--ink);
    flex-shrink: 0;
  }
  .tweets-list { display: flex; flex-direction: column; gap: 4px; }
  .tweet-wrap {
    /* X widgets.js renders tweets as iframes with their own background. When
       widgets.js has loaded, our container just provides spacing. Before the
       script loads, we show the raw blockquote styled tastefully in dark mode. */
    max-width: 560px;
  }
  .tweet-wrap .twitter-tweet {
    /* Pre-enhancement blockquote fallback — looks decent before widgets.js runs */
    background: var(--surface-2);
    border: 1px solid var(--rule);
    border-radius: 12px;
    padding: 14px 16px;
    margin: 0;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    font-size: 14px;
    line-height: 1.5;
  }
  .tweet-wrap .twitter-tweet a { color: var(--accent); }
  .tweet-wrap iframe {
    /* After widgets.js enhances, force-dark the iframe border radius */
    border-radius: 12px !important;
  }
  .sidebar { display: flex; flex-direction: column; }
  .sidebar-section { margin-bottom: 22px; }
  .sidebar-heading {
    font-family: 'Archivo', sans-serif;
    font-size: 10px; font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink);
    border-bottom: 2px solid var(--accent);
    padding-bottom: 7px; margin-bottom: 12px;
  }
  .sidebar-item { display: flex; gap: 9px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid var(--rule); text-decoration: none; transition: opacity .12s; }
  .sidebar-item:last-child { border-bottom: none; }
  .sidebar-item:hover { opacity: .7; }
  .sb-dot  { flex-shrink: 0; width: 6px; height: 6px; border-radius: 1px; background: var(--accent-dim); margin-top: 6px; }
  .sb-text { font-size: 12px; color: var(--ink); line-height: 1.45; font-weight: 500; }
  .sb-src  { display: block; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-3); margin-top: 3px; font-weight: 400; }
  .sidebar-promo {
    border: 1px dashed var(--rule-strong);
    border-radius: 2px;
    padding: 14px; text-align: center;
    color: var(--ink-3); font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  .widget-box {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-top: 3px solid var(--accent);
    margin-bottom: 28px;
  }
  .widget-header { padding: 12px 14px 10px; border-bottom: 1px solid var(--rule); }
  .widget-title {
    font-family: 'Archivo', sans-serif;
    font-size: 14px; font-weight: 800;
    letter-spacing: -0.01em;
    color: var(--ink);
    display: block;
  }
  .widget-switcher { display: flex; gap: 3px; }
  .widget-type-btn { font-size: 9px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 3px; border: 1px solid var(--rule); cursor: pointer; background: transparent; color: var(--ink-3); font-family: 'Inter', sans-serif; transition: all .12s; white-space: nowrap; }
  .widget-type-btn:hover  { background: var(--rule); color: var(--ink-2); }
  .widget-type-btn.active { background: var(--ink-deep); color: #fff; border-color: var(--ink); }
  .widget-body { padding: 14px; }
  .poll-question { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.4; margin-bottom: 12px; }
  .poll-option { margin-bottom: 7px; }
  .poll-option-btn { width: 100%; text-align: left; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--rule); background: var(--bg); cursor: pointer; font-size: 12px; color: var(--ink-2); font-family: 'Inter', sans-serif; transition: all .12s; }
  .poll-option-btn:hover  { border-color: var(--green); color: var(--green); background: var(--green-light); }
  .poll-result { margin-bottom: 8px; }
  .poll-result-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-2); margin-bottom: 3px; }
  .poll-result-pct { font-weight: 600; color: var(--ink); }
  .poll-bar-track { height: 5px; background: var(--rule); border-radius: 3px; overflow: hidden; }
  .poll-bar-fill  { height: 100%; background: var(--green); border-radius: 3px; transition: width .4s ease; }
  .poll-bar-fill.winner { background: var(--accent); }
  .poll-meta  { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-3); margin-top: 10px; }
  .poll-reset { font-size: 10px; color: var(--ink-3); background: none; border: none; cursor: pointer; text-decoration: underline; font-family: 'Inter', sans-serif; margin-left: 8px; }
  .score-league { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 10px; }
  .score-game { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--rule); }
  .score-game:last-child { border-bottom: none; }
  .score-teams { flex: 1; }
  .score-team { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--ink-2); line-height: 1.7; }
  .score-team.winner { font-weight: 600; color: var(--ink); }
  .score-num { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; min-width: 28px; text-align: right; }
  .score-status { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--ink-3); text-align: center; padding: 0 8px; white-space: nowrap; }
  .score-status.live { color: var(--red); font-weight: 600; }
  .score-tabs { display: flex; gap: 3px; margin-bottom: 10px; }
  .score-tab { font-size: 9px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 3px; border: 1px solid var(--rule); cursor: pointer; background: transparent; color: var(--ink-3); font-family: 'Inter', sans-serif; transition: all .12s; }
  .score-tab:hover { background: var(--rule); }
  .score-tab.active { background: var(--ink-deep); color: #fff; border-color: var(--ink); }
  .score-loading { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-3); padding: 12px 0; text-align: center; }
  .widget-blank { text-align: center; padding: 20px 0; }
  .picks-disclaimer { font-size: 9px; color: var(--ink-3); margin-top: 10px; font-family: JetBrains Mono, monospace; }
  .widget-blank-text { font-size: 12px; color: var(--ink-3); line-height: 1.6; }

  /* ─── Pick status badges (live/won/lost/push) and daily record strip ─── */
  .pick-status { display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border-radius: 3px; font-family: 'JetBrains Mono', monospace; }
  .pick-status.badge-live { background: rgba(26,122,69,0.15); color: var(--green); animation: dt-pulse 1.6s infinite; }
  .pick-status.badge-won  { background: var(--green); color: #fff; }
  .pick-status.badge-lost { background: var(--red); color: #fff; }
  .pick-status.badge-push { background: var(--ink-3); color: #fff; }

  /* Scoreboard-style record card. Click to open the history modal. */
  /* ─── SIMPLIFIED RECORD STRIP (one clean line per sport) ─────────────────── */
  .picks-record-strip-simple {
    position: relative;
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 14px;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 4px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    font-family: 'Inter', sans-serif;
  }
  .picks-record-strip-simple:hover { border-color: var(--ink-3); }
  .picks-record-strip-simple[data-empty="1"] { cursor: default; opacity: 0.6; }
  .picks-record-strip-simple[data-empty="1"]:hover { border-color: var(--rule); }
  .picks-record-strip-simple.is-overall {
    border-left: 3px solid var(--accent);
    background: linear-gradient(90deg, rgba(202,255,63,0.05), transparent 40%);
  }
  .prs2-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink-2); min-width: 92px; flex: 0 0 auto;
  }
  .prs2-record {
    font-family: 'Archivo', sans-serif; font-size: 20px; font-weight: 800;
    color: var(--ink); flex: 0 0 auto; min-width: 54px;
  }
  .prs2-pct {
    font-family: 'Archivo', sans-serif; font-size: 16px; font-weight: 700;
    flex: 0 0 auto; min-width: 44px;
  }
  .prs2-status {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .04em;
    color: var(--ink-3); flex: 1 1 auto;
  }
  .prs2-view {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600;
    letter-spacing: .08em; text-transform: uppercase; color: var(--accent);
    flex: 0 0 auto;
  }
  .prs2-record .prs-w { color: var(--ink); }
  .prs2-record .prs-l { color: var(--ink-3); }
  .prs2-record .prs-p { color: var(--ink-3); }
  .prs2-pct .prs-pct-good { color: var(--accent); }
  .prs2-pct .prs-pct-bad  { color: var(--red, #ff5f5f); }
  .prs2-pct .prs-pct-even { color: var(--ink-2); }

  .picks-record-strip {
    position: relative;
    display: flex; align-items: center; flex-wrap: wrap; gap: 0;
    margin-bottom: 20px;
    padding: 0;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 4px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    font-family: 'Inter', sans-serif;
    min-height: 68px;
  }
  .picks-record-strip:hover { border-color: var(--rule-strong); }
  .picks-record-strip.is-overall { border-left: 3px solid var(--accent); }
  .picks-record-strip[data-empty="1"] { cursor: default; opacity: 0.6; }
  .picks-record-strip[data-empty="1"]:hover { border-color: var(--rule); }

  /* The coloured progress bar showing hit rate, painted along the bottom edge. */
  .picks-record-strip::after {
    content: '';
    position: absolute; bottom: 0; left: 0;
    height: 2px;
    background: var(--accent);
    width: var(--winpct, 0%);
    transition: width .4s ease;
    opacity: 0.85;
  }

  .prs-cell {
    display: flex; flex-direction: column; gap: 2px;
    padding: 12px 18px;
    border-right: 1px solid var(--rule);
    min-width: 0;
  }
  .prs-cell:last-of-type { border-right: none; }
  .prs-cell-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; font-weight: 500;
    letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-3);
    line-height: 1;
  }
  .prs-cell-value {
    font-family: 'Archivo', sans-serif;
    font-size: 17px; font-weight: 800;
    letter-spacing: -0.005em;
    color: var(--ink);
    line-height: 1.1;
  }
  .prs-cell-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--ink-3);
    line-height: 1;
  }
  .prs-cell-title {
    padding: 12px 20px;
    border-right: 1px solid var(--rule);
    display: flex; flex-direction: column; gap: 4px;
    min-width: 150px;
  }
  .prs-title-main {
    font-family: 'Archivo', sans-serif;
    font-size: 13px; font-weight: 800;
    letter-spacing: .02em; text-transform: uppercase;
    color: var(--ink);
  }
  .prs-title-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-3);
    letter-spacing: .04em;
  }
  .prs-live-pip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 6px;
    background: rgba(34,197,94,0.12);
    color: var(--green);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; font-weight: 700;
    letter-spacing: .1em;
    border-radius: 2px;
    animation: dt-pulse 2s infinite;
  }
  .prs-w  { color: var(--green); }
  .prs-l  { color: var(--red); }
  .prs-p  { color: var(--ink-3); }
  .prs-pct-good { color: var(--accent); }
  .prs-pct-bad  { color: var(--red); }
  .prs-pct-even { color: var(--ink-2); }
  .prs-expand {
    margin-left: auto; padding: 12px 18px;
    font-family: 'Archivo', sans-serif;
    font-size: 10px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink-3);
    display: flex; align-items: center; gap: 6px;
  }
  .picks-record-strip:hover .prs-expand { color: var(--accent); }
  .prs-expand-chev { font-size: 8px; }

  /* Legacy record-strip variables kept for back-compat text */
  .picks-record-label { color: var(--ink-2); font-weight: 600; }
  .picks-record-wins { color: var(--green); font-weight: 700; }
  .picks-record-losses { color: var(--red); font-weight: 700; }
  .picks-record-push { color: var(--ink-3); font-weight: 600; }
  .picks-record-live { color: var(--green); font-weight: 700; animation: dt-pulse 1.6s infinite; }
  .picks-record-sep { color: var(--rule); }

  /* ─── Pick History Modal — opens when user clicks a record strip ─── */
  .ph-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 3000;
    display: none;
    align-items: flex-start; justify-content: center;
    overflow-y: auto;
    padding: 40px 20px;
    backdrop-filter: blur(4px);
  }
  .ph-overlay.open { display: flex; }
  .ph-modal {
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    border-radius: 6px;
    width: 100%; max-width: 760px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    overflow: hidden;
  }
  .ph-header {
    padding: 20px 24px;
    background: var(--ink-deep);
    border-bottom: 2px solid var(--accent);
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .ph-title {
    font-family: 'Archivo', sans-serif;
    font-size: 20px; font-weight: 800;
    letter-spacing: -0.015em;
    color: #fff;
    flex: 1;
  }
  .ph-title-sport {
    color: var(--accent);
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    display: block;
    margin-bottom: 4px;
  }
  .ph-close {
    font-family: 'Archivo', sans-serif;
    font-size: 11px; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase;
    padding: 6px 12px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.05);
    color: #fff;
    border-radius: 2px;
    cursor: pointer;
    transition: all .15s;
  }
  .ph-close:hover { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .ph-stats-bar {
    display: flex; padding: 0; background: var(--ink-deep);
    border-bottom: 1px solid var(--rule);
  }
  .ph-stat {
    flex: 1; padding: 14px 20px;
    border-right: 1px solid rgba(255,255,255,0.06);
    text-align: center;
  }
  .ph-stat:last-child { border-right: none; }
  .ph-stat-value {
    font-family: 'Archivo', sans-serif;
    font-size: 24px; font-weight: 900;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .ph-stat-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; font-weight: 500;
    letter-spacing: .14em; text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    margin-top: 6px;
  }
  .ph-body { padding: 20px 24px 24px; max-height: 60vh; overflow-y: auto; }
  .ph-day-group { margin-bottom: 22px; }
  .ph-day-group:last-child { margin-bottom: 0; }
  .ph-day-label {
    font-family: 'Archivo', sans-serif;
    font-size: 11px; font-weight: 800;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink);
    padding-bottom: 6px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--rule);
  }
  .ph-day-summary {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-3);
    margin-left: 10px;
    letter-spacing: 0;
    text-transform: none;
    font-weight: 500;
  }
  .ph-entry {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--rule);
  }
  .ph-entry:last-child { border-bottom: none; }
  .ph-entry-badge {
    flex-shrink: 0; width: 48px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase;
    padding: 3px 0; text-align: center;
    border-radius: 2px;
  }
  .ph-entry-badge.won  { background: var(--green); color: #fff; }
  .ph-entry-badge.lost { background: var(--red); color: #fff; }
  .ph-entry-badge.push { background: var(--ink-3); color: #fff; }
  .ph-entry-body { flex: 1; min-width: 0; }
  .ph-entry-pick {
    font-family: 'Archivo', sans-serif;
    font-size: 14px; font-weight: 700;
    color: var(--ink);
    line-height: 1.3;
  }
  .ph-entry-matchup {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-3);
    margin-top: 3px;
    letter-spacing: .03em;
  }
  .ph-empty {
    padding: 30px 20px; text-align: center;
    color: var(--ink-3);
    font-size: 13px;
  }

  /* Sport-section header with its own record strip sitting beneath. */
  .picks-sport-section { margin-top: 28px; }
  .picks-sport-section:first-of-type { margin-top: 0; }
  .picks-sport-header {
    display: flex; align-items: center; gap: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 4px;
  }
  .picks-sport-label {
    font-family: 'Archivo', sans-serif;
    font-size: 16px; font-weight: 800;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .picks-sport-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-3);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* Live/final score+clock readout displayed beneath each graded pick */
  .pick-live-readout {
    display: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: var(--ink);
    margin-top: 2px;
    margin-bottom: 10px;
    padding: 7px 11px;
    background: rgba(202,255,63,0.06);
    border-left: 2px solid var(--accent);
    border-radius: 0 2px 2px 0;
    letter-spacing: 0.02em;
    line-height: 1.4;
  }

  /* ─── Draft Tracker Banner ─── */
  .draft-tracker {
    background: var(--ink-deep);
    color: #fff;
    padding: 14px 24px;
    border-bottom: 2px solid var(--accent);
    transition: padding .2s ease;
    position: relative;
  }
  .draft-tracker::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent) 30%, transparent 30%, transparent 100%);
  }
  .draft-tracker.expanded { padding: 14px 24px 22px; }
  .dt-header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    cursor: pointer; user-select: none;
    padding: 4px 0;
    transition: opacity .15s;
  }
  .dt-header:hover { opacity: 0.85; }
  .draft-tracker.expanded .dt-header { margin-bottom: 14px; }
  .dt-live {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--accent-ink);
    font-weight: 700;
    letter-spacing: .14em;
    background: var(--accent);
    padding: 4px 10px;
    border-radius: 2px;
    animation: dt-pulse 2s infinite;
  }
  @keyframes dt-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
  .dt-title {
    font-family: 'Archivo', sans-serif;
    font-size: 20px; font-weight: 800;
    letter-spacing: -0.015em;
    color: #fff;
  }
  .dt-count { font-size: 10px; color: rgba(255,255,255,0.55); font-family: 'JetBrains Mono', monospace; letter-spacing: .06em; text-transform: uppercase; }
  .dt-latest {
    font-size: 12px; color: rgba(255,255,255,0.78);
    font-family: 'Inter', sans-serif; font-weight: 500;
    padding-left: 16px; margin-left: 4px;
    border-left: 1px solid rgba(255,255,255,0.15);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1; min-width: 120px;
  }
  .dt-latest-num { color: var(--accent); font-family: 'JetBrains Mono', monospace; font-weight: 700; margin-right: 6px; }
  .dt-toggle {
    margin-left: auto;
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'Archivo', sans-serif;
    font-size: 10px; font-weight: 700;
    color: rgba(255,255,255,0.75);
    letter-spacing: .1em; text-transform: uppercase;
    padding: 5px 12px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 2px;
    transition: all .12s;
  }
  .dt-header:hover .dt-toggle { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .dt-chevron { display: inline-block; transition: transform .2s; font-size: 9px; }
  .draft-tracker.expanded .dt-chevron { transform: rotate(180deg); }
  .draft-tracker.collapsed .dt-list { display: none; }
  .draft-tracker.expanded .dt-latest { display: none; }
  .dt-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
  .dt-pick {
    display: flex; gap: 12px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 2px;
    padding: 12px 14px;
    transition: all .15s;
  }
  .dt-pick:hover { border-color: var(--accent); background: rgba(202,255,63,0.06); }
  .dt-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px; font-weight: 700;
    color: var(--accent);
    min-width: 46px;
    line-height: 1;
  }
  .dt-num-round { display: block; font-size: 9px; color: rgba(255,255,255,0.4); font-weight: 500; letter-spacing: .06em; margin-top: 4px; }
  .dt-body { flex: 1; min-width: 0; }
  .dt-player { font-weight: 700; color: #fff; font-size: 14px; line-height: 1.35; font-family: 'Archivo', sans-serif; letter-spacing: -0.005em; }
  .dt-pos {
    display: inline-block; font-size: 9px; font-weight: 700;
    color: rgba(255,255,255,0.75); font-family: 'JetBrains Mono', monospace;
    margin-left: 6px; background: rgba(255,255,255,0.1);
    padding: 2px 6px; border-radius: 2px;
    letter-spacing: .06em;
  }
  .dt-team { font-size: 12px; color: rgba(255,255,255,0.8); margin-top: 4px; font-weight: 500; }
  .dt-school { color: rgba(255,255,255,0.45); }
  .dt-note { font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 6px; line-height: 1.5; }

  /* ─── Main-feed Scores (wider layout) ─── */
  .main-section-header { font-size: 11px; color: var(--ink-3); font-family: 'JetBrains Mono', monospace; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 16px; }
  .main-score-tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .main-score-tab { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--rule); cursor: pointer; background: var(--surface); color: var(--ink-2); font-family: 'Inter', sans-serif; transition: all .15s; }
  .main-score-tab:hover { border-color: var(--ink-3); }
  .main-score-tab.active { background: var(--ink-deep); color: #fff; border-color: var(--ink); }
  .main-scores-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .main-score-card { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; transition: border-color .12s, transform .06s; }
  .main-score-card:hover { border-color: var(--accent); }
  .main-score-card:active { transform: translateY(1px); }
  .main-score-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--ink-2); }
  .main-score-row.winner { font-weight: 600; color: var(--ink); }
  .main-score-team { flex: 1; }
  .main-score-num { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 600; min-width: 36px; text-align: right; }
  .main-score-goals { display: flex; flex-direction: column; gap: 2px; padding-top: 4px; }
  .main-score-goal { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-2); }
  .main-score-footer { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-3); padding-top: 6px; border-top: 1px solid var(--rule); }
  .main-score-footer.live { color: var(--red); font-weight: 600; }

  /* Date navigation strip above the league tabs */
  .scores-datebar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 6px;
  }
  .scores-date-nav {
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--ink-2);
    width: 30px; height: 30px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 18px;
    font-family: 'Inter', sans-serif;
    line-height: 1;
    transition: all .12s;
  }
  .scores-date-nav:hover { border-color: var(--accent); color: var(--accent); }
  .scores-date-current { display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 1; }
  .scores-date-label {
    font-family: 'Archivo', sans-serif;
    font-size: 13px; font-weight: 700;
    color: var(--ink);
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .scores-date-input {
    background: transparent; border: none;
    color: var(--ink-3);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 3px;
  }
  .scores-date-input:hover, .scores-date-input:focus {
    background: var(--surface-2);
    color: var(--ink);
    outline: none;
  }
  /* Calendar icon in WebKit gets a filter so it shows on dark backgrounds */
  .scores-date-input::-webkit-calendar-picker-indicator { filter: invert(0.7); cursor: pointer; }
  .scores-date-today {
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    font-family: 'Archivo', sans-serif;
    font-size: 10px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase;
    padding: 6px 12px;
    border-radius: 3px;
    cursor: pointer;
    transition: opacity .12s;
  }
  .scores-date-today:hover { opacity: 0.85; }

  /* ─── Game Detail Modal — opens when user clicks a score card ─── */
  .gd-header {
    padding: 18px 24px;
    background: var(--ink-deep);
    border-bottom: 2px solid var(--accent);
  }
  .gd-league {
    color: var(--accent);
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .gd-teams {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 16px;
    align-items: center;
  }
  .gd-team { text-align: center; }
  .gd-team.away { text-align: right; }
  .gd-team.home { text-align: left; }
  .gd-team-name {
    font-family: 'Archivo', sans-serif;
    font-size: 18px; font-weight: 800;
    color: #fff;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }
  .gd-team-record {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: rgba(255,255,255,0.55);
    margin-top: 4px;
    letter-spacing: .04em;
  }
  .gd-score-cell {
    font-family: 'JetBrains Mono', monospace;
    font-size: 36px; font-weight: 700;
    color: #fff;
    line-height: 1;
    min-width: 50px;
  }
  .gd-score-cell.dim { color: rgba(255,255,255,0.35); }
  .gd-score-divider {
    text-align: center;
    color: rgba(255,255,255,0.35);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    align-self: center;
  }
  .gd-status {
    text-align: center;
    margin-top: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.7);
  }
  .gd-status.live { color: var(--red); }
  .gd-close {
    position: absolute;
    top: 14px; right: 16px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #fff;
    font-size: 16px;
    width: 30px; height: 30px;
    border-radius: 4px;
    cursor: pointer;
    line-height: 1;
    transition: all .12s;
  }
  .gd-close:hover { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  .gd-body { padding: 18px 24px 24px; max-height: 64vh; overflow-y: auto; }
  .gd-section { margin-bottom: 22px; }
  .gd-section:last-child { margin-bottom: 0; }
  .gd-section-title {
    font-family: 'Archivo', sans-serif;
    font-size: 11px; font-weight: 800;
    letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-2);
    padding-bottom: 6px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--rule);
  }
  .gd-loading { padding: 30px 0; text-align: center; color: var(--ink-3); font-size: 13px; }

  /* Box score / team comparison rows */
  .gd-goals { display: flex; flex-direction: column; gap: 2px; }
  .gd-goal-line {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 10px; border-bottom: 1px solid var(--rule);
    font-family: 'Inter', sans-serif; font-size: 14px;
  }
  .gd-goal-line:last-child { border-bottom: none; }
  .gd-goal-min {
    font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;
    color: var(--accent); min-width: 38px;
  }
  .gd-goal-scorer { color: var(--ink); flex: 1 1 auto; }
  .gd-goal-team {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-3);
  }
  .gd-stat-teamhead {
    font-family: 'JetBrains Mono', monospace !important;
    font-size: 11px !important; font-weight: 700 !important;
    letter-spacing: .06em; text-transform: uppercase;
    color: var(--accent) !important; padding-bottom: 4px;
  }
  .gd-boxscore-grid {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 6px 16px;
    align-items: center;
    font-size: 13px;
  }
  .gd-stat-label {
    text-align: center;
    color: var(--ink-3);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  .gd-stat-away { text-align: right; color: var(--ink); font-weight: 500; font-family: 'JetBrains Mono', monospace; }
  .gd-stat-home { text-align: left; color: var(--ink); font-weight: 500; font-family: 'JetBrains Mono', monospace; }

  /* Leaders block — top performer per category */
  .gd-leaders { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .gd-leader-card {
    background: var(--surface-2);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 10px 12px;
  }
  .gd-leader-cat {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--ink-3);
    letter-spacing: .12em;
    text-transform: uppercase;
    margin-bottom: 5px;
  }
  .gd-leader-name {
    font-family: 'Inter', sans-serif;
    font-size: 13px; font-weight: 600;
    color: var(--ink);
    line-height: 1.3;
  }
  .gd-leader-team {
    font-size: 10px;
    color: var(--ink-3);
    margin-top: 2px;
  }
  .gd-leader-stat {
    font-family: 'Archivo', sans-serif;
    font-size: 14px; font-weight: 700;
    color: var(--accent);
    margin-top: 6px;
  }

  /* Formation diagram for soccer */
  .gd-formation {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin-top: 4px;
  }
  .gd-formation-team { background: var(--surface-2); border: 1px solid var(--rule); border-radius: 6px; padding: 12px; }
  .gd-formation-team-name {
    font-family: 'Archivo', sans-serif;
    font-size: 12px; font-weight: 800;
    color: var(--ink);
    text-transform: uppercase;
    letter-spacing: .04em;
    margin-bottom: 4px;
  }
  .gd-formation-shape {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--accent);
    margin-bottom: 10px;
    letter-spacing: .08em;
  }
  .gd-formation-list { font-size: 12px; line-height: 1.55; color: var(--ink-2); }
  .gd-formation-num { color: var(--ink-3); font-family: 'JetBrains Mono', monospace; margin-right: 6px; font-size: 10px; }
  /* Full box score per team — collapsible per team, each section can have
     multiple stat groups (e.g., NBA "starters" / "bench"; NFL "passing" /
     "rushing" / "receiving") rendered as separate tables. */
  .gd-bs-team-block {
    border: 1px solid var(--rule);
    border-radius: 4px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .gd-bs-team-summary {
    padding: 10px 14px;
    background: var(--surface-2);
    cursor: pointer;
    font-family: 'Archivo', sans-serif;
    font-size: 13px; font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--ink);
    list-style: none;
    user-select: none;
    transition: background .12s;
  }
  .gd-bs-team-summary::-webkit-details-marker { display: none; }
  .gd-bs-team-summary::before {
    content: '▸';
    display: inline-block;
    margin-right: 8px;
    font-size: 10px;
    color: var(--accent);
    transition: transform .15s;
  }
  details[open] > .gd-bs-team-summary::before { transform: rotate(90deg); }
  .gd-bs-team-summary:hover { background: var(--surface); }
  .gd-bs-team-content { padding: 4px 0; }
  .gd-bs-group-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--ink-3);
    letter-spacing: .12em;
    text-transform: uppercase;
    padding: 8px 14px 4px;
  }
  .gd-bs-table-wrap {
    overflow-x: auto;
    padding: 0 6px 8px;
  }
  .gd-bs-table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-2);
  }
  .gd-bs-table th {
    text-align: right;
    padding: 6px 8px;
    border-bottom: 1px solid var(--rule);
    color: var(--ink-3);
    font-weight: 600;
    font-size: 9px;
    letter-spacing: .06em;
    white-space: nowrap;
  }
  .gd-bs-table th.gd-bs-name-h { text-align: left; }
  .gd-bs-table td {
    padding: 6px 8px;
    text-align: right;
    border-bottom: 1px solid var(--rule);
    white-space: nowrap;
  }
  .gd-bs-table td.gd-bs-name {
    text-align: left;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    white-space: normal;
  }
  .gd-bs-pos {
    color: var(--ink-3);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    margin-left: 4px;
  }
  .gd-bs-table tr:last-child td { border-bottom: none; }
  .gd-bs-table tr:hover td { background: var(--surface-2); }
  .gd-bs-dnp { opacity: 0.45; }
  .gd-no-data { padding: 20px; text-align: center; color: var(--ink-3); font-size: 12px; font-style: italic; }
  .gd-disclaimer {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--ink-3);
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--rule);
    line-height: 1.5;
  }

  /* ─── Main-feed Predictions (wider layout) ─── */
  .main-prediction-list { display: flex; flex-direction: column; gap: 18px; }
  .main-prediction-item { padding: 14px 0; border-bottom: 1px solid var(--rule); }
  .main-prediction-item:last-child { border-bottom: none; }
  .main-prediction-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 8px; }
  .main-prediction-statement { flex: 1; font-family: 'Archivo', sans-serif; font-size: 19px; font-weight: 800; line-height: 1.3; letter-spacing: -0.015em; color: var(--ink); }
  .main-prediction-pct { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; color: var(--ink); white-space: nowrap; }
  .main-prediction-bar-track { height: 6px; background: var(--rule); border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
  .main-prediction-bar-fill { height: 100%; border-radius: 4px; transition: width .5s ease; }
  .main-prediction-rationale { font-size: 13px; color: var(--ink-2); line-height: 1.6; }

  /* ─── Market Tracker dashboard ─── */
  .mt-page { max-width: 100%; }

  /* When reels is active we hide the sidebar and let the main feed go
     full width — the reels page handles its own internal layout. */
  body.reels-mode .sidebar { display: none; }
  body.reels-mode .page { grid-template-columns: 1fr; max-width: none; padding: 0 0 40px; }
  body.reels-mode .toolbar { display: none; }

  /* ─── Reels — vertical scroll-snap on mobile, click-pager on desktop ─── */
  .reels-page {
    /* Reset the parent .page grid by stretching across both columns. */
    margin: 0;
    padding: 0;
    background: var(--ink-deep);
  }
  .reels-filter-bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 6px;
    padding: 12px 16px;
    background: var(--ink-deep);
    border-bottom: 1px solid var(--rule);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .reels-filter-bar::-webkit-scrollbar { display: none; }
  .reels-filter-pill {
    font-family: 'Archivo', sans-serif;
    font-size: 11px; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase;
    padding: 6px 14px;
    border: 1px solid rgba(255,255,255,0.15);
    background: transparent;
    color: rgba(255,255,255,0.7);
    border-radius: 2px;
    cursor: pointer;
    white-space: nowrap;
    transition: all .12s;
  }
  .reels-filter-pill:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .reels-filter-pill.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  /* Mobile (≤768px): vertical scroll-snap stack */
  @media (max-width: 768px) {
    .reels-stack {
      height: calc(100vh - 250px); /* leaves room for header + filter bar */
      height: calc(100dvh - 250px); /* dvh accounts for the iOS address bar */
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
    .reels-card {
      height: calc(100vh - 250px);
      height: calc(100dvh - 250px);
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 20px 16px;
    }
    .reels-pager-controls { display: none; }
  }

  /* Desktop (>768px): one card visible, pager controls + arrow-key nav */
  @media (min-width: 769px) {
    .reels-stack {
      position: relative;
      min-height: 78vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 0 40px;
    }
    .reels-card {
      width: 100%;
      max-width: 480px;
    }
    .reels-card.reels-hidden { display: none; }
    .reels-pager-controls {
      display: flex; align-items: center; justify-content: center; gap: 24px;
      padding: 16px 0 32px;
    }
    .reels-pager-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      width: 42px; height: 42px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px; line-height: 1;
      transition: all .12s;
      font-family: 'Archivo', sans-serif;
    }
    .reels-pager-btn:hover:not(:disabled) {
      background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
    }
    .reels-pager-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .reels-pager-counter {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: rgba(255,255,255,0.55);
      letter-spacing: .08em;
      min-width: 80px;
      text-align: center;
    }
  }

  /* Card content (shared) */
  .reels-video-wrap {
    width: 100%;
    aspect-ratio: 9 / 16;
    max-height: 70vh;
    background: #000;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .reels-video-wrap iframe {
    width: 100%; height: 100%;
    border: 0;
    display: block;
  }
  .reels-video-overlay {
    position: absolute; inset: 0;
    pointer-events: none;
    background: linear-gradient(to bottom, transparent 0%, transparent 70%, rgba(0,0,0,0.55) 100%);
  }
  .reels-yt-link {
    position: absolute;
    top: 12px; right: 12px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    padding: 5px 10px;
    border-radius: 3px;
    text-decoration: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: .08em;
    text-transform: uppercase;
    pointer-events: auto;
    backdrop-filter: blur(4px);
  }
  .reels-yt-link:hover { background: rgba(0,0,0,0.8); }
  .reels-meta {
    margin-top: 14px;
    color: #fff;
    text-align: center;
    width: 100%;
    max-width: 480px;
    padding: 0 12px;
  }
  .reels-meta-league {
    display: inline-block;
    font-family: 'Archivo', sans-serif;
    font-size: 9px; font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase;
    padding: 3px 8px;
    background: var(--accent);
    color: var(--accent-ink);
    border-radius: 2px;
    margin-bottom: 8px;
  }
  .reels-meta-title {
    font-family: 'Archivo', sans-serif;
    font-size: 15px; font-weight: 700;
    line-height: 1.3;
    color: #fff;
    margin-bottom: 6px;
  }
  .reels-meta-source {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: rgba(255,255,255,0.55);
    letter-spacing: .04em;
  }
  .reels-empty {
    padding: 60px 24px;
    text-align: center;
    color: rgba(255,255,255,0.55);
    font-size: 13px;
  }
  .reels-loading {
    padding: 60px 24px;
    text-align: center;
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: .04em;
  }
  .mt-hero {
    display: flex; align-items: flex-end; justify-content: space-between;
    flex-wrap: wrap; gap: 16px;
    padding: 22px 0 18px;
    border-bottom: 2px solid var(--accent);
    margin-bottom: 24px;
  }
  .mt-hero-title {
    font-family: 'Archivo', sans-serif;
    font-size: 34px; font-weight: 900;
    letter-spacing: -0.03em; line-height: 1;
    color: var(--ink);
  }
  .mt-hero-title em { color: var(--accent); font-style: italic; }
  .mt-hero-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--ink-3);
    letter-spacing: .1em; text-transform: uppercase;
    margin-top: 6px;
  }
  .mt-hero-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--ink-3);
    text-align: right; letter-spacing: .04em; line-height: 1.5;
  }

  .mt-grid { display: grid; grid-template-columns: 1fr; gap: 24px; }
  @media (min-width: 1100px) { .mt-grid { grid-template-columns: 2fr 1fr; } }

  .mt-card {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 4px;
    overflow: hidden;
  }
  .mt-card-header {
    padding: 14px 18px 12px;
    border-bottom: 1px solid var(--rule);
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .mt-card-title {
    font-family: 'Archivo', sans-serif;
    font-size: 13px; font-weight: 800;
    letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink);
  }
  .mt-card-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; color: var(--ink-3);
    letter-spacing: .06em; text-transform: uppercase;
  }
  .mt-card-body { padding: 16px 18px 18px; }
  .mt-stack > .mt-card { margin-bottom: 24px; }

  /* League filter pills for valuations */
  .mt-league-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .mt-league-tab {
    font-family: 'Archivo', sans-serif;
    font-size: 10px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase;
    padding: 4px 10px;
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--ink-3);
    border-radius: 2px;
    cursor: pointer;
    transition: all .12s;
  }
  .mt-league-tab:hover { border-color: var(--ink-3); color: var(--ink); }
  .mt-league-tab.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  /* Valuation rows */
  .mt-val-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; }
  .mt-val-row {
    display: grid;
    grid-template-columns: 24px 1fr auto 60px;
    align-items: center; gap: 10px;
    padding: 9px 12px;
    background: var(--surface-2);
    border: 1px solid transparent;
    border-radius: 3px;
    transition: border-color .12s;
  }
  .mt-val-row:hover { border-color: var(--rule-strong); }
  .mt-val-rank {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: var(--ink-3); font-weight: 500;
  }
  .mt-val-team { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; color: var(--ink); }
  .mt-val-owner { font-size: 10px; color: var(--ink-3); margin-top: 1px; }
  .mt-val-price {
    font-family: 'Archivo', sans-serif;
    font-size: 15px; font-weight: 800;
    color: var(--ink);
    letter-spacing: -0.01em;
    text-align: right;
  }
  .mt-val-delta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; font-weight: 600;
    padding: 2px 6px; border-radius: 2px;
    text-align: right; white-space: nowrap;
  }
  .mt-delta-up   { background: rgba(34,197,94,0.12);  color: var(--green); }
  .mt-delta-down { background: rgba(248,113,113,0.12); color: var(--red); }
  .mt-delta-flat { background: var(--surface); color: var(--ink-3); }

  /* Sparkline SVG sits inside mt-val-row when we want it on hover */
  .mt-spark { width: 100%; height: 28px; overflow: visible; display: block; }

  /* Salary cap timeline chart */
  .mt-cap-league {
    padding: 10px 0;
    border-bottom: 1px solid var(--rule);
  }
  .mt-cap-league:last-child { border-bottom: none; }
  .mt-cap-header {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    margin-bottom: 6px;
  }

<script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
<!-- ─── SITE TRAFFIC ANALYTICS (GoatCounter) ──────────────────────────────────
     Free, cookie-free, privacy-friendly visitor counting for static sites.
     SETUP (one time):
       1. Create a free account at https://www.goatcounter.com/signup
       2. Choose a site code (e.g. "sportsbiznow") — dashboard will live at
          https://sportsbiznow.goatcounter.com
       3. Replace SB_GOATCOUNTER_CODE below with that code.
     Until the code is set, no script loads and nothing is tracked.
     Tab switches are counted as virtual pageviews (/tab/picks, /tab/market,
     /sub/scores, ...) so the dashboard shows which sections people actually use. -->
<script>
  window.SB_GOATCOUNTER_CODE = 'luc';  // GoatCounter site code — dashboard at https://luc.goatcounter.com
  (function () {
    if (!window.SB_GOATCOUNTER_CODE) return;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://gc.zgo.at/count.js';
    s.setAttribute('data-goatcounter', 'https://' + window.SB_GOATCOUNTER_CODE + '.goatcounter.com/count');
    document.head.appendChild(s);
  })();
  // Safe no-op tracker: records a virtual pageview if GoatCounter is loaded,
  // silently does nothing otherwise. Never throws, never blocks the UI.
  window.sbTrack = function (path) {
    try {
      if (window.goatcounter && typeof window.goatcounter.count === 'function') {
        window.goatcounter.count({ path: path, title: path, event: false });
      }
    } catch (e) { /* analytics must never break the site */ }
  };
</script>

<script>
  var allData   = null;
  var activeCat = 'all';
  var activeSub = 'scores'; // sub-tab inside Sports Analytics: 'scores' | 'picks' | 'highlights' | 'predictions'
  var activeWidget = 'poll';
  var POLL = { question: '', options: [] };
  var PICKS = [];
  var PREDICTIONS = [];
  var HIGHLIGHTS = [];
  var INJURIES = [];

  // ESPN scoreboard endpoints for the Scores widget
  var ESPN_LEAGUES = [
    // US major leagues
    { id: 'nba', label: 'NBA', url: 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard' },
    { id: 'nfl', label: 'NFL', url: 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard'   },
    { id: 'mlb', label: 'MLB', url: 'https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard'   },
    { id: 'nhl', label: 'NHL', url: 'https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard'     },
    // Soccer — Europe + MLS
    { id: 'epl',        label: 'EPL',         url: 'https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard'            },
    { id: 'laliga',     label: 'La Liga',     url: 'https://site.api.espn.com/apis/site/v2/sports/soccer/esp.1/scoreboard'            },
    { id: 'bundesliga', label: 'Bundesliga',  url: 'https://site.api.espn.com/apis/site/v2/sports/soccer/ger.1/scoreboard'            },
    { id: 'seriea',     label: 'Serie A',     url: 'https://site.api.espn.com/apis/site/v2/sports/soccer/ita.1/scoreboard'            },
    { id: 'ligue1',     label: 'Ligue 1',     url: 'https://site.api.espn.com/apis/site/v2/sports/soccer/fra.1/scoreboard'            },
    { id: 'ucl',        label: 'UCL',         url: 'https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.champions/scoreboard'   },
    { id: 'mls',        label: 'MLS',         url: 'https://site.api.espn.com/apis/site/v2/sports/soccer/usa.1/scoreboard'            },
    // Major tournaments — only return games while in season
    { id: 'worldcup',   label: 'World Cup',   url: 'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard'        }
  ];
  var activeLeague = 'nba';
  var scoresCache = {};
  var scoresActiveDate = null; // YYYY-MM-DD; null = today

  var TAG = {
    media:     { label:'Media & Broadcast',    cls:'tag-media'     },
    contracts: { label:'Contracts',             cls:'tag-contracts' },
    leagues:   { label:'Leagues',               cls:'tag-leagues'   },
    revenue:   { label:'Revenue & Sponsorship', cls:'tag-revenue'   },
    labor:     { label:'Labor / Cap',           cls:'tag-labor'     },
    default:   { label:'Business',              cls:'tag-default'   }
  };

  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function openArticle(idx) {
    var data = allData;
    if (!data || !data.clusters) return;
    var cl = data.clusters[idx];
    if (!cl) return;
    var tag = TAG[cl.category] || TAG.default;
    showArticleModal(tag, cl.leadHeadline, cl.leadSource, cl.article || cl.summary || '');
  }

  function openSidebarByIndex(idx) {
    var item = sidebarStore[idx];
    if (!item) return;
    openSidebarArticle(item.headline, item.source, item.article || item.headline);
  }

  function openSidebarArticle(headline, source, article) {
    showArticleModal(TAG.default, headline, source, article || headline);
  }

  function showArticleModal(tag, headline, source, articleText) {
    document.getElementById('modal-tag').className = 'article-modal-tag ' + (tag ? tag.cls : 'tag-default');
    document.getElementById('modal-tag').textContent = tag ? tag.label : 'Sports Business';
    document.getElementById('modal-headline').textContent = headline || '';
    document.getElementById('modal-meta').textContent = source || '';
    var body = document.getElementById('modal-body');
    var paras = String(articleText).split('\n').filter(function(p){return p.trim();});
    body.innerHTML = paras.map(function(p){return '<p>'+esc(p)+'</p>';}).join('');
    document.getElementById('article-modal').style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }

  function closeArticle(e) {
    if (e.target === document.getElementById('article-modal')) closeArticleBtn();
  }

  function closeArticleBtn() {
    document.getElementById('article-modal').style.display = 'none';
    document.body.style.overflow = '';
  }

  // Sidebar widget is now poll-only (Scores and Predictions moved to main feed under Sports Analytics)
  function renderWidget() {
    var body = document.getElementById('widget-body');
    if (!body) return;
    body.innerHTML = buildPoll();
  }

  function buildPoll() {
    if (!POLL || !POLL.question) return '<div style="padding:16px;color:var(--ink-3);font-size:13px;">Poll loading...</div>';
    var voted = localStorage.getItem('sb_poll_v1');
    if (voted) {
      var votes = JSON.parse(localStorage.getItem('sb_poll_votes') || '{}');
      var total = Object.values(votes).reduce(function(a,b){return a+b;},0) || 1;
      return '<div class="poll-question">'+esc(POLL.question)+'</div>' +
        POLL.options.map(function(opt,i) {
          var pct = Math.round(((votes[i]||0)/total)*100);
          var winner = pct === Math.max.apply(null,Object.values(votes).map(function(v){return Math.round((v/total)*100);}));
          return '<div class="poll-result">'+
            '<div class="poll-result-label"><span>'+esc(opt)+'</span><span class="poll-result-pct">'+pct+'%</span></div>'+
            '<div class="poll-bar-track"><div class="poll-bar-fill'+(winner?' winner':'')+'" style="width:'+pct+'%"></div></div>'+
          '</div>';
        }).join('') +
        '<div style="font-size:10px;color:var(--ink-3);margin-top:8px;">'+total+' vote'+(total===1?'':'s')+'</div>';
    }
    return '<div class="poll-question">'+esc(POLL.question)+'</div>' +
      POLL.options.map(function(opt,i) {
        return '<button class="poll-option" onclick="votePoll('+i+')">'+esc(opt)+'</button>';
      }).join('');
  }

  function votePoll(idx) {
    var votes = JSON.parse(localStorage.getItem('sb_poll_votes') || '{}');
    votes[idx] = (votes[idx]||0)+1;
    localStorage.setItem('sb_poll_votes', JSON.stringify(votes));
    localStorage.setItem('sb_poll_v1', '1');
    renderWidget();
  }

  function renderScoresFeed() {
    var feed = document.getElementById('main-feed');
    var tabs = ESPN_LEAGUES.map(function(l) {
      var active = l.id === activeLeague ? ' active' : '';
      return '<button class="main-score-tab' + active + '" onclick="fetchScores(\'' + l.id + '\')">' + l.label + '</button>';
    }).join('');

    // Build date picker — ±7 days from today. ESPN has reliable data within
    // this window; further back gets spotty.
    var now = new Date();
    var todayStr = scoreDateToYMD(now);
    var activeDate = scoresActiveDate || todayStr;

    // Min/max for the date input: 14 days back, 14 days forward (covers
    // future schedules for major sports).
    var minDate = new Date(now); minDate.setDate(minDate.getDate() - 14);
    var maxDate = new Date(now); maxDate.setDate(maxDate.getDate() + 14);

    var prevDay = new Date(activeDate + 'T12:00:00'); prevDay.setDate(prevDay.getDate() - 1);
    var nextDay = new Date(activeDate + 'T12:00:00'); nextDay.setDate(nextDay.getDate() + 1);

    var dateLabel;
    if (activeDate === todayStr) dateLabel = 'Today';
    else {
      var d = new Date(activeDate + 'T12:00:00');
      var diffDays = Math.round((now.setHours(12,0,0,0) - d.getTime()) / 86400000);
      if (diffDays === 1) dateLabel = 'Yesterday';
      else if (diffDays === -1) dateLabel = 'Tomorrow';
      else dateLabel = d.toLocaleDateString('en-US',{weekday:'long', month:'short', day:'numeric'});
    }

    feed.innerHTML = '<div class="cluster" style="padding-top:4px;border-bottom:none;">' +
      '<div class="main-section-header">Live scores &amp; schedules</div>' +
      '<div class="scores-datebar">' +
        '<button class="scores-date-nav" onclick="navigateScoresDate(\'' + scoreDateToYMD(prevDay) + '\')" title="Previous day">‹</button>' +
        '<div class="scores-date-current">' +
          '<input type="date" class="scores-date-input" value="' + activeDate + '" min="' + scoreDateToYMD(minDate) + '" max="' + scoreDateToYMD(maxDate) + '" onchange="navigateScoresDate(this.value)">' +
          '<span class="scores-date-label">' + dateLabel + '</span>' +
        '</div>' +
        '<button class="scores-date-nav" onclick="navigateScoresDate(\'' + scoreDateToYMD(nextDay) + '\')" title="Next day">›</button>' +
        (activeDate !== todayStr ? '<button class="scores-date-today" onclick="navigateScoresDate(null)">Today</button>' : '') +
      '</div>' +
      '<div class="main-score-tabs">' + tabs + '</div>' +
      '<div id="scores-games" class="main-scores-grid"><div class="score-loading">Loading scores...</div></div>' +
    '</div>';
    fetchScores(activeLeague);
  }

  function scoreDateToYMD(d) {
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  // Called from prev/next/today buttons + date input
  window.navigateScoresDate = function(dateStr) {
    var todayStr = scoreDateToYMD(new Date());
    scoresActiveDate = (dateStr === todayStr || dateStr === null) ? null : dateStr;
    // Invalidate cache for this league since we're changing dates
    scoresCache = {};
    renderScoresFeed();
  };
