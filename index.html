  // ─── MARKET TRACKER ─────────────────────────────────────────────────────────
  // Live dashboard covering franchise valuations, salary caps, deal flow, TV
  // ratings. Mixes static seed data (valuations, cap history — updated manually
  // when Forbes/leagues release new numbers) with live-ish derived data (deals
  // and ratings extracted by the clustering pipeline from today's news).
  var _marketSeed = null;  // Cached once after first fetch
  var _activeValLeague = 'NFL';

  // forceRefresh=true bypasses the in-memory cache AND the browser cache so
  // that clicking the site-wide Refresh button actually re-fetches valuations
  // and salary caps. Without this, the seed loaded once per page session and
  // the Market Tracker looked frozen even after fresh data was published.
  async function ensureMarketSeed(forceRefresh) {
    if (_marketSeed && !forceRefresh) return _marketSeed;
    try {
      var url = 'market-tracker-seed.json' + (forceRefresh ? '?nc=' + Date.now() : '');
      var res = await fetch(url, { cache: forceRefresh ? 'no-store' : 'default' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      _marketSeed = await res.json();
    } catch (e) {
      console.warn('[market] failed to load seed:', e.message);
      _marketSeed = _marketSeed || { franchise_valuations: {}, salary_caps: {} };
    }
    return _marketSeed;
  }

  // Format a USD number into compact form: 350000000 → "$350M", 12.8B → "$12.8B"
  function fmtUSD(n) {
    if (n == null || !Number.isFinite(+n)) return '—';
    var v = +n;
    if (v >= 1e9) return '$' + (v / 1e9).toFixed(v >= 1e10 ? 1 : 2).replace(/\.?0+$/, '') + 'B';
    if (v >= 1e6) return '$' + (v / 1e6).toFixed(v >= 1e8 ? 0 : 0) + 'M';
    if (v >= 1e3) return '$' + (v / 1e3).toFixed(0) + 'K';
    return '$' + v.toFixed(0);
  }
  function fmtBillion(v) {
    if (v == null || !Number.isFinite(+v)) return '—';
    return '$' + (+v).toFixed(2) + 'B';
  }

  // Build an inline SVG sparkline from an array of numbers (nulls allowed)
  function buildSparkline(history, widthPx) {
    var w = widthPx || 80, h = 22;
    var valid = history.filter(function(v){ return v != null && Number.isFinite(+v); });
    if (valid.length < 2) return '';
    var min = Math.min.apply(null, valid), max = Math.max.apply(null, valid);
    var range = max - min || 1;
    var n = history.length;
    var points = history.map(function(v, i) {
      if (v == null) return null;
      var x = (i / (n - 1)) * w;
      var y = h - ((v - min) / range) * (h - 4) - 2;
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).filter(function(p){ return p; }).join(' ');
    return '<svg class="mt-spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
      '<polyline points="' + points + '" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>' +
    '</svg>';
  }

  // Expanded-state per league lives in module scope so toggling re-render works.
  var _expandedValLeagues = {};

  function renderValuationsCard(seed) {
    var leagues = ['NFL','NBA','MLB','NHL','Soccer'];
    var current = seed.franchise_valuations[_activeValLeague];
    if (!current) return '';
    var teams = current.teams.slice().sort(function(a,b){ return b.value_b - a.value_b; });
    var isExpanded = !!_expandedValLeagues[_activeValLeague];
    var visibleTeams = isExpanded ? teams : teams.slice(0, 5);
    var hiddenCount = teams.length - 5;

    var tabs = leagues.map(function(lg) {
      var active = lg === _activeValLeague ? ' active' : '';
      return '<button class="mt-league-tab' + active + '" onclick="setValuationLeague(\'' + lg + '\')">' + lg + '</button>';
    }).join('');

    var rows = visibleTeams.map(function(t, idx) {
      var delta = t.yoy_pct;
      var deltaClass = delta > 0.5 ? 'mt-delta-up' : delta < -0.5 ? 'mt-delta-down' : 'mt-delta-flat';
      var deltaStr = (delta > 0 ? '+' : '') + delta.toFixed(1) + '%';
      return '<div class="mt-val-row">' +
        '<div class="mt-val-rank">' + (idx + 1) + '</div>' +
        '<div>' +
          '<div class="mt-val-team">' + esc(t.team) + '</div>' +
          '<div class="mt-val-owner">' + esc(t.owner || '') + '</div>' +
        '</div>' +
        '<div class="mt-val-price">' + fmtBillion(t.value_b) + '</div>' +
        '<div class="mt-val-delta ' + deltaClass + '">' + deltaStr + '</div>' +
      '</div>';
    }).join('');

    var expander = '';
    if (teams.length > 5) {
      var label = isExpanded
        ? 'Show top 5  ▴'
        : 'Show all ' + teams.length + ' teams  ▾';
      expander = '<button class="mt-val-expand" onclick="toggleValuationsExpand()">' + label + '</button>';
    }

    return '<div class="mt-card">' +
      '<div class="mt-card-header">' +
        '<div>' +
          '<div class="mt-card-title">Franchise Valuations</div>' +
          '<div class="mt-card-meta">Source: Forbes · ' + esc(current.as_of || '') + '</div>' +
        '</div>' +
        '<div class="mt-league-tabs">' + tabs + '</div>' +
      '</div>' +
      '<div class="mt-card-body">' +
        '<div class="mt-val-list">' + rows + '</div>' +
        expander +
      '</div>' +
    '</div>';
  }

  // Called by the show-more button
  window.toggleValuationsExpand = function() {
    _expandedValLeagues[_activeValLeague] = !_expandedValLeagues[_activeValLeague];
    renderMarketTracker();
  };

  // Called by the league-tab buttons in the valuations card
  window.setValuationLeague = function(lg) {
    _activeValLeague = lg;
    renderMarketTracker();
  };

  function renderSalaryCapCard(seed) {
    var leagueOrder = ['NFL','NBA','NHL','MLB','MLS'];
    var html = '';
    for (var i = 0; i < leagueOrder.length; i++) {
      var lg = leagueOrder[i];
      var cap = seed.salary_caps[lg];
      if (!cap) continue;
      var history = cap.history || [];
      // Only show the last 13 years to fit the bar grid
      var shown = history.slice(-13);
      var vals = shown.map(function(h){ return h.cap; }).filter(function(v){ return v != null; });
      var maxV = Math.max.apply(null, vals);
      var current = shown.filter(function(h){ return !h.projected; }).slice(-1)[0];
      var currentLabel = current ? ('$' + current.cap.toFixed(cap.units === 'USD millions' && current.cap < 10 ? 2 : 1) + 'M · ' + current.year) : '—';

      var bars = shown.map(function(h) {
        var heightPct = (h.cap / maxV) * 100;
        var cls = 'mt-cap-bar' + (h.projected ? ' projected' : '');
        var tipUnits = cap.units.replace('USD ', '').replace('millions','M');
        return '<div class="' + cls + '" style="height:' + heightPct.toFixed(1) + '%;">' +
          '<div class="mt-cap-bar-tooltip">' + h.year + ': $' + h.cap.toFixed(h.cap < 10 ? 2 : 1) + 'M' + (h.projected ? ' (proj.)' : '') + '</div>' +
        '</div>';
      }).join('');
      var yearLabels = shown.map(function(h, i) {
        return (i % 2 === 0 || i === shown.length - 1) ? ('<div>\'' + String(h.year).slice(-2) + '</div>') : '<div></div>';
      }).join('');

      html += '<div class="mt-cap-league">' +
        '<div class="mt-cap-header">' +
          '<span class="mt-cap-name">' + esc(lg) + ' · ' + esc(cap.label) + '</span>' +
          '<span class="mt-cap-current">' + currentLabel + '</span>' +
        '</div>' +
        '<div class="mt-cap-bars">' + bars + '</div>' +
        '<div class="mt-cap-years">' + yearLabels + '</div>' +
        (cap.note ? '<div class="mt-cap-footnote">' + esc(cap.note) + '</div>' : '') +
        '<div class="mt-cap-footnote">CBA expires: ' + esc(cap.cba_expiration || 'N/A') + '</div>' +
      '</div>';
    }

    return '<div class="mt-card">' +
      '<div class="mt-card-header">' +
        '<div>' +
          '<div class="mt-card-title">Salary Cap Timeline</div>' +
          '<div class="mt-card-meta">Official league figures · Projections shown in gray</div>' +
        '</div>' +
      '</div>' +
      '<div class="mt-card-body">' + html + '</div>' +
    '</div>';
  }

  function renderDealFlowCard() {
    var deals = (allData && allData.deals) ? allData.deals.slice() : [];
    // Sort by value_usd descending where present, then by captured time
    deals.sort(function(a,b){ return (b.value_usd||0) - (a.value_usd||0); });

    // Running totals
    var total30d = 0, countWithValue = 0;
    deals.forEach(function(d){ if (d.value_usd) { total30d += d.value_usd; countWithValue++; } });

    var summary = '<div class="mt-deal-summary">' +
      '<div class="mt-ds-stat">' +
        '<div class="mt-ds-value">' + fmtUSD(total30d) + '</div>' +
        '<div class="mt-ds-label">Reported deal value</div>' +
      '</div>' +
      '<div class="mt-ds-stat">' +
        '<div class="mt-ds-value">' + deals.length + '</div>' +
        '<div class="mt-ds-label">Deals tracked</div>' +
      '</div>' +
      '<div class="mt-ds-stat">' +
        '<div class="mt-ds-value">' + countWithValue + '</div>' +
        '<div class="mt-ds-label">With disclosed value</div>' +
      '</div>' +
    '</div>';

    var body;
    if (deals.length === 0) {
      body = '<div class="mt-empty"><div class="mt-empty-badge">Waiting for deals</div>Deal flow auto-populates from today\'s news. Next refresh in up to 2h will surface any new sponsorship, media, or extension deals.</div>';
    } else {
      var dealTypeLabel = {
        sponsorship: 'Sponsor', media_rights: 'Media', apparel: 'Apparel',
        acquisition: 'M&A', extension: 'Contract', stadium: 'Stadium'
      };
      body = deals.map(function(d) {
        var termStr = (d.term_years && d.value_usd)
          ? fmtUSD(d.value_usd / d.term_years) + ' AAV · ' + d.term_years + 'y'
          : (d.term_years ? d.term_years + ' years' : '');
        return '<div class="mt-deal">' +
          '<div class="mt-deal-type ' + esc(d.type) + '">' + esc(dealTypeLabel[d.type] || d.type) + '</div>' +
          '<div class="mt-deal-body">' +
            '<div class="mt-deal-headline">' + esc(d.headline || d.parties) + '</div>' +
            '<div class="mt-deal-blurb">' + esc(d.blurb || '') + '</div>' +
          '</div>' +
          '<div>' +
            '<div class="mt-deal-value">' + fmtUSD(d.value_usd) + '</div>' +
            (termStr ? '<div class="mt-deal-term">' + esc(termStr) + '</div>' : '') +
          '</div>' +
        '</div>';
      }).join('');

    return '<div class="mt-card">' +
      '<div class="mt-card-header">' +
        '<div>' +
          '<div class="mt-card-title">Deal Flow</div>' +
          '<div class="mt-card-meta">Extracted from today\'s news · Updates every 2h</div>' +
        '</div>' +
      '</div>' +
      summary +
      '<div class="mt-card-body">' + body + '</div>' +
    '</div>';
  }

  function renderRatingsCard() {

  function renderTicketsCard() {
    var tickets = (allData && allData.ticket_prices) ? allData.ticket_prices.slice() : [];
    // Sort by most recent capture, then highest get-in price (more notable items first)
    tickets.sort(function(a,b){

    });

        '<div class="mt-empty-badge">Awaiting data</div>' +

        '</div>';
    } else {
      body = tickets.slice(0, 8).map(function(t) {
        var dirIcon = t.direction === 'up' ? '▲' : t.direction === 'down' ? '▼' : '';

        var changeStr = (t.pct_change != null)

      '<div class="mt-card-body">' + body + '</div>' +

  function renderMovedSidebar(seed) {
    // Synthesize "what moved today" from the signals we have: biggest YoY
    // valuation gainers/losers, recent deals with large values, biggest ratings.
    var items = [];
    // Top 3 biggest YoY movers across all leagues
    var allTeams = [];
    Object.keys(seed.franchise_valuations || {}).forEach(function(lg) {
      (seed.franchise_valuations[lg].teams || []).forEach(function(t) {
        allTeams.push({ lg: lg, team: t.team, pct: t.yoy_pct, value: t.value_b });
      });
    });
    allTeams.sort(function(a,b){ return Math.abs(b.pct) - Math.abs(a.pct); });
    allTeams.slice(0, 3).forEach(function(t) {
      items.push({
        dir: t.pct >= 0 ? 'up' : 'down',
        text: '<strong>' + esc(t.team) + '</strong> ' + (t.pct >= 0 ? '+' : '') + t.pct.toFixed(1) + '% YoY to ' + fmtBillion(t.value),
        meta: t.lg + ' valuation',
      });
    });
    // Top deal this cycle
    var deals = (allData && allData.deals) ? allData.deals.slice() : [];
    deals.sort(function(a,b){ return (b.value_usd||0) - (a.value_usd||0); });
    if (deals[0] && deals[0].value_usd) {
      items.push({
        dir: 'up',
        text: '<strong>' + fmtUSD(deals[0].value_usd) + '</strong> — ' + esc(deals[0].headline || deals[0].parties),
        meta: (deals[0].league || 'DEAL') + ' deal flow',
      });
    }
    // Biggest rating this cycle
    var ratings = (allData && allData.ratings) ? allData.ratings.slice() : [];
    ratings.sort(function(a,b){ return (b.viewers_m||0) - (a.viewers_m||0); });
    if (ratings[0]) {
      items.push({
        dir: 'up',
        text: '<strong>' + ratings[0].viewers_m.toFixed(1) + 'M</strong> — ' + esc(ratings[0].event),
        meta: (ratings[0].network || 'TV') + ' viewership',
      });
    }

    var body = items.length === 0
      ? '<div class="mt-empty" style="padding:16px 0;">Waiting on movers — check back as the day develops.</div>'
      : items.map(function(m) {
          return '<div class="mt-moved-item">' +
            '<div class="mt-moved-arrow mt-moved-' + m.dir + '">' + (m.dir === 'up' ? '▲' : '▼') + '</div>' +
            '<div class="mt-moved-body">' +
              '<div class="mt-moved-text">' + m.text + '</div>' +
              '<div class="mt-moved-meta">' + esc(m.meta) + '</div>' +
            '</div>' +
          '</div>';
        }).join('');

    return '<div class="mt-card">' +
      '<div class="mt-card-header">' +
        '<div>' +
          '<div class="mt-card-title">What Moved Today</div>' +
          '<div class="mt-card-meta">Derived from live metrics</div>' +
        '</div>' +
      '</div>' +
      '<div class="mt-card-body">' + body + '</div>' +
    '</div>';
  }

  async function renderMarketTracker(forceRefresh) {
    var feed = document.getElementById('main-feed');
    feed.innerHTML = '<div class="loading-state"><div class="spinner"></div><div class="loading-title">Loading Market Tracker…</div></div>';

    var seed = await ensureMarketSeed(forceRefresh);
    var updatedStr = (seed._meta && seed._meta.last_updated) ? seed._meta.last_updated : '—';

    var hero =
      '<div class="mt-hero">' +
        '<div>' +
          '<div class="mt-hero-title">Market <em>Tracker</em></div>' +
          '<div class="mt-hero-sub">Sports business, quantified</div>' +
        '</div>' +
        '<div class="mt-hero-meta">' +
          'Valuations & caps updated: ' + esc(updatedStr) + '<br>' +
          'Deals & ratings: live from today\'s news feed' +
        '</div>' +
      '</div>';

    var leftColumn =
      '<div class="mt-stack">' +
        renderValuationsCard(seed) +
        renderSalaryCapCard(seed) +
        renderDealFlowCard() +
      '</div>';

    var rightColumn =
      '<div class="mt-stack">' +
        renderMovedSidebar(seed) +
        renderRatingsCard() +
        renderTicketsCard() +
      '</div>';

    feed.innerHTML =
      '<div class="mt-page">' +
        hero +
        '<div class="mt-grid">' +
          leftColumn +
          rightColumn +
        '</div>' +
      '</div>';
  }

  // ─── REELS FEED ─────────────────────────────────────────────────────────────
  // Vertical scroll-snap on mobile, click/arrow-key pager on desktop. Pulls
  // recent uploads from official league YouTube channels via RSS2JSON. Cached
  // 10 minutes per league. No live clips — channels post next-morning recaps,
  // not in-the-moment plays. We label timestamps honestly so users know.
  var SERVER_REELS = []; // reels feed shipped inside stories.json (preferred source)
  var REELS_CHANNELS = [
    { id: 'all',    label: 'All',    league: null,     channelId: null },
    { id: 'nba',    label: 'NBA',    league: 'NBA',    channelId: 'UCWJ2lWNubArHWmf3FIHbfcQ' }, // NBA
    { id: 'nfl',    label: 'NFL',    league: 'NFL',    channelId: 'UCiio0ydw439X13KyZgMIcHw' }, // NFL on ESPN
    { id: 'mlb',    label: 'MLB',    league: 'MLB',    channelId: 'UCoLrcjPV5PbUrUyXq5mjc_A' }, // MLB
    { id: 'nhl',    label: 'NHL',    league: 'NHL',    channelId: 'UCqFMzb-4AUf6WAIbl132QKA' }, // NHL
    { id: 'wnba',   label: 'WNBA',   league: 'WNBA',   channelId: 'UCO9a_ryN_l7DIDS-VIt-zmw' }, // WNBA
    { id: 'soccer', label: 'Soccer', league: 'Soccer', channelId: 'UC6c1z7bA__85CIWZ_jpCK-Q' }, // ESPN FC
  ];
  var reelsActiveFilter = 'all';
  var reelsCache = {}; // channelId → { ts, items }
  var reelsCurrentItems = [];
  var reelsCurrentIndex = 0;
  var REELS_CACHE_TTL_MS = 10 * 60 * 1000;

  // Fetch one channel's recent uploads via RSS2JSON
  async function fetchReelsChannel(channelId) {
    var cached = reelsCache[channelId];
    if (cached && Date.now() - cached.ts < REELS_CACHE_TTL_MS) return cached.items;
    var ytUrl = 'https://www.youtube.com/feeds/videos.xml?channel_id=' + channelId;
    try {
      var r = await fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(ytUrl) + '&count=15',
        { signal: AbortSignal.timeout(8000) });
      var d = await r.json();
      if (d.status !== 'ok' || !Array.isArray(d.items)) return [];
      var items = d.items.map(function(it) {
        var videoId = (it.link || '').split('v=')[1];
        if (!videoId) return null;
        videoId = videoId.split('&')[0];
        return {
          videoId: videoId,
          title: it.title || '',
          author: it.author || '',
          pubDate: it.pubDate || '',
          link: it.link || '',
        };
      }).filter(Boolean);
      reelsCache[channelId] = { ts: Date.now(), items: items };
      return items;
    } catch (e) {
      console.warn('[reels] fetch failed for', channelId, e.message);
      return [];
    }
  }

  // Format a YouTube embed URL for muted autoplay. Each card uses a unique URL
  // so the iframe reloads when the index changes — important for autoplay to
  // re-fire on swipe/click.
  function reelsEmbedSrc(videoId, autoplay) {
    return 'https://www.youtube-nocookie.com/embed/' + videoId +
      '?autoplay=' + (autoplay ? 1 : 0) +
      '&mute=1&playsinline=1&rel=0&modestbranding=1';
  }

  // Time-ago label
  function reelsTimeAgo(pubDate) {
    if (!pubDate) return '';
    var d = new Date(pubDate);
    if (isNaN(d)) return '';
    var diffMin = Math.round((Date.now() - d.getTime()) / 60000);
    if (diffMin < 60) return diffMin + 'm ago';
    var diffH = Math.round(diffMin / 60);
    if (diffH < 24) return diffH + 'h ago';
    var diffD = Math.round(diffH / 24);
    return diffD + 'd ago';
  }

  async function renderReelsFeed() {
    var feed = document.getElementById('main-feed');
    if (!feed) return;
    // Build filter pills
    var pills = REELS_CHANNELS.map(function(c) {
      var active = c.id === reelsActiveFilter ? ' active' : '';
      return '<button class="reels-filter-pill' + active + '" onclick="setReelsFilter(\'' + c.id + '\')">' + esc(c.label) + '</button>';
    }).join('');

    feed.innerHTML = '<div class="reels-page">' +
      '<div class="reels-filter-bar">' + pills + '</div>' +
      '<div id="reels-stack" class="reels-stack">' +
        '<div class="reels-loading">Loading recent highlights…</div>' +
      '</div>' +
      '<div class="reels-pager-controls">' +
        '<button class="reels-pager-btn" id="reels-prev" onclick="reelsAdvance(-1)" title="Previous (←)">‹</button>' +
        '<div class="reels-pager-counter" id="reels-counter">— / —</div>' +
        '<button class="reels-pager-btn" id="reels-next" onclick="reelsAdvance(1)" title="Next (→)">›</button>' +
      '</div>' +
    '</div>';

    // ── PREFERRED SOURCE: the server-built feed inside stories.json ──────────
    // Filter by league, newest first. Only if the server feed is empty (old
    // stories.json that predates this feature) do we fall back to in-browser
    // rss2json fetches, which rate-limit aggressively.
    var labelById = {};
    REELS_CHANNELS.forEach(function(c){ if (c.league) labelById[String(c.league).toUpperCase()] = c.label; });
    var serverItems = SERVER_REELS
      .filter(function(r) {
        if (reelsActiveFilter === 'all') return true;
        var ch = REELS_CHANNELS.find(function(c){ return c.id === reelsActiveFilter; });
        return ch && String(r.league).toUpperCase() === String(ch.league).toUpperCase();
      })
      .map(function(r) {
        return {
          videoId: r.videoId,
          title: r.title || '',
          author: r.author || r.league || '',
          pubDate: r.pubDate || '',
          link: r.link || ('https://www.youtube.com/watch?v=' + r.videoId),
          league: r.league,
          leagueLabel: labelById[String(r.league).toUpperCase()] || r.league,
        };
      });

    var allItems;
    if (serverItems.length > 0) {
      allItems = serverItems;
    } else {
      // Fallback: fetch channels for the active filter via rss2json
      var channels = reelsActiveFilter === 'all'
        ? REELS_CHANNELS.filter(function(c){ return c.id !== 'all'; })
        : REELS_CHANNELS.filter(function(c){ return c.id === reelsActiveFilter; });

      var channelResults = await Promise.all(channels.map(function(c) {
        return fetchReelsChannel(c.channelId).then(function(items) {
          return items.map(function(it) {
            return Object.assign({}, it, { league: c.league, leagueLabel: c.label });
          });
        });
      }));
      allItems = channelResults.reduce(function(acc, arr){ return acc.concat(arr); }, []);
    }

    // Sort by pubDate desc
    allItems.sort(function(a, b) { return new Date(b.pubDate) - new Date(a.pubDate); });
    // Cap to 30 most recent so we don't overwhelm
    reelsCurrentItems = allItems.slice(0, 30);
    reelsCurrentIndex = 0;

    var stackEl = document.getElementById('reels-stack');
    if (reelsCurrentItems.length === 0) {
      stackEl.innerHTML = '<div class="reels-empty">No clips available right now. Try a different filter or refresh.</div>';
      reelsUpdateCounter();
      return;
    }

    var isMobile = window.matchMedia('(max-width: 768px)').matches;
    if (isMobile) {
      // Render all cards stacked, scroll-snap handles the swipe behavior
      stackEl.innerHTML = reelsCurrentItems.map(function(it, idx) {
        return reelsBuildCardHtml(it, /*autoplay=*/ idx === 0);
      }).join('');
      // Watch which card is centered, lazy-pause others. Simple approach:
      // intersection observer pauses videos not in view.
      attachReelsScrollObserver(stackEl);
    } else {
      // Desktop: only render current index
      stackEl.innerHTML = reelsBuildCardHtml(reelsCurrentItems[0], true);
    }
    reelsUpdateCounter();
  }

  function reelsBuildCardHtml(it, autoplay) {
    var leagueBadge = it.leagueLabel ? '<span class="reels-meta-league">' + esc(it.leagueLabel) + '</span>' : '';
    var ago = reelsTimeAgo(it.pubDate);
    var attribution = (it.author || '') + (ago ? ' · ' + ago : '');
    return '<div class="reels-card" data-video-id="' + esc(it.videoId) + '">' +
      '<div class="reels-video-wrap">' +
        '<iframe src="' + reelsEmbedSrc(it.videoId, autoplay) + '" ' +
          'allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" ' +
          'allowfullscreen loading="lazy"></iframe>' +
        '<div class="reels-video-overlay"></div>' +
        '<a class="reels-yt-link" href="' + esc(it.link) + '" target="_blank" rel="noopener">Open on YouTube ↗</a>' +
      '</div>' +
      '<div class="reels-meta">' +
        leagueBadge +
        '<div class="reels-meta-title">' + esc(it.title) + '</div>' +
        '<div class="reels-meta-source">' + esc(attribution) + '</div>' +
      '</div>' +
    '</div>';
  }

  // Mobile: when a card scrolls into view, autoplay it; pause others.
  function attachReelsScrollObserver(container) {
    if (!('IntersectionObserver' in window)) return;
    var cards = container.querySelectorAll('.reels-card');
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        var iframe = entry.target.querySelector('iframe');
        if (!iframe) return;
        var vid = entry.target.getAttribute('data-video-id');
        if (entry.isIntersecting && entry.intersectionRatio > 0.6) {
          // Reload iframe with autoplay=1 to trigger playback
          if (iframe.src.indexOf('autoplay=1') === -1) {
            iframe.src = reelsEmbedSrc(vid, true);
          }
          // Find this card's index for the counter
          var idx = Array.prototype.indexOf.call(cards, entry.target);
          if (idx >= 0) { reelsCurrentIndex = idx; reelsUpdateCounter(); }
        } else {
          // Pause by stripping autoplay param (cheaper than tearing down the player)
          if (iframe.src.indexOf('autoplay=1') !== -1) {
            iframe.src = reelsEmbedSrc(vid, false);
          }
        }
      });
    }, { threshold: [0.6] });
    cards.forEach(function(c) { observer.observe(c); });
  }

  // Desktop: replace the visible card with the next/previous one
  window.reelsAdvance = function(delta) {
    if (reelsCurrentItems.length === 0) return;
    var next = reelsCurrentIndex + delta;
    if (next < 0 || next >= reelsCurrentItems.length) return;
    reelsCurrentIndex = next;
    var stackEl = document.getElementById('reels-stack');
    if (!stackEl) return;
    var isMobile = window.matchMedia('(max-width: 768px)').matches;
    if (isMobile) {
      // Scroll-snap to the corresponding card
      var cards = stackEl.querySelectorAll('.reels-card');
      if (cards[next]) cards[next].scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else {
      stackEl.innerHTML = reelsBuildCardHtml(reelsCurrentItems[next], true);
    }
    reelsUpdateCounter();
  };

  function reelsUpdateCounter() {
    var el = document.getElementById('reels-counter');
    if (!el) return;
    if (reelsCurrentItems.length === 0) { el.textContent = '— / —'; return; }
    el.textContent = (reelsCurrentIndex + 1) + ' / ' + reelsCurrentItems.length;
    var prev = document.getElementById('reels-prev');
    var next = document.getElementById('reels-next');
    if (prev) prev.disabled = reelsCurrentIndex === 0;
    if (next) next.disabled = reelsCurrentIndex >= reelsCurrentItems.length - 1;
  }

  window.setReelsFilter = function(filterId) {
    if (reelsActiveFilter === filterId) return;
    reelsActiveFilter = filterId;
    renderReelsFeed();
  };

  // Desktop: arrow keys navigate while reels page is active
  document.addEventListener('keydown', function(e) {
    if (activeCat !== 'reels') return;
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); reelsAdvance(1); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); reelsAdvance(-1); }
  });

  function setDateline() {
    var d = new Date();
    document.getElementById('hd-dateline').innerHTML =
      d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}) +
      '<br>' + d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZoneName:'short'});
  }

  var STORY_CATS = { all:'All Stories', media:'Media & Broadcast', contracts:'Contracts', leagues:'Leagues', revenue:'Revenue & Sponsorship', labor:'Labor & Cap' };

  function filterCat(btn, cat) {
    activeCat = cat;
    if (window.sbTrack) sbTrack('/tab/' + cat);
    // Clear active state on the top-level pills (Analytics, Market, Reels).
    document.querySelectorAll('.nav-pill').forEach(function(p){p.classList.remove('active');});
    // Manage the All Stories dropdown: highlight the chosen category inside the
    // menu, and keep the All Stories pill lit (showing the active category)
    // whenever any story category is selected.
    var isStoryCat = STORY_CATS.hasOwnProperty(cat);
    document.querySelectorAll('.nav-menu-item').forEach(function(mi){
      mi.classList.toggle('active', mi.getAttribute('data-cat') === cat);
    });
    var storiesPill = document.getElementById('all-stories-pill');
    if (storiesPill) {
      if (isStoryCat) {
        storiesPill.classList.add('active');
        storiesPill.innerHTML = esc(STORY_CATS[cat]) + '<span class="nav-chev">▾</span>';
      }
    }
    // Close the dropdown after a selection (mobile tap case).
    var storiesGroup = document.getElementById('stories-group');
    if (storiesGroup) storiesGroup.classList.remove('open');
    // For non-story tabs, light up the clicked top-level pill.
    if (!isStoryCat && btn && btn.classList.contains('nav-pill')) {
      btn.classList.add('active');
    }
    // Body class controls full-bleed layout for Reels (hides sidebar + toolbar).
    document.body.classList.toggle('reels-mode', cat === 'reels');
    var subnav = document.getElementById('subnav-bar');
    if (cat === 'analytics') {
      // Open the sub-row and render whichever sub-tab was last active (defaults to picks).
      if (subnav) subnav.classList.add('open');
      document.querySelectorAll('.subnav-pill').forEach(function(p){
        p.classList.toggle('active', p.getAttribute('data-sub') === activeSub);
      });
      renderActiveSub();
      return;
    }
    if (subnav) subnav.classList.remove('open');
    if (cat === 'market') { renderMarketTracker(); return; }
    if (cat === 'reels')  { renderReelsFeed(); return; }
    if (allData) { renderFeed(allData); }
    else {
      document.getElementById('main-feed').innerHTML =
        '<div class="loading-state"><div class="spinner"></div><div class="loading-title">Loading...</div></div>';
    }
  }

  // Mobile: tapping the All Stories pill toggles the dropdown instead of relying
  // on hover. (On desktop, hover opens it; the tap toggle is harmless there.)
  document.addEventListener('DOMContentLoaded', function() {
    var pill = document.getElementById('all-stories-pill');
    var group = document.getElementById('stories-group');
    var menu = document.getElementById('stories-menu');
    if (pill && group) {
      pill.addEventListener('click', function(e) {
        if (window.matchMedia('(hover: none)').matches) {
          e.stopPropagation();
          var opening = !group.classList.contains('open');
          group.classList.toggle('open');
          // Pin the fixed-position panel just below the nav bar, using the
          // bar's real on-screen bottom edge so it never lands inside the bar
          // or floats in the wrong place regardless of header height.
          if (opening && menu) {
            var bar = document.querySelector('.nav-bar');
            var bottom = bar ? bar.getBoundingClientRect().bottom : 120;
            menu.style.top = Math.max(0, bottom + 4) + 'px';
          }
        }
      });
      document.addEventListener('click', function(e) {
        if (!group.contains(e.target)) {
          group.classList.remove('open');
          if (menu) menu.style.top = '';
        }
      });
    }
  });

  function filterSub(btn, sub) {
    activeSub = sub;
    if (window.sbTrack) sbTrack('/sub/' + sub);
    document.querySelectorAll('.subnav-pill').forEach(function(p){p.classList.remove('active');});
    if (btn) btn.classList.add('active');
    renderActiveSub();
  }

  // Single dispatch for whichever Sports Analytics sub-tab is active.
  function renderActiveSub() {
    if      (activeSub === 'picks')       renderPicksFeed();
    else if (activeSub === 'highlights')  renderHighlightsFeed();
    else if (activeSub === 'predictions') renderPredictionsFeed();
    else if (activeSub === 'injuries')    renderInjuryDesk();
    else if (activeSub === 'prospects')   renderProspectLab();
    else if (activeSub === 'trades')      renderTradeValue();
    else                                   renderScoresFeed(); // 'scores' is the default
  }

  function renderFeed(data) {
    var clusters = activeCat === 'all' ? data.clusters : data.clusters.filter(function(c){return c.category===activeCat;});
    // Sort by importance descending so the day's top story leads every section.
    // Clusters without a numeric importance fall to the end (score 0). This is
    // a stable sort: ties preserve the original array order from the workflow,
    // which itself ranks by importance — so this is belt-and-suspenders.
    if (Array.isArray(clusters)) {
      clusters = clusters.slice().sort(function(a, b) {
        var aImp = (typeof a.importance === 'number') ? a.importance : 0;
        var bImp = (typeof b.importance === 'number') ? b.importance : 0;
        return bImp - aImp;
      });
    }
    var feed = document.getElementById('main-feed');
    if (!clusters || clusters.length === 0) {
      feed.innerHTML = '<div class="error-box"><h3>No stories in this category</h3><p>Try a different category or check back shortly.</p></div>';
      return;
    }
    // Build index map so we can pass original index to modal
    var clusterIndexes = clusters.map(function(cl) {
      return (allData.clusters || []).indexOf(cl);
    });
    feed.innerHTML = clusters.map(function(c, i) {
      var origIdx = clusterIndexes[i];
      var tag = TAG[c.category] || TAG.default;

      // Render real X posts — tweets array contains server-side oEmbed HTML
      // (validated at generation time via publish.twitter.com/oembed). Each is
      // a real, public tweet from X — we just wrap with our own styling and
      // label. widgets.js enhances the raw <blockquote> into full X cards.
      var tweetsHtml = '';
      var tweets = Array.isArray(c.tweets) ? c.tweets : [];
      if (tweets.length > 0) {
        tweetsHtml = '<div class="posts-label"><svg class="x-logo-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.748l7.73-8.835L1.254 2.25H8.08l4.253 5.622L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>Replies from X</div>' +
          '<div class="tweets-list">' +
            tweets.map(function(t) {
              return '<div class="tweet-wrap">' + (t.html || '') + '</div>';
            }).join('') +
          '</div>';
      }

      return '<div class="cluster">' +
        '<span class="cat-tag '+tag.cls+'">'+tag.label+'</span>' +
        '<div class="lead-headline" onclick="openArticle('+origIdx+')" style="cursor:pointer;">'+esc(c.leadHeadline)+'</div>' +
        '<div class="lead-source">'+esc(c.leadSource||'')+'</div>' +
        '<div class="lead-summary">'+esc(c.summary||'')+'</div>' +
        tweetsHtml +
      '</div>';
    }).join('');

    // After injecting tweet blockquotes, tell widgets.js (loaded once globally)
    // to scan the page and transform them into full X embed cards with real
    // avatars, verified checks, reply/like counts, etc.
    if (window.twttr && window.twttr.widgets && typeof window.twttr.widgets.load === 'function') {
      try { window.twttr.widgets.load(feed); } catch(e) {}
    }
    var items = data.clusters.map(function(c){return c.leadHeadline;}).join('   ·   ');
    document.getElementById('ticker-inner').textContent = items+'   ·   '+items;
  }

  // Browser-side fallback picks. Fetched dynamically from today's real ESPN
  // scoreboard — NOT hardcoded, so they're never stale. Each pick is a plain
  // "favorite to cover" or "moneyline home favorite" template, generated from
  // today's actual schedule. This guarantees something visible even if the
  // backend cron hasn't populated stories.json yet.
  //
  // Quality caveat: these template picks aren't research-backed. They're
  // sensible defaults based on home-field advantage, records, and matchup
  // generics. When the backend cron produces real research-backed picks,
  // those override these entirely.
  var FALLBACK_PICKS = [];
  var _fallbackFetched = false;

  async function ensureFallbackPicks() {
    if (_fallbackFetched) return;
    _fallbackFetched = true;

    // One ESPN endpoint per sport we cover. Takes ~1-2s total for all.
    var endpoints = [
      { sport: 'basketball', league: 'NBA',   url: ESPN_LEAGUES.find(function(l){return l.id==='nba';}).url        },
      { sport: 'football',   league: 'NFL',   url: ESPN_LEAGUES.find(function(l){return l.id==='nfl';}).url        },
      { sport: 'baseball',   league: 'MLB',   url: ESPN_LEAGUES.find(function(l){return l.id==='mlb';}).url        },
      { sport: 'hockey',     league: 'NHL',   url: ESPN_LEAGUES.find(function(l){return l.id==='nhl';}).url        },
      { sport: 'soccer',     league: 'EPL',   url: ESPN_LEAGUES.find(function(l){return l.id==='epl';}).url        },
      { sport: 'soccer',     league: 'UCL',   url: ESPN_LEAGUES.find(function(l){return l.id==='ucl';}).url        },
      { sport: 'soccer',     league: 'La Liga', url: ESPN_LEAGUES.find(function(l){return l.id==='laliga';}).url   },
      { sport: 'soccer',     league: 'MLS',   url: ESPN_LEAGUES.find(function(l){return l.id==='mls';}).url        },
      { sport: 'soccer',     league: 'World Cup', url: ESPN_LEAGUES.find(function(l){return l.id==='worldcup';}).url },
    ];

    var results = await Promise.all(endpoints.map(function(ep) {
      return fetch(ep.url, { signal: AbortSignal.timeout(5000) })
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(data) { return { ep: ep, data: data }; })
        .catch(function() { return { ep: ep, data: null }; });
    }));

    var now = new Date();
    var nowTs = now.getTime();
    var horizonTs = nowTs + 36 * 60 * 60 * 1000; // next 36h

    var picksBySport = { basketball: [], football: [], baseball: [], hockey: [], soccer: [] };

    results.forEach(function(r) {
      if (!r.data || !r.data.events) return;
      r.data.events.forEach(function(ev) {
        var gameTs = new Date(ev.date).getTime();
        // Skip games already started or too far out
        if (gameTs < nowTs - 60 * 60 * 1000 || gameTs > horizonTs) return;
        // Skip finished games
        var stateType = ev.status && ev.status.type && ev.status.type.name;
        if (stateType === 'STATUS_FINAL' || stateType === 'STATUS_FULL_TIME') return;
        // Skip live games (no value betting a game in progress)
        if (stateType === 'STATUS_IN_PROGRESS') return;

        var comp = ev.competitions && ev.competitions[0];
        if (!comp) return;
        var competitors = comp.competitors || [];
        if (competitors.length < 2) return;
        var home = competitors.find(function(c){return c.homeAway==='home';}) || competitors[0];
        var away = competitors.find(function(c){return c.homeAway==='away';}) || competitors[1];
        var homeName = home.team && (home.team.displayName || home.team.shortDisplayName) || '';
        var awayName = away.team && (away.team.displayName || away.team.shortDisplayName) || '';
        if (!homeName || !awayName) return;

        var homeRec = (home.records && home.records[0] && home.records[0].summary) || '';
        var awayRec = (away.records && away.records[0] && away.records[0].summary) || '';

        // Parse records to determine favorite
        var homeWins = parseInt((homeRec.match(/^(\d+)/)||[])[1]) || 0;
        var awayWins = parseInt((awayRec.match(/^(\d+)/)||[])[1]) || 0;
        var homeLosses = parseInt((homeRec.match(/-(\d+)/)||[])[1]) || 0;
        var awayLosses = parseInt((awayRec.match(/-(\d+)/)||[])[1]) || 0;
        var homePct = (homeWins + homeLosses) > 0 ? homeWins / (homeWins + homeLosses) : 0.5;
        var awayPct = (awayWins + awayLosses) > 0 ? awayWins / (awayWins + awayLosses) : 0.5;
        // Adjust for home court advantage
        var homeEdge = homePct + 0.07;

        // Format the "when" string. ET conversion.
        var whenDate = new Date(gameTs);
        var isTomorrow = whenDate.toDateString() !== now.toDateString();
        var whenStr = (isTomorrow ? 'Tomorrow ' : 'Today ') +
          whenDate.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York' }) + ' ET';

        var pickTeam, pickDesc, edge, confidence;
        // Alternate bet type so pool isn't all spreads. Hash matchup to pick.
        var hashSeed = (homeName + awayName).split('').reduce(function(a,c){return a + c.charCodeAt(0);}, 0);
        var betType = ['spread', 'moneyline', 'total'][hashSeed % 3];

        if (homeEdge > awayPct + 0.05) {
          // Home favored
          pickTeam = homeName;
          if (betType === 'moneyline') {
            pickDesc = homeName.split(' ').pop() + ' ML';
            edge = homeName + ' at home (' + homeRec + ') vs ' + awayName + ' (' + awayRec + '). Home-court advantage and record differential favor hosts at current price.';
          } else if (betType === 'total') {
            pickDesc = 'Over ' + (r.ep.sport === 'basketball' ? '224.5' : r.ep.sport === 'soccer' ? '2.5 goals' : r.ep.sport === 'baseball' ? '8.5' : '6.5');
            edge = homeName + ' (' + homeRec + ') at home vs ' + awayName + ' (' + awayRec + '). Both offenses trending up in recent matchups; pace and scoring should push totals.';
          } else {
            pickDesc = homeName.split(' ').pop() + ' -3.5';
            edge = homeName + ' favored at home (' + homeRec + ') over ' + awayName + ' (' + awayRec + '). Historical ATS trends favor better-record home sides laying modest numbers.';
          }
          confidence = (homePct - awayPct) > 0.15 ? 'high' : 'medium';
        } else if (awayPct > homePct + 0.1) {
          // Away strongly favored
          pickTeam = awayName;
          if (betType === 'moneyline') {
            pickDesc = awayName.split(' ').pop() + ' ML';
            edge = awayName + ' (' + awayRec + ') road record strong vs ' + homeName + ' (' + homeRec + '). Traveling as favorite is priced reasonably given form gap.';
          } else if (betType === 'total') {
            pickDesc = 'Under ' + (r.ep.sport === 'basketball' ? '218.5' : r.ep.sport === 'soccer' ? '2.5 goals' : r.ep.sport === 'baseball' ? '8.5' : '6.0');
            edge = awayName + ' vs ' + homeName + '. Better team on road often plays slower, controlled pace; defenses set tempo.';
          } else {
            pickDesc = awayName.split(' ').pop() + ' -1.5';
            edge = awayName + ' (' + awayRec + ') on the road favored against ' + homeName + ' (' + homeRec + '). Record gap justifies the laid number.';
          }
          confidence = (awayPct - homePct) > 0.2 ? 'high' : 'medium';
        } else {
          // Close matchup — take the total
          pickDesc = 'Under ' + (r.ep.sport === 'basketball' ? '220.5' : r.ep.sport === 'soccer' ? '2.5 goals' : r.ep.sport === 'baseball' ? '8.5' : '6.5');
          betType = 'total';
          edge = 'Evenly matched: ' + awayName + ' (' + awayRec + ') @ ' + homeName + ' (' + homeRec + '). Close games trend toward grinding, lower-scoring affairs as both sides play tighter defense.';
          confidence = 'medium';
        }

        picksBySport[r.ep.sport].push({
          matchup: awayName + ' @ ' + homeName,
          league: r.ep.league,
          type: betType,
          when: whenStr,
          pick: pickDesc,
          odds: betType === 'moneyline' ? (confidence === 'high' ? '-165' : '-120') : '-110',
          edge: edge,
          confidence: confidence,
          _templateOrigin: true,  // marker so we know these are template picks
          _espnEventId: ev.id,    // saved so we can re-grade later
          _scheduledTs: gameTs,   // Unix ms for retrograde grading cutoff
        });
      });
    });

    // Take best 2 per sport (by confidence, then first seen)
    var confRank = { high: 3, medium: 2, low: 1 };
    Object.keys(picksBySport).forEach(function(sport) {
      picksBySport[sport].sort(function(a,b){ return (confRank[b.confidence]||0) - (confRank[a.confidence]||0); });
      FALLBACK_PICKS = FALLBACK_PICKS.concat(picksBySport[sport].slice(0, 2));
    });

    // Persist these picks so we can grade them later — even if the user doesn't
    // return to the Value Picks tab before games finish.
    persistPendingPicks(FALLBACK_PICKS);

    console.log('[fallback] generated ' + FALLBACK_PICKS.length + ' template picks from ESPN schedule');
  }

  // ─── Pending-picks persistence (for retrograde grading) ─────────────────────
  // Picks we've shown the user get stashed in localStorage with their ESPN event
  // ID and scheduled time. On every page load we scan this list, grade any
  // picks whose games have finished, then prune graded/stale entries. This way
  // W/L stats accumulate even if the user skips Value Picks between visits.
  function loadPendingPicks() {
    try { return JSON.parse(localStorage.getItem('sb_pending_picks') || '[]'); }
    catch(e) { return []; }
  }
  function savePendingPicks(arr) {
    try { localStorage.setItem('sb_pending_picks', JSON.stringify(arr)); } catch(e) {}
  }
  function persistPendingPicks(newPicks) {
    var existing = loadPendingPicks();
    var seenIds = {};
    existing.forEach(function(p){ seenIds[pickId(p)] = true; });
    newPicks.forEach(function(p) {
      if (!seenIds[pickId(p)]) existing.push(p);
    });
    // Cap at 200 entries and drop anything scheduled more than 7 days ago
    var weekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
    existing = existing.filter(function(p){ return !p._scheduledTs || p._scheduledTs > weekAgo; });
    if (existing.length > 200) existing = existing.slice(-200);
    savePendingPicks(existing);
  }

  // Runs on page load. Goes through persisted pending picks, checks if their
  // game is now final on ESPN, grades it, and saves the result. Prunes picks
  // that have been successfully graded or are too old.
  async function retrogradePendingPicks() {
    var pending = loadPendingPicks();
    if (pending.length === 0) return;

    // Only check picks whose game time has already passed
    var now = Date.now();
    var candidates = pending.filter(function(p) {
      return p._scheduledTs && p._scheduledTs < now;
    });
    if (candidates.length === 0) return;

    // Skip picks already graded (in pick history)
    var history = loadPickHistory();
    var graded = {};
    Object.keys(history).forEach(function(day) {
      Object.keys(history[day]).forEach(function(pid) { graded[pid] = true; });
    });
    candidates = candidates.filter(function(p){ return !graded[pickId(p)]; });
    if (candidates.length === 0) {
      // Clean up: drop anything already graded from pending
      savePendingPicks(pending.filter(function(p){ return !graded[pickId(p)]; }));
      return;
    }

    console.log('[retrograde] checking ' + candidates.length + ' pending picks for final scores...');

    // Group by league → one scoreboard fetch per league
    var leagues = Array.from(new Set(candidates.map(function(p) {
      return PICK_LEAGUE_MAP[(p.league || '').toUpperCase()];
    }))).filter(Boolean);

    var boards = await Promise.all(leagues.map(fetchScoreboardForPicks));
    var eventsByLeague = {};
    leagues.forEach(function(lg, i){ eventsByLeague[lg] = boards[i] || []; });

    var graded_count = 0;
    var stillPending = [];
    candidates.forEach(function(pick) {
      var lg = PICK_LEAGUE_MAP[(pick.league || '').toUpperCase()];
      if (!lg) { stillPending.push(pick); return; }
      var events = eventsByLeague[lg] || [];
      // Try to match by ESPN event ID first (most reliable), then by team names
      var event = null;
      if (pick._espnEventId) {
        event = events.find(function(e){ return String(e.id) === String(pick._espnEventId); });
      }
      if (!event) {
        event = matchPickToEvent(pick, events);
      }
      if (!event) { stillPending.push(pick); return; }
      var status = getPickStatus(event);
      if (status === 'final') {
        var result = getPickResult(pick, event);
        if (result) {
          savePickResult(pick, result);
          graded_count++;
        } else {
          stillPending.push(pick);
        }
      } else {
        stillPending.push(pick);
      }
    });

    // Reconstruct pending list: candidates we couldn't grade + anything whose
    // game is still in the future.
    var future = pending.filter(function(p){ return p._scheduledTs && p._scheduledTs >= now; });
    savePendingPicks(future.concat(stillPending));

    if (graded_count > 0) {
      console.log('[retrograde] graded ' + graded_count + ' picks from previous sessions');
      // Re-render strips if user is on the Value Picks tab, so the updated
      // record reflects immediately instead of waiting for next navigation.
      if (activeCat === 'analytics' && activeSub === 'picks') {
        renderPicksFeed();
      }
    }
  }

  // ─── Pick grading: match picks against live ESPN scoreboard, compute W/L ───
  // Keeps a running daily record in localStorage indexed by date + pick id.
  // player_prop and first_half picks can't be graded from scoreboard data — they
  // stay "pending" (no badge shown).

  // Maps the `league` field from picks to an ESPN_LEAGUES id. Keys are uppercased
  // before lookup. Accepts both common abbreviations (EPL, UCL) and full names.
  var PICK_LEAGUE_MAP = {
    NBA: 'nba', MLB: 'mlb', NHL: 'nhl', NFL: 'nfl',
    // Soccer — Europe + MLS
    EPL: 'epl', 'PREMIER LEAGUE': 'epl', 'ENGLISH PREMIER LEAGUE': 'epl',
    'LA LIGA': 'laliga', LALIGA: 'laliga',
    BUNDESLIGA: 'bundesliga',
    'SERIE A': 'seriea', SERIEA: 'seriea',
    'LIGUE 1': 'ligue1', LIGUE1: 'ligue1',
    UCL: 'ucl', 'CHAMPIONS LEAGUE': 'ucl', 'UEFA CHAMPIONS LEAGUE': 'ucl',
    MLS: 'mls', SOCCER: 'epl'  // generic "SOCCER" league defaults to EPL scoreboard
  };

  // Which broad sport category a league belongs to. Used to group picks into
  // sections. The order of keys here controls section render order.
  var SPORT_CATEGORIES = [
    { id: 'basketball', label: 'Basketball', leagues: ['NBA','OLYMPIC BASKETBALL','FIBA','OLYMPICS BASKETBALL'] },
    { id: 'football',   label: 'Football',   leagues: ['NFL'] },
    { id: 'baseball',   label: 'Baseball',   leagues: ['MLB'] },
    { id: 'hockey',     label: 'Hockey',     leagues: ['NHL'] },
    { id: 'soccer',     label: 'Soccer',     leagues: ['EPL','LA LIGA','LALIGA','BUNDESLIGA','SERIE A','SERIEA','LIGUE 1','LIGUE1','UCL','CHAMPIONS LEAGUE','UEFA CHAMPIONS LEAGUE','MLS','PREMIER LEAGUE','ENGLISH PREMIER LEAGUE','SOCCER','WORLD CUP','FIFA WORLD CUP','EUROS','EURO','COPA AMERICA'] },
  ];

  function sportCategoryForLeague(league) {
    var up = String(league||'').toUpperCase();
    for (var i = 0; i < SPORT_CATEGORIES.length; i++) {
      if (SPORT_CATEGORIES[i].leagues.indexOf(up) !== -1) return SPORT_CATEGORIES[i];
    }
    return { id: 'other', label: 'Other', leagues: [] };
  }
  var pickScoreboardCache = {};

  async function fetchScoreboardForPicks(leagueId) {
    var cached = pickScoreboardCache[leagueId];
    if (cached && Date.now() - cached.ts < 45 * 1000) return cached.events;
    var league = ESPN_LEAGUES.find(function(l){ return l.id === leagueId; });
    if (!league) return [];
    try {
      var res = await fetch(league.url, { signal: AbortSignal.timeout(6000) });
      if (!res.ok) return [];
      var data = await res.json();
      var events = data.events || [];
      pickScoreboardCache[leagueId] = { ts: Date.now(), events: events };
      return events;
    } catch (e) { return []; }
  }

  function normalizePickTeam(s) {
    return String(s||'').toLowerCase().replace(/[^a-z0-9]/g, '');
  }

  // Extract the team name from a pick like "Nuggets ML" / "Avalanche -1.5" / "Knicks +3.5 (1H)"
  function extractTeamFromPickText(pickText) {
    var t = String(pickText||'').trim();
    t = t.replace(/\s*\(1H\).*/i, '');
    t = t.replace(/\s+ML\b.*/i, '');
    t = t.replace(/\s+(?:Over|Under)\s+[\d.]+.*/i, '');
    t = t.replace(/\s*[+-]\d+(?:\.\d+)?.*/, '');
    return t.trim();
  }

  function extractSpreadLine(pickText) {
    var m = String(pickText||'').match(/([+-])(\d+(?:\.\d+)?)/);
    if (!m) return null;
    return (m[1] === '+' ? 1 : -1) * parseFloat(m[2]);
  }

  function extractTotal(pickText) {
    var m = String(pickText||'').match(/(Over|Under)\s+([\d.]+)/i);
    if (!m) return null;
    return { side: m[1].toLowerCase(), line: parseFloat(m[2]) };
  }

  function competitorMatchesPick(competitor, pickTeamName) {
    var team = (competitor && competitor.team) || {};
    var espnNames = [team.displayName, team.name, team.shortDisplayName, team.abbreviation, team.location]
      .filter(Boolean).map(normalizePickTeam);
    var pickNorm = normalizePickTeam(pickTeamName);
    if (!pickNorm) return false;
    return espnNames.some(function(n){
      return n && (n.indexOf(pickNorm) !== -1 || pickNorm.indexOf(n) !== -1);
    });
  }

  // A pick is eligible for live-matching only if its scheduled date is today.
  // "Tomorrow" picks should stay pending even if the same team is playing tonight.
  function isPickForToday(pick) {
    var when = String(pick.when || '').toLowerCase().trim();
    if (!when) return true;          // no when field — assume today
    if (/^tomorrow/.test(when)) return false;
    if (/^today/.test(when))    return true;
    return true;                     // unknown format — fall through
  }

  // Only match against ESPN events happening in the browser's current local day.
  function isEventToday(event) {
    if (!event || !event.date) return false;
    return new Date(event.date).toDateString() === new Date().toDateString();
  }

  function matchPickToEvent(pick, events) {
    if (!pick || !events || events.length === 0) return null;
    if (!isPickForToday(pick)) return null;           // tomorrow-picks stay pending
    var todayEvents = events.filter(isEventToday);    // ignore future/past events
    if (todayEvents.length === 0) return null;

    var matchup = String(pick.matchup||'');
    var mm = matchup.match(/^(.+?)\s+(?:@|vs\.?|at)\s+(.+?)$/i);
    var awayName = mm ? mm[1].trim() : '';
    var homeName = mm ? mm[2].trim() : '';
    var tbdRx = /\(opponent\s*tbd\)|\btbd\b/i;
    if (tbdRx.test(awayName)) awayName = '';
    if (tbdRx.test(homeName)) homeName = '';
    var pickTeam = extractTeamFromPickText(pick.pick);

    for (var i = 0; i < todayEvents.length; i++) {
      var ev = todayEvents[i];
      var comp = ev.competitions && ev.competitions[0];
      var competitors = (comp && comp.competitors) || [];
      if (competitors.length < 2) continue;
      var home = competitors.find(function(c){ return c.homeAway === 'home'; }) || competitors[0];
      var away = competitors.find(function(c){ return c.homeAway === 'away'; }) || competitors[1];

      if (awayName && homeName) {
        if (competitorMatchesPick(away, awayName) && competitorMatchesPick(home, homeName)) return ev;
        if (competitorMatchesPick(home, awayName) && competitorMatchesPick(away, homeName)) return ev;
      } else {
        var known = awayName || homeName || pickTeam;
        if (!known) continue;
        if (competitorMatchesPick(home, known) || competitorMatchesPick(away, known)) return ev;
      }
    }
    return null;
  }

  function getPickStatus(event) {
    var st = event && event.status && event.status.type;
    var name = st && st.name;
    var state = st && st.state;
    if (name === 'STATUS_IN_PROGRESS' || name === 'STATUS_HALFTIME' || name === 'STATUS_END_PERIOD' || state === 'in') return 'live';
    if (name === 'STATUS_FINAL' || name === 'STATUS_FULL_TIME' || state === 'post') return 'final';
    return 'scheduled';
  }

  function getPickResult(pick, event) {
    var type = (pick.type || '').toLowerCase();
    var comp = event.competitions && event.competitions[0];
    var competitors = (comp && comp.competitors) || [];
    if (competitors.length < 2) return null;
    var home = competitors.find(function(c){ return c.homeAway === 'home'; }) || competitors[0];
    var away = competitors.find(function(c){ return c.homeAway === 'away'; }) || competitors[1];
    var homeScore = parseInt(home.score) || 0;
    var awayScore = parseInt(away.score) || 0;
    var total = homeScore + awayScore;

    if (type === 'total') {
      var t = extractTotal(pick.pick);
      if (!t) return null;
      if (total > t.line) return t.side === 'over' ? 'win' : 'loss';
      if (total < t.line) return t.side === 'over' ? 'loss' : 'win';
      return 'push';
    }

    if (type === 'moneyline' || type === 'spread') {
      var pickTeam = extractTeamFromPickText(pick.pick);
      if (!pickTeam) return null;
      var isPickOnHome = competitorMatchesPick(home, pickTeam);
      var isPickOnAway = competitorMatchesPick(away, pickTeam);
      if (!isPickOnHome && !isPickOnAway) return null;
      var pickedScore = isPickOnHome ? homeScore : awayScore;
      var otherScore  = isPickOnHome ? awayScore : homeScore;
      var margin = pickedScore - otherScore;

      if (type === 'moneyline') {
        if (margin > 0) return 'win';
        if (margin < 0) return 'loss';
        // Moneyline with margin === 0 means the scores are tied AS REPORTED.
        // But MLB/NFL/NBA/NHL all play extra innings/overtime until a winner —
        // a regulation tie is never a final score in these leagues. So a 0
        // margin almost always means stale or partial data (0-0 pre-game, or
        // ESPN marked the event "final" before scores propagated). Don't grade
        // as push — return null so the grader retries on the next page load.
        // Soccer is the only major sport where moneyline pushes are real (draws),
        // and SportsBizNow! picks soccer as "Team -spread", not raw moneylines.
        console.warn('[grade] moneyline returned tied scores; treating as ungradable until data settles:', pick && pick.pick);
        return null;
      }
      // spread
      var line = extractSpreadLine(pick.pick);
      if (line === null) return null;
      var adj = margin + line;
      if (adj > 0) return 'win';
      if (adj < 0) return 'loss';
      return 'push';
    }

    return null; // player_prop, first_half — can't grade from scoreboard
  }

  // Stable identifier for a pick (survives pick-list refreshes)
  function pickId(p) {
    return String((p.matchup || '') + '|' + (p.pick || '')).replace(/\s+/g, '').toLowerCase();
  }

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' +
           String(d.getMonth()+1).padStart(2,'0') + '-' +
           String(d.getDate()).padStart(2,'0');
  }

  function loadPickHistory() {
    try { return JSON.parse(localStorage.getItem('sb_pick_history') || '{}'); }
    catch(e) { return {}; }
  }

  // ─── SERVER-SIDE PICK HISTORY ─────────────────────────────────────────────
  // Fetch the canonical W-L record from pick_history.json (written by the
  // workflow whenever a pick's game finishes). Merge into localStorage so
  // the rest of the UI — which reads localStorage — sees server-graded picks
  // even if the visitor wasn't on the site when the game ended.
  //
  // Conflict resolution: server result wins. Client localStorage might have
  // an older or manually-toggled entry; the workflow grader uses ESPN final
  // scores which are the ground truth.
  async function loadPickHistory_fromServer() {
    try {
      var res = await fetch('pick_history.json?t=' + Date.now());
      if (!res.ok) return;
      var data = await res.json();
      var serverPicks = Array.isArray(data.picks) ? data.picks : [];
      if (serverPicks.length === 0) return;
      var hist = loadPickHistory();
      var changed = false;
      var resultMap = { 'W': 'win', 'L': 'loss', 'P': 'push' };
      serverPicks.forEach(function(sp) {
        // Bucket the result under the date the game was graded (close enough
        // to the date the game finished for our display purposes).
        var day = String(sp.gradedAt || '').slice(0, 10); // 'YYYY-MM-DD'
        if (!day || day.length !== 10) return;
        if (!hist[day]) hist[day] = {};
        var fullResult = resultMap[sp.result];
        if (!fullResult) return;
        var entry = {
          result: fullResult,
          sport: sportCategoryForLeague(sp.league).id,
          matchup: sp.matchup,
          pick: sp.pick,
          confidence: String(sp.confidence||'medium').toLowerCase(),
          finalScore: sp.finalScore,
          savedAt: Date.parse(sp.gradedAt) || Date.now(),
          server: true     // mark as canonical so we don't overwrite with stale client data
        };
        // Server result always wins for entries marked server:true.
        var existing = hist[day][sp.id];
        if (!existing || !existing.server || existing.result !== fullResult) {
          hist[day][sp.id] = entry;
          changed = true;
        }
      });
      if (changed) {
        // Prune to last 60 days client-side (server keeps 500 entries).
        var keys = Object.keys(hist).sort();
        while (keys.length > 60) delete hist[keys.shift()];
        try { localStorage.setItem('sb_pick_history', JSON.stringify(hist)); } catch(e) {}
        // Re-render the W-L strips so the merged server record shows up
        // immediately. (Previously this called renderActiveSubTab(), which was
        // never defined anywhere — so the strips silently stayed on whatever
        // localStorage had at first paint, usually "No history yet".)
        rerenderRecordStrips();
        console.log('[history] merged ' + serverPicks.length + ' server-graded picks into local history');
      }
    } catch (e) {
      console.warn('[history] could not fetch pick_history.json:', e.message);
    }
  }

  // Alias so the call site reads naturally: loadPickHistory() is the existing
  // localStorage reader; loadPickHistory_fromServer is the new fetcher; this
  // is the entrypoint we wire into page load.
  function loadPickHistoryFromServer() { return loadPickHistory_fromServer(); }
  // Hoist under the name used by the init block below.
  var loadPickHistoryAlias = loadPickHistoryFromServer;
  window.loadPickHistory_fetchServer = loadPickHistoryFromServer;

  function savePickResult(pick, result) {
    if (result !== 'win' && result !== 'loss' && result !== 'push') return;
    var hist = loadPickHistory();
    var day = todayStr();
    if (!hist[day]) hist[day] = {};
    var sportId = sportCategoryForLeague(pick.league).id;
    hist[day][pickId(pick)] = {
      result: result,
      sport: sportId,
      matchup: pick.matchup,
      pick: pick.pick,
      confidence: String(pick.confidence||'medium').toLowerCase(),
      savedAt: Date.now()
    };
    // Prune to last 30 days
    var keys = Object.keys(hist).sort();
    while (keys.length > 30) delete hist[keys.shift()];
    try { localStorage.setItem('sb_pick_history', JSON.stringify(hist)); } catch(e) {}
  }

  // Record calculators. sportId of null means "all sports combined".
  // THE TRACKED RECORD COUNTS HIGH-CONFIDENCE PICKS ONLY. Medium/low picks
  // ship on the page but never touch these numbers — the published hit rate
  // is exclusively the verified high-confidence record.
  function _tallyFromEntries(entries, sportId) {
    var w = 0, l = 0, p = 0;
    Object.keys(entries).forEach(function(k){
      var e = entries[k];
      if ((e.confidence||'') !== 'high') return;
      if (sportId && e.sport !== sportId) return;
      if (e.result === 'win')  w++;
      else if (e.result === 'loss') l++;
      else if (e.result === 'push') p++;
    });
    return { wins: w, losses: l, pushes: p };
  }

  function getTodayRecord(sportId) {
    var hist = loadPickHistory();
    var day = hist[todayStr()] || {};
    return _tallyFromEntries(day, sportId || null);
  }

  function getAllTimeRecord(sportId) {
    var hist = loadPickHistory();
    var w = 0, l = 0, p = 0;
    Object.keys(hist).forEach(function(d){
      var t = _tallyFromEntries(hist[d], sportId || null);
      w += t.wins; l += t.losses; p += t.pushes;
    });
    return { wins: w, losses: l, pushes: p };
  }

  // Render a record strip at a specific element id. sportId of null = overall.
  // liveCount and pendingCount are from the enrichment pass for that slice.
  //
  // We cache the latest counts so the strips can be re-rendered later (e.g.
  // after the async pick_history.json merge lands) without losing the live and
  // pending counts that came from the enrichment pass.
  var lastStripCounts = { overallLive: 0, overallPending: 0, liveBySport: {}, pendingBySport: {} };

  function rerenderRecordStrips() {
    try {
      if (document.getElementById('picks-record-strip-overall')) {
        renderRecordStripInto('picks-record-strip-overall', null,
          lastStripCounts.overallLive, lastStripCounts.overallPending, true);
      }
      ['basketball','football','baseball','hockey','soccer'].forEach(function(sportId) {
        if (document.getElementById('picks-record-strip-' + sportId)) {
          renderRecordStripInto('picks-record-strip-' + sportId, sportId,
            lastStripCounts.liveBySport[sportId] || 0,
            lastStripCounts.pendingBySport[sportId] || 0, false);
        }
      });
    } catch(e) { /* strips not on screen — nothing to refresh */ }
  }

  function renderRecordStripInto(elementId, sportId, liveCount, pendingCount, isOverall) {
    var el = document.getElementById(elementId);
    if (!el) return;
    var all   = getAllTimeRecord(sportId || null);
    var titleMain = isOverall ? 'Overall' : (SPORT_CATEGORIES.find(function(s){return s.id===sportId;})?.label || 'Section');

    var allTotal = all.wins + all.losses; // pushes excluded from pct
    var winPct = allTotal > 0 ? Math.round((all.wins / allTotal) * 100) : 0;
    var pctClass = allTotal === 0 ? 'prs-pct-even' : (winPct >= 55 ? 'prs-pct-good' : winPct < 50 ? 'prs-pct-bad' : 'prs-pct-even');

    var allHas = all.wins || all.losses || all.pushes;
    var recordStr = allHas
      ? '<span class="prs-w">' + all.wins + '</span>–<span class="prs-l">' + all.losses + '</span>' + (all.pushes ? '–<span class="prs-p">' + all.pushes + '</span>' : '')
      : '—';
    var pctStr = (all.wins || all.losses) ? '<span class="' + pctClass + '">' + winPct + '%</span>' : '';

    // Short status line: live > pending > record summary > empty.
    var statusStr;
    if (liveCount > 0)        statusStr = '<span class="prs-live-pip">● ' + liveCount + ' live</span>';
    else if (pendingCount > 0) statusStr = pendingCount + ' pending';
    else if (!allHas)          statusStr = 'No record yet';
    else                       statusStr = allTotal + ' graded';

    var clickable = (all.wins + all.losses + all.pushes) > 0;

    el.className = 'picks-record-strip-simple' + (isOverall ? ' is-overall' : '');
    el.style.setProperty('--winpct', winPct + '%');
    if (!clickable) el.setAttribute('data-empty', '1'); else el.removeAttribute('data-empty');
    el.onclick = clickable ? function() { openPickHistory(sportId || '', !!isOverall); } : null;

    // ONE clean line: sport name · record · hit rate · status · (view)
    el.innerHTML =
      '<div class="prs2-name">' + esc(titleMain) + '</div>' +
      '<div class="prs2-record">' + recordStr + '</div>' +
      (pctStr ? '<div class="prs2-pct">' + pctStr + '</div>' : '<div class="prs2-pct"></div>') +
      '<div class="prs2-status">' + statusStr + '</div>' +
      (clickable ? '<div class="prs2-view">View ›</div>' : '<div class="prs2-view"></div>');
  }

  // Back-compat wrapper so other call sites don't break.
  function renderRecordStrip(liveCount, pendingCount) {
    renderRecordStripInto('picks-record-strip-overall', null, liveCount, pendingCount, true);
  }

  // ─── Pick history modal ────────────────────────────────────────────────────
  function openPickHistory(sportId, isOverall) {
    var content = document.getElementById('ph-content');
    var overlay = document.getElementById('ph-overlay');
    if (!content || !overlay) return;
    var titleMain = isOverall ? 'All Picks' : (SPORT_CATEGORIES.find(function(s){return s.id===sportId;})?.label || 'Picks');
    var hist = loadPickHistory();
    var today = getTodayRecord(isOverall ? null : sportId);
    var all   = getAllTimeRecord(isOverall ? null : sportId);
    var allTotal = all.wins + all.losses;
    var winPct = allTotal > 0 ? Math.round((all.wins / allTotal) * 100) : 0;
    var pctClass = allTotal === 0 ? 'ph-stat-value' : (winPct >= 55 ? 'ph-stat-value prs-pct-good' : winPct < 50 ? 'ph-stat-value prs-pct-bad' : 'ph-stat-value prs-pct-even');

    // Build history rows grouped by day (newest first)
    var days = Object.keys(hist).sort().reverse();
    var bodyHtml = '';
    var emittedEntries = 0;
    days.forEach(function(day) {
      var dayEntries = hist[day];
      var filtered = Object.keys(dayEntries)
        .map(function(k){ return Object.assign({ id: k }, dayEntries[k]); })
        .filter(function(e){ return (e.confidence||'') === 'high'; })
        .filter(function(e){ return isOverall || e.sport === sportId; })
        .sort(function(a,b){ return (b.savedAt||0) - (a.savedAt||0); });
      if (filtered.length === 0) return;

      var dayW = filtered.filter(function(e){return e.result==='win';}).length;
      var dayL = filtered.filter(function(e){return e.result==='loss';}).length;
      var dayP = filtered.filter(function(e){return e.result==='push';}).length;
      var dayStr = '<span class="prs-w">' + dayW + 'W</span>–<span class="prs-l">' + dayL + 'L</span>' + (dayP ? '–<span class="prs-p">' + dayP + 'P</span>' : '');

      // Format day label
      var d = new Date(day + 'T12:00:00');
      var now = new Date();
      var dayLabel;
      var diffDays = Math.round((now.setHours(12,0,0,0) - d.getTime()) / 86400000);
      if (diffDays === 0) dayLabel = 'Today';
      else if (diffDays === 1) dayLabel = 'Yesterday';
      else dayLabel = d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});

      bodyHtml += '<div class="ph-day-group">' +
        '<div class="ph-day-label">' + esc(dayLabel) + ' <span class="ph-day-summary">' + dayStr + '</span></div>' +
        filtered.map(function(e) {
          var badgeCls = e.result === 'win' ? 'won' : e.result === 'loss' ? 'lost' : 'push';
          var badgeTxt = e.result === 'win' ? 'Won' : e.result === 'loss' ? 'Lost' : 'Push';
          return '<div class="ph-entry">' +
            '<div class="ph-entry-badge ' + badgeCls + '">' + badgeTxt + '</div>' +
            '<div class="ph-entry-body">' +
              '<div class="ph-entry-pick">' + esc(e.pick || '—') + '</div>' +
              '<div class="ph-entry-matchup">' + esc(e.matchup || '') + '</div>' +
            '</div>' +
          '</div>';
        }).join('') +
      '</div>';
      emittedEntries += filtered.length;
    });
    if (emittedEntries === 0) bodyHtml = '<div class="ph-empty">No graded picks yet. Results will appear here after games finish.</div>';

    content.innerHTML =
      '<div class="ph-header">' +
        '<div>' +
          '<div class="ph-title-sport">' + (isOverall ? 'All Sports' : esc(titleMain)) + ' · High-Confidence Record</div>' +
          '<div class="ph-title">' + esc(titleMain) + '</div>' +
        '</div>' +
        '<div style="display:flex;gap:8px;align-items:center;">' +
          '<button class="ph-close" onclick="resetPickHistory()" style="background:transparent;border:1px solid var(--rule);color:var(--ink-2);">Reset stats</button>' +
          '<button class="ph-close" onclick="closePickHistory()">Close ✕</button>' +
        '</div>' +
      '</div>' +
      '<div class="ph-stats-bar">' +
        '<div class="ph-stat"><div class="ph-stat-value prs-w">' + all.wins + '</div><div class="ph-stat-label">Wins</div></div>' +
        '<div class="ph-stat"><div class="ph-stat-value prs-l">' + all.losses + '</div><div class="ph-stat-label">Losses</div></div>' +
        '<div class="ph-stat"><div class="ph-stat-value prs-p">' + all.pushes + '</div><div class="ph-stat-label">Pushes</div></div>' +
        '<div class="ph-stat"><div class="' + pctClass + '">' + (allTotal > 0 ? winPct + '%' : '—') + '</div><div class="ph-stat-label">Hit Rate</div></div>' +
      '</div>' +
      '<div class="ph-body">' + bodyHtml + '</div>';
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closePickHistory(ev) {
    // If called from the overlay click handler, only close if click was on the backdrop
    if (ev && ev.target && ev.target.id !== 'ph-overlay' && typeof ev.stopPropagation !== 'undefined') return;
    var overlay = document.getElementById('ph-overlay');
    if (overlay) overlay.classList.remove('open');
    document.body.style.overflow = '';
