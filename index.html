  // Wipe the stored W-L record. Used to clear out a bad early run so the record
  // strips start fresh once pick quality is dialed in. Only clears LOCAL data —
  // the next graded pick re-populates from there.
  window.resetPickHistory = function() {
    if (!confirm('Reset all win/loss history? This clears your local record and cannot be undone.')) return;
    try {
      localStorage.removeItem('sb_pick_history');
      localStorage.removeItem('sb_pending_picks');
    } catch(e) {}
    closePickHistory();
    // Re-render the page state so record strips refresh to 0-0.
    if (typeof window.location !== 'undefined') window.location.reload();
  };
  // ESC key closes modal
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closePickHistory();
  });

  // Build a compact score readout for a live or final game — "AWAY 2 — 3 HOME · 2nd 5:30"
  // For player_prop picks, append a note that per-player live stats aren't available.
  function getLiveReadout(pick, event) {
    var comp = event && event.competitions && event.competitions[0];
    var competitors = (comp && comp.competitors) || [];
    if (competitors.length < 2) return '';
    var home = competitors.find(function(c){ return c.homeAway === 'home'; }) || competitors[0];
    var away = competitors.find(function(c){ return c.homeAway === 'away'; }) || competitors[1];
    var homeScore = parseInt(home.score) || 0;
    var awayScore = parseInt(away.score) || 0;
    var homeAbbr = (home.team && (home.team.abbreviation || home.team.shortDisplayName)) || 'HOME';
    var awayAbbr = (away.team && (away.team.abbreviation || away.team.shortDisplayName)) || 'AWAY';

    var status = event.status;
    var clockStr = '';
    if (status && status.type) {
      // Prefer shortDetail (e.g. "Q3 2:45" or "Top 6th" or "Final"); fall back to period+clock
      clockStr = status.type.shortDetail || status.type.detail ||
                 (status.period && status.displayClock ? ('P' + status.period + ' ' + status.displayClock) : '');
    }

    var core = awayAbbr + ' ' + awayScore + ' — ' + homeScore + ' ' + homeAbbr +
               (clockStr ? '  ·  ' + clockStr : '');

    var type = (pick.type || '').toLowerCase();
    if (type === 'player_prop') {
      core += '  ·  <span style="color:var(--ink-3);">live player stats unavailable</span>';
    }
    return core;
  }

  function updatePickStatusBadge(idx, status, result, readout) {
    var row = document.querySelector('[data-pick-idx="' + idx + '"]');
    if (!row) return;
    var badge = row.querySelector('.pick-status');
    if (badge) {
      if (status === 'live') {
        badge.className = 'pick-status badge-live';
        badge.textContent = '● LIVE';
      } else if (status === 'final' && result) {
        var cls = result === 'win' ? 'badge-won' : result === 'loss' ? 'badge-lost' : 'badge-push';
        badge.className = 'pick-status ' + cls;
        badge.textContent = result === 'push' ? 'PUSH' : result === 'win' ? 'WON' : 'LOST';
      } else {
        badge.className = 'pick-status';
        badge.textContent = '';
      }
    }
    var readoutEl = row.querySelector('.pick-live-readout');
    if (readoutEl) {
      if (readout && (status === 'live' || status === 'final')) {
        readoutEl.innerHTML = readout;
        readoutEl.style.display = 'block';
      } else {
        readoutEl.innerHTML = '';
        readoutEl.style.display = 'none';
      }
    }
  }

  // After rendering picks, asynchronously fetch scoreboards for each pick's league,
  // match picks to events, and update badges + record strip in place.
  async function enrichPicksWithStatus(picks) {
    var leagues = Array.from(new Set(picks.map(function(p){
      return PICK_LEAGUE_MAP[(p.league || '').toUpperCase()];
    }))).filter(Boolean);
    var highOnly = picks.filter(function(p){ return String(p.confidence||'').toLowerCase() === 'high'; });
    if (leagues.length === 0) {
      lastStripCounts = { overallLive: 0, overallPending: highOnly.length, liveBySport: {}, pendingBySport: {} };
      renderRecordStripInto('picks-record-strip-overall', null, 0, highOnly.length, true);
      return;
    }

    var boards = await Promise.all(leagues.map(fetchScoreboardForPicks));
    var eventsByLeague = {};
    leagues.forEach(function(lg, i){ eventsByLeague[lg] = boards[i]; });

    // Tally live/pending by sport id + overall
    var liveBySport = {}, pendingBySport = {};
    var overallLive = 0, overallPending = 0;

    picks.forEach(function(pick, idx) {
      var sportId = sportCategoryForLeague(pick.league).id;
      // The strips are the tracked record, and the record is high-conf only —
      // so live/pending counts ignore medium/low picks. Status badges on the
      // pick cards themselves still update for every pick below.
      var isHigh = String(pick.confidence||'').toLowerCase() === 'high';
      var lg = PICK_LEAGUE_MAP[(pick.league || '').toUpperCase()];
      if (!lg) {
        if (isHigh) {
          pendingBySport[sportId] = (pendingBySport[sportId]||0) + 1;
          overallPending++;
        }
        return;
      }
      var events = eventsByLeague[lg] || [];
      var event = matchPickToEvent(pick, events);
      if (!event) {
        if (isHigh) {
          pendingBySport[sportId] = (pendingBySport[sportId]||0) + 1;
          overallPending++;
        }
        return;
      }
      var status = getPickStatus(event);
      var result = null;
      var readout = null;
      if (status === 'final') {
        result = getPickResult(pick, event);
        if (result) savePickResult(pick, result);
        readout = getLiveReadout(pick, event);
      } else if (status === 'live') {
        readout = getLiveReadout(pick, event);
      }
      if (status === 'live' && isHigh) {
        liveBySport[sportId] = (liveBySport[sportId]||0) + 1;
        overallLive++;
      }
      if ((status === 'scheduled' || (status === 'final' && !result)) && isHigh) {
        pendingBySport[sportId] = (pendingBySport[sportId]||0) + 1;
        overallPending++;
      }
      updatePickStatusBadge(idx, status, result, readout);
    });

    // Cache counts for later re-renders (server history merge, etc.)
    lastStripCounts = {
      overallLive: overallLive, overallPending: overallPending,
      liveBySport: liveBySport, pendingBySport: pendingBySport
    };

    // Overall strip
    renderRecordStripInto('picks-record-strip-overall', null, overallLive, overallPending, true);
    // Per-sport strips — render for every strip element present in the DOM
    ['basketball','football','baseball','hockey','soccer'].forEach(function(sportId) {
      if (document.getElementById('picks-record-strip-' + sportId)) {
        renderRecordStripInto('picks-record-strip-' + sportId, sportId,
          liveBySport[sportId]||0, pendingBySport[sportId]||0, false);
      }
    });
  }

  // Strip picks whose scheduled game has already started more than 4 hours ago.
  // Prevents stale hardcoded / cached picks from showing as "Tomorrow" after the
  // day rolls over. Picks without a parseable "when" field pass through untouched.
  function filterFreshPicks(picks) {
    var now = new Date();
    var staleThreshold = now.getTime() - 4 * 60 * 60 * 1000;       // 4h grace
    var futureThreshold = now.getTime() + 36 * 60 * 60 * 1000;     // tonight + tomorrow
    return picks.filter(function(p) {
      // Never render picks the server is only carrying forward to grade.
      if (p._pendingGrade) return false;

      // CREDIBILITY GATE (client-side last line of defense):
      // A pick only renders if we can prove it's a real, current, bookable game.
      // A pick needs EITHER a real bookmaker line snapshot OR be a player prop;
      // anything else with no line is untrustworthy and is hidden.
      var hasLine = !!(p.marketSnapshot && p.marketSnapshot.markets);
      var isProp  = String(p.type||'').toLowerCase() === 'player_prop';
      if (!hasLine && !isProp) return false;

      // It must have a resolvable game time inside the valid window. We prefer
      // the absolute timestamp; only fall back to parsing the "when" string.
      var ts = null;
      if (typeof p._scheduledTs === 'number') {
        ts = p._scheduledTs;
      } else {
        var when = String(p.when||'').trim();
        var m = when.match(/^(Today|Tonight|Tomorrow)\s+(\d{1,2}):(\d{2})\s*(AM|PM)\s*ET$/i);
        if (m) {
          var dayOffset = /tomorrow/i.test(m[1]) ? 1 : 0;
          var hour = parseInt(m[2], 10);
          var min = parseInt(m[3], 10);
          if (/PM/i.test(m[4]) && hour < 12) hour += 12;
          if (/AM/i.test(m[4]) && hour === 12) hour = 0;
          var scheduled = new Date();
          scheduled.setDate(scheduled.getDate() + dayOffset);
          scheduled.setHours(hour, min, 0, 0);
          ts = scheduled.getTime();
        }
      }
      // No resolvable time (e.g. a phantom "Sunday 1:00 PM ET" offseason pick)
      // = cannot prove it's a real current game = do not render.
      if (ts === null) return false;
      // Must be in the near-future window: not already done, not weeks away.
      return ts > staleThreshold && ts < futureThreshold;
    });
  }

  async function renderPicksFeed() {
    var feed = document.getElementById('main-feed');
    // STRICT: only research-backed picks from the cron pipeline. No browser-side
    // template generation. No invented odds. If stories.json has no picks, the
    // user sees an honest empty state, not fake numbers.
    var rawPicks = (PICKS && PICKS.length > 0) ? PICKS : [];
    // Drop any pick that arrived without a real bookmaker snapshot. The
    // server-side pipeline stamps marketSnapshot when the Odds API responded,
    // so if it's missing, the line numbers in the pick aren't trustworthy.
    // Sort picks with real bookmaker snapshots first, then by confidence.
    // The Odds API isn't always available for every game; picks without a
    // snapshot still display, just without the inline "@ DraftKings" tag.
    rawPicks = rawPicks.slice().sort(function(a, b) {
      var rank = { high: 3, medium: 2, low: 1 };
      var d = (rank[(b.confidence||'medium').toLowerCase()]||0) - (rank[(a.confidence||'medium').toLowerCase()]||0);
      if (d !== 0) return d;
      var aSnap = !!(a.marketSnapshot && a.marketSnapshot.markets);
      var bSnap = !!(b.marketSnapshot && b.marketSnapshot.markets);
      return bSnap - aSnap;
    });
    var picks = filterFreshPicks(rawPicks);
    var hasAnyPicks = picks && picks.length > 0;

    var confColor = { high: 'var(--green)', medium: 'var(--amber)', low: 'var(--ink-3)' };
    var confBg    = { high: 'var(--green-light)', medium: 'var(--amber-light)', low: 'var(--surface-2)' };
    var neutralType = { fg: 'var(--ink-2)', bg: 'var(--surface-2)' };
    var typeInfo = {
      spread:      Object.assign({ label: 'Spread'      }, neutralType),
      moneyline:   Object.assign({ label: 'Moneyline'   }, neutralType),
      total:       Object.assign({ label: 'Total'       }, neutralType),
      player_prop: Object.assign({ label: 'Player Prop' }, neutralType),
      first_half:  Object.assign({ label: '1st Half'    }, neutralType)
    };

    // Group picks by sport category, preserving original indices (used by the
    // enrichment pass to update badges via data-pick-idx).
    var bySport = {};
    picks.forEach(function(p, idx) {
      var sport = sportCategoryForLeague(p.league).id;
      if (!bySport[sport]) bySport[sport] = [];
      bySport[sport].push({ pick: p, idx: idx });
    });
    // Order: Basketball, Football, Baseball, Hockey, Soccer, then Other
    var orderedSportIds = SPORT_CATEGORIES.map(function(s){ return s.id; }).concat(['other']);

    function renderPickRow(p, idx) {
      var conf  = (p.confidence || 'medium').toLowerCase();
      var t     = typeInfo[(p.type || '').toLowerCase()] || { label: 'Pick', fg: 'var(--ink-2)', bg: 'var(--surface-2)' };
      var typeTag = '<span style="display:inline-block;font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:3px;background:' + t.bg + ';color:' + t.fg + ';">' + esc(t.label) + '</span>';
      // Confidence badge: ONLY high-confidence picks get one — a green box.
      // Medium/low picks render clean with no confidence chip; the writeup
      // speaks for itself. High picks are the only ones the record tracks.
      var confTag = (conf === 'high')
        ? '<span style="display:inline-block;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:3px;background:var(--green);color:#0a0a0a;border:1px solid var(--green);">High Confidence</span>'
        : '';
      var leaguePrefix = p.league ? '<span style="font-family:JetBrains Mono,monospace;font-size:9px;color:var(--ink-3);letter-spacing:.08em;margin-right:6px;">' + esc(p.league) + '</span>' : '';

      // Pull the ACTUAL bookmaker line from marketSnapshot. This is the line
      // that was live at pick time, sourced from real US books via The Odds API.
      // We show this rather than trusting whatever Claude wrote in the odds field.
      var realLineHtml = '';
      var snap = p.marketSnapshot && p.marketSnapshot.markets;
      if (snap) {
        var pickType = (p.type||'').toLowerCase();
        var pickText = String(p.pick||'');
        var line = null, price = null, book = null;
        if (pickType === 'moneyline') {
          // Pick text like "Thunder ML" — figure out which side from text vs matchup
          var matchupParts = String(p.matchup||'').split(/\s+@\s+/);
          var awayName = (matchupParts[0]||'').trim();
          var homeName = (matchupParts[1]||'').trim();
          var pickTeam = pickText.replace(/\s*ML\s*$/i,'').trim();
          var slot = null;
          if (awayName && pickTeam && (awayName.indexOf(pickTeam) !== -1 || pickTeam.indexOf(awayName.split(' ').pop()) !== -1)) slot = 'away';
          else if (homeName && pickTeam && (homeName.indexOf(pickTeam) !== -1 || pickTeam.indexOf(homeName.split(' ').pop()) !== -1)) slot = 'home';
          if (slot && snap.h2h && snap.h2h[slot]) {
            price = snap.h2h[slot].price;
            book = snap.h2h[slot].book;
          }
        } else if (pickType === 'spread') {
          var sm = snap.spreads || {};
          // Match by sign of the number in pick text
          var lineMatch = pickText.match(/([+-]?\d+(?:\.\d+)?)/);
          var pickedNum = lineMatch ? parseFloat(lineMatch[1]) : null;
          // Try to identify side by team name like the moneyline branch
          var matchupParts2 = String(p.matchup||'').split(/\s+@\s+/);
          var awayName2 = (matchupParts2[0]||'').trim();
          var homeName2 = (matchupParts2[1]||'').trim();
          var teamGuess = pickText.replace(/[+-]?\d+(?:\.\d+)?.*/,'').trim();
          var slot2 = null;
          if (awayName2 && teamGuess && (awayName2.indexOf(teamGuess) !== -1 || teamGuess.indexOf(awayName2.split(' ').pop()) !== -1)) slot2 = 'away';
          else if (homeName2 && teamGuess && (homeName2.indexOf(teamGuess) !== -1 || teamGuess.indexOf(homeName2.split(' ').pop()) !== -1)) slot2 = 'home';
          if (slot2 && sm[slot2]) {
            line = sm[slot2].point;
            price = sm[slot2].price;
            book = sm[slot2].book;
          }
        } else if (pickType === 'total') {
          var side = /^over/i.test(pickText) ? 'over' : /^under/i.test(pickText) ? 'under' : null;
          if (side && snap.totals && snap.totals[side]) {
            line = snap.totals[side].point;
            price = snap.totals[side].price;
            book = snap.totals[side].book;
          }
        }
        if (price != null) {
          var priceStr = (price > 0 ? '+' : '') + price;
          var lineLabel = '';
          if (line != null) {
            lineLabel = (line > 0 ? '+' : '') + line + ' ';
          }
          realLineHtml = '<span style="font-family:JetBrains Mono,monospace;font-size:12px;color:var(--ink);background:var(--surface-2);padding:3px 8px;border-radius:3px;">' +
            lineLabel + priceStr +
            (book ? '<span style="color:var(--ink-3);margin-left:5px;">@ ' + esc(book) + '</span>' : '') +
            '</span>';
        }
      }

      return '<div data-pick-idx="' + idx + '" style="padding:16px 0;border-bottom:1px solid var(--rule);">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;gap:12px;flex-wrap:wrap;">' +
          '<div style="font-family:JetBrains Mono,monospace;font-size:10px;color:var(--ink-3);">' + leaguePrefix + esc(p.matchup||'') + '</div>' +
          (p.when ? '<div style="font-family:JetBrains Mono,monospace;font-size:10px;color:var(--green);">' + esc(p.when) + '</div>' : '') +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;">' +
          '<span style="font-family:Archivo,sans-serif;font-size:20px;font-weight:700;color:var(--ink);">' + esc(p.pick||'') + '</span>' +
          (realLineHtml || '<span style="font-family:JetBrains Mono,monospace;font-size:11px;color:var(--ink-3);font-style:italic;">no line snapshot</span>') +
          typeTag +
          '<span class="pick-status"></span>' +
          confTag +
        '</div>' +
        '<div class="pick-live-readout" style="display:none;"></div>' +
        '<div style="font-size:13px;color:var(--ink-2);line-height:1.6;max-width:95%;">' + esc(p.edge||'') + '</div>' +
      '</div>';
    }

    // Overall strip at the very top
    var html = '<div class="cluster" style="padding-top:4px;">' +
      '<div id="picks-record-strip-overall" class="picks-record-strip picks-record-strip-overall"><span class="picks-record-label">Overall</span></div>';

    orderedSportIds.forEach(function(sportId) {
      var group = bySport[sportId];
      var sportDef = SPORT_CATEGORIES.find(function(s){ return s.id === sportId; }) || { id: sportId, label: 'Other' };
      // Always render a section for core sports (basketball/football/baseball/hockey/soccer);
      // show empty state when nothing available today. Skip 'other' when empty.
      var isCore = sportDef && ['basketball','football','baseball','hockey','soccer'].indexOf(sportId) !== -1;
      var hasPicks = group && group.length > 0;
      if (!hasPicks && !isCore) return;

      var countLabel = hasPicks
        ? group.length + ' pick' + (group.length===1?'':'s')
        : 'No picks today';

      html += '<section class="picks-sport-section">' +
        '<div class="picks-sport-header">' +
          '<span class="picks-sport-label">' + esc(sportDef.label) + '</span>' +
          '<span class="picks-sport-count">' + countLabel + '</span>' +
        '</div>' +
        '<div id="picks-record-strip-' + sportId + '" class="picks-record-strip"></div>' +
        (hasPicks
          ? group.map(function(g){ return renderPickRow(g.pick, g.idx); }).join('')
          : '<div style="padding:14px 4px 18px;color:var(--ink-3);font-size:13px;line-height:1.5;">No ' + esc(sportDef.label.toLowerCase()) + ' picks today. The research pipeline did not find a quantified edge against the real market lines. The next 2-hour refresh will re-evaluate.</div>'
        ) +
      '</section>';
    });

    html += '<div style="font-size:10px;color:var(--ink-3);margin-top:20px;font-family:JetBrains Mono,monospace;">' +
      'Lines from The Odds API where available, otherwise from research. For entertainment only. Please bet responsibly.' +
    '</div></div>';
    feed.innerHTML = html;

    // Paint all record strips once with persisted data, so they're populated
    // even before the live enrichment completes.
    renderRecordStripInto('picks-record-strip-overall', null, 0, 0, true);
    // Core sports always have strips rendered in the DOM
    ['basketball','football','baseball','hockey','soccer'].forEach(function(sportId) {
      if (document.getElementById('picks-record-strip-' + sportId)) {
        renderRecordStripInto('picks-record-strip-' + sportId, sportId, 0, 0, false);
      }
    });

    enrichPicksWithStatus(hasAnyPicks ? picks : []);
  }

  function renderHighlightsFeed() {
    var feed = document.getElementById('main-feed');

    // Merge real videos from stories.json with defaults
    var realByLeague = {};
    (HIGHLIGHTS || []).forEach(function(v) { realByLeague[v.league] = v; });
    var vids = DEFAULT_HIGHLIGHTS.map(function(def) {
      return realByLeague[def.league] || def;
    });
    var leagueColors = { NFL:'#d4200c', NBA:'#1d428a', MLB:'#002d72', NHL:'#003f7f', WNBA:'#ff6900', SOCCER:'#00843d', ESPN:'#cc0000' };

    function buildSrc(v) {
      var base = 'https://www.youtube-nocookie.com/embed';
      if (v.videoId) {
        return base + '/' + v.videoId + '?autoplay=1&mute=1&controls=1&rel=0&modestbranding=1';
      }
      var pid = v.playlistId || 'UUWJ2lWNubArHWmf3FIHbfcQ';
      var idx = v.startIndex || 0;
      return base + '?listType=playlist&list=' + pid + '&autoplay=1&mute=1&controls=1&rel=0&modestbranding=1&index=' + idx;
    }

    function buildDots() {
      return vids.map(function(v, i) {
        var color = leagueColors[v.league] || '#333';
        return '<button onclick="switchVid(' + i + ')" id="dot' + i + '" style="' +
          'border:none;cursor:pointer;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.06em;' +
          'background:' + (i === 0 ? color : 'var(--rule)') + ';' +
          'color:' + (i === 0 ? '#fff' : 'var(--ink-3)') + ';' +
          'transition:all .2s;">' + v.league + '</button>';
      }).join('');
    }

    feed.innerHTML =
      '<div style="max-width:860px;">' +
        '<div style="border-radius:10px;overflow:hidden;background:#000;margin-bottom:12px;">' +
          '<iframe id="hl-frame" src="' + buildSrc(vids[0]) + '" ' +
            'style="width:100%;aspect-ratio:16/9;border:none;display:block;" ' +
            'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" ' +
            'allowfullscreen></iframe>' +
        '</div>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;">' + buildDots() + '</div>' +
        '<div id="hl-title" style="font-size:13px;font-weight:600;color:var(--ink-2);">' + esc(vids[0].title) + '</div>' +
        '<div style="font-size:10px;color:var(--ink-3);margin-top:6px;font-family:JetBrains Mono,monospace;">Videos play muted — click speaker icon to unmute</div>' +
      '</div>';

    window.__hlVids = vids;
    window.__hlColors = leagueColors;
    window.__buildHlSrc = buildSrc;
  }

  function switchVid(idx) {
    var vids = window.__hlVids;
    var colors = window.__hlColors;
    var buildSrc = window.__buildHlSrc;
    if (!vids || !buildSrc) return;
    var v = vids[idx];
    var frame = document.getElementById('hl-frame');
    if (frame) frame.src = buildSrc(v);
    var title = document.getElementById('hl-title');
    if (title) title.textContent = v.title;
    // Update dot styles
    vids.forEach(function(vid, i) {
      var dot = document.getElementById('dot' + i);
      if (!dot) return;
      var col = colors[vid.league] || '#333';
      dot.style.background = i === idx ? col : 'var(--rule)';
      dot.style.color = i === idx ? '#fff' : 'var(--ink-3)';
    });
  }

  // INJURY DESK — surfaces today's confirmed injuries with team-impact context.
  //
  // Data source: INJURIES array, extracted by the cluster Claude call from the
  // day's RSS feeds (see TASK 7 in generate.js). Empty array on quiet days; the
  // renderer shows an honest empty state, not invented data.
  //
  // Layout: status-grouped cards (OUT, QUESTIONABLE, DOUBTFUL, DAY-TO-DAY, IR,
  // RETURNING). Each card surfaces the impact line and source so a reader can
  // size the news without leaving the page.
  // ═════════════════════════════════════════════════════════════════════════
  function renderInjuryDesk() {
    var feed = document.getElementById('main-feed');
    var rows = INJURIES || [];

    if (!rows.length) {
      feed.innerHTML =
        '<div style="max-width:860px;">' +
          '<div style="margin-bottom:16px;">' +
            '<div style="font-size:11px;color:var(--ink-3);letter-spacing:.10em;font-family:JetBrains Mono,monospace;margin-bottom:4px;">SPORTSBIZNOW! INTELLIGENCE</div>' +
            '<h2 style="margin:0;font-size:22px;font-weight:800;">Injury Desk</h2>' +
            '<div style="font-size:13px;color:var(--ink-3);margin-top:6px;">Today\'s tracked player injuries across the major leagues, ranked by status severity.</div>' +
          '</div>' +
          '<div style="border:1px solid var(--rule);border-radius:8px;padding:24px;background:var(--surface);text-align:left;">' +
            '<div style="font-size:14px;font-weight:700;color:var(--ink-1);margin-bottom:6px;">No injuries on the wire right now</div>' +
            '<div style="font-size:13px;color:var(--ink-3);line-height:1.5;">' +
              'No injury reports were surfaced in the current news cycle. The desk auto-refreshes when new injury news breaks. Check back after the next refresh, or click Refresh above to force a check.' +
            '</div>' +
          '</div>' +
        '</div>';
      return;
    }

    // Status -> color/label/order. OUT-tier injuries lead because they have the
    // biggest line-moving impact; soft statuses follow.
    var STATUS_META = {
      OUT:           { label: 'Out',           color: '#d4200c', bg: 'rgba(212,32,12,.10)',  ord: 1 },
      IR:            { label: 'IR',            color: '#d4200c', bg: 'rgba(212,32,12,.10)',  ord: 2 },
      DOUBTFUL:      { label: 'Doubtful',      color: '#e8851b', bg: 'rgba(232,133,27,.10)', ord: 3 },
      QUESTIONABLE:  { label: 'Questionable',  color: '#e8b41b', bg: 'rgba(232,180,27,.10)', ord: 4 },
      DAY_TO_DAY:    { label: 'Day-to-Day',    color: '#e8b41b', bg: 'rgba(232,180,27,.10)', ord: 5 },
      RETURNING:     { label: 'Returning',     color: '#23a36a', bg: 'rgba(35,163,106,.10)', ord: 6 }
    };

    var sorted = rows.slice().sort(function(a, b) {
      var aMeta = STATUS_META[a.status] || { ord: 99 };
      var bMeta = STATUS_META[b.status] || { ord: 99 };
      return aMeta.ord - bMeta.ord;
    });

    function escSafe(s) { return esc(s || ''); }

    var cards = sorted.map(function(inj) {
      var meta = STATUS_META[inj.status] || { label: inj.status || 'Unknown', color: 'var(--ink-3)', bg: 'var(--surface-2)' };
      return '' +
        '<div style="border:1px solid var(--rule);border-radius:8px;padding:16px;background:var(--surface);">' +
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px;">' +
            '<div>' +
              '<div style="font-size:11px;color:var(--ink-3);letter-spacing:.08em;font-family:JetBrains Mono,monospace;margin-bottom:4px;">' +
                escSafe(inj.league) + ' · ' + escSafe(inj.team) +
              '</div>' +
              '<div style="font-size:18px;font-weight:700;color:var(--ink-1);line-height:1.2;">' + escSafe(inj.player) + '</div>' +
            '</div>' +
            '<div style="background:' + meta.bg + ';color:' + meta.color + ';padding:4px 10px;border-radius:4px;' +
                  'font-size:10px;font-weight:700;letter-spacing:.08em;white-space:nowrap;font-family:JetBrains Mono,monospace;">' +
              escSafe(meta.label).toUpperCase() +
            '</div>' +
          '</div>' +
          '<div style="display:flex;gap:24px;font-size:13px;color:var(--ink-2);margin-bottom:10px;flex-wrap:wrap;">' +
            '<div><span style="color:var(--ink-3);font-size:11px;">INJURY</span><br>' + escSafe(inj.injury) + '</div>' +
            (inj.timeline ? '<div><span style="color:var(--ink-3);font-size:11px;">TIMELINE</span><br>' + escSafe(inj.timeline) + '</div>' : '') +
          '</div>' +
          (inj.impact ? '<div style="font-size:13px;color:var(--ink-1);line-height:1.5;padding:10px 12px;background:var(--surface-2);border-left:2px solid ' + meta.color + ';margin-bottom:10px;">' +
            escSafe(inj.impact) +
          '</div>' : '') +
          (inj.source ? '<div style="font-size:11px;color:var(--ink-3);font-family:JetBrains Mono,monospace;">via ' + escSafe(inj.source) + '</div>' : '') +
        '</div>';
    }).join('');

    feed.innerHTML =
      '<div style="max-width:860px;">' +
        '<div style="margin-bottom:16px;">' +
          '<div style="font-size:11px;color:var(--ink-3);letter-spacing:.10em;font-family:JetBrains Mono,monospace;margin-bottom:4px;">SPORTSBIZNOW! INTELLIGENCE</div>' +
          '<h2 style="margin:0;font-size:22px;font-weight:800;">Injury Desk</h2>' +
          '<div style="font-size:13px;color:var(--ink-3);margin-top:6px;">Confirmed injuries from today\'s wire, ranked by status severity. ' +
            sorted.length + ' player' + (sorted.length === 1 ? '' : 's') + ' tracked.' +
          '</div>' +
        '</div>' +
        '<div style="display:grid;gap:12px;">' + cards + '</div>' +
      '</div>';
  }

  // ═════════════════════════════════════════════════════════════════════════
  // PROSPECT LAB — Full interactive lab with side-by-side comparison.

  // Players are unified into one pool (PLAYER_POOL). Each entry has a `type`
  // field that's either 'prospect' or 'pro' so the UI can filter/label.

  //   - Search box filters dropdowns and card list together
  // ═════════════════════════════════════════════════════════════════════════

  // Stitch prospects + pros into one pool the UI iterates over. We add a
  // `type` discriminator + a `searchKey` for fast filtering.
  function getPlayerPool() {
    var prospects = PROSPECTS.map(function(p) { return Object.assign({}, p, { type: 'prospect' }); });
    var pros = PRO_PLAYERS.map(function(p) { return Object.assign({}, p, { type: 'pro' }); });
    return prospects.concat(pros).map(function(p, i) {
      p._idx = i; // stable index for selection
      p._searchKey = (p.name + ' ' + (p.school || '') + ' ' + (p.sport || '') + ' ' + (p.pos || '')).toLowerCase();
      return p;
    });
  }

  // Lab state lives on window so dropdown handlers can read/write it.
  window._labState = window._labState || {
    sportFilter: 'ALL',      // 'ALL' | 'NFL' | 'NBA' | 'MLB'
    typeFilter: 'ALL',       // 'ALL' | 'prospect' | 'pro'
    search: '',
    selectedA: null,         // _idx of player A
    selectedB: null,         // _idx of player B
    mode: 'browse'           // 'browse' | 'compare'
  };

  function renderProspectLab() {
    var feed = document.getElementById('main-feed');
    var pool = getPlayerPool();
    var state = window._labState;

    // Apply filters to derive the visible roster.
    function applyFilters(roster) {
      return roster.filter(function(p) {
        if (state.sportFilter !== 'ALL' && p.sport !== state.sportFilter) return false;
        if (state.typeFilter !== 'ALL' && p.type !== state.typeFilter) return false;
        if (state.search && p._searchKey.indexOf(state.search.toLowerCase()) === -1) return false;
        return true;
      });
    }

    var filtered = applyFilters(pool);

    // ─── Filter pill bar ─────────────────────────────────────────────────────
    function pill(label, key, current) {
      var active = (current === label.toUpperCase()) || (current === label.toLowerCase()) || (current === label);
      return '<button onclick="setLabFilter(\'' + key + '\',\'' + label + '\')" style="' +
        'padding:5px 12px;border-radius:14px;font-size:11px;font-weight:600;cursor:pointer;letter-spacing:.04em;' +
        'border:1px solid ' + (active ? 'var(--accent)' : 'var(--rule)') + ';' +
        'background:' + (active ? 'var(--accent)' : 'transparent') + ';' +
        'color:' + (active ? 'var(--accent-ink)' : 'var(--ink-2)') + ';' +
        'font-family:JetBrains Mono,monospace;">' + esc(label) + '</button>';
    }

    var filterBar =
      '<div style="display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:14px;">' +
        '<div style="display:flex;gap:5px;flex-wrap:wrap;">' +
          '<span style="font-size:10px;color:var(--ink-3);align-self:center;margin-right:4px;font-family:JetBrains Mono,monospace;">SPORT</span>' +
          pill('ALL', 'sport', state.sportFilter) +
          pill('NFL', 'sport', state.sportFilter) +
          pill('NBA', 'sport', state.sportFilter) +
          pill('MLB', 'sport', state.sportFilter) +
        '</div>' +
        '<div style="display:flex;gap:5px;flex-wrap:wrap;">' +
          '<span style="font-size:10px;color:var(--ink-3);align-self:center;margin-right:4px;font-family:JetBrains Mono,monospace;">TYPE</span>' +
          pill('ALL', 'type', state.typeFilter) +
          pill('prospect', 'type', state.typeFilter) +
          (PRO_PLAYERS.length > 0 ? pill('pro', 'type', state.typeFilter) : '') +
        '</div>' +
        '<input type="text" id="lab-search" placeholder="Search name, school..." ' +
          'value="' + esc(state.search) + '" oninput="setLabSearch(this.value)" ' +
          'style="flex:1;min-width:180px;padding:6px 10px;border:1px solid var(--rule);background:var(--surface);' +
          'color:var(--ink-1);border-radius:6px;font-size:13px;font-family:inherit;" />' +
      '</div>';

    // ─── Mode toggle: browse vs compare ──────────────────────────────────────
    function modePill(label, val) {
      var active = state.mode === val;
      return '<button onclick="setLabMode(\'' + val + '\')" style="' +
        'padding:6px 14px;cursor:pointer;font-size:12px;font-weight:600;' +
        'border:1px solid ' + (active ? 'var(--accent)' : 'var(--rule)') + ';' +
        'background:' + (active ? 'var(--accent)' : 'transparent') + ';' +
        'color:' + (active ? 'var(--accent-ink)' : 'var(--ink-2)') + ';' +
        'border-radius:6px;letter-spacing:.04em;">' + esc(label) + '</button>';
    }
    var modeBar =
      '<div style="display:flex;gap:6px;margin-bottom:14px;">' +
        modePill('Browse', 'browse') +
        modePill('Compare', 'compare') +
      '</div>';

    // ─── Body: browse mode (cards) or compare mode (side-by-side) ────────────
    var body = '';
    if (state.mode === 'compare') {
      body = renderCompareMode(filtered);
    } else {
      body = renderBrowseCards(filtered);
    }

    feed.innerHTML =
      '<div style="max-width:1100px;">' +
        '<div style="margin-bottom:16px;">' +
          '<div style="font-size:11px;color:var(--ink-3);letter-spacing:.10em;font-family:JetBrains Mono,monospace;margin-bottom:4px;">SPORTSBIZNOW! INTELLIGENCE</div>' +
          '<h2 style="margin:0;font-size:22px;font-weight:800;">Prospect Lab</h2>' +
          '<div style="font-size:13px;color:var(--ink-3);margin-top:6px;line-height:1.5;">' +
            'Top prospects with college production and historical pro comparables. Switch to Compare mode to put any two players head-to-head.' +
            (PRO_PLAYERS.length === 0 ? ' <span style="color:var(--ink-3);font-style:italic;">(Verified pro player college stats coming soon.)</span>' : '') +
          '</div>' +
        '</div>' +
        modeBar +
        filterBar +
        body +
      '</div>';
  }

  // Format the league line on a player card. For a prospect, "NFL DRAFT · QB · Texas"
  // makes clear the player is college-level projected for the NFL — NOT a current
  // NFL player. For a pro entry, the plain sport prefix is correct.
  function leagueLine(p) {
    var prefix = (p.type === 'pro') ? esc(p.sport) : esc(p.sport) + ' DRAFT';
    return prefix + ' · ' + esc(p.pos) + ' · ' + esc(p.school);
  }

  // ─── Browse mode: card list (matches the prior single-view layout) ─────────
  function renderBrowseCards(roster) {
    if (roster.length === 0) {
      return '<div style="padding:32px;text-align:center;color:var(--ink-3);border:1px solid var(--rule);border-radius:8px;">No players match the current filters.</div>';
    }
    var cards = roster.map(function(p) {
      var statsHtml = (p.stats || []).map(function(s) {
        return '' +
          '<div style="padding:10px 12px;background:var(--surface-2);border-radius:6px;">' +
            '<div style="font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;">' + esc(s.label) + '</div>' +
            '<div style="font-size:17px;font-weight:700;color:var(--ink-1);line-height:1.1;">' + esc(s.value) + '</div>' +
            (s.detail ? '<div style="font-size:11px;color:var(--ink-3);margin-top:3px;">' + esc(s.detail) + '</div>' : '') +
          '</div>';
      }).join('');

      var compsHtml = (p.comparables || []).map(function(c) {
        return '' +
          '<div style="padding:10px 12px;border-left:2px solid var(--accent);background:var(--surface-2);margin-bottom:6px;">' +
            '<div style="font-size:13px;font-weight:600;color:var(--ink-1);">' + esc(c.name) +
              ' <span style="color:var(--ink-3);font-weight:400;font-size:11px;">· ' + esc(c.college) + '</span>' +
            '</div>' +
            '<div style="font-size:12px;color:var(--ink-2);margin-top:3px;line-height:1.4;">' + esc(c.notes) + '</div>' +
            '<div style="font-size:11px;color:var(--ink-3);margin-top:4px;font-family:JetBrains Mono,monospace;">→ ' + esc(c.outcome) + '</div>' +
          '</div>';
      }).join('');

      var typeBadge = p.type === 'pro'
        ? '<span style="background:rgba(35,163,106,.18);color:#23a36a;padding:3px 8px;border-radius:3px;font-size:9px;font-weight:700;letter-spacing:.08em;font-family:JetBrains Mono,monospace;margin-left:6px;">PRO</span>'
        : '';

      return '' +
        '<div style="border:1px solid var(--rule);border-radius:8px;padding:18px;background:var(--surface);">' +
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap;">' +
            '<div>' +
              '<div style="font-size:11px;color:var(--ink-3);letter-spacing:.08em;font-family:JetBrains Mono,monospace;margin-bottom:4px;">' +
                leagueLine(p) + typeBadge +
              '</div>' +
              '<div style="font-size:20px;font-weight:800;color:var(--ink-1);line-height:1.15;">' + esc(p.name) + '</div>' +
              '<div style="font-size:11px;color:var(--ink-3);margin-top:4px;">' + esc(p.year) + '</div>' +
            '</div>' +
            (p.flag ? '<div style="background:var(--accent);color:var(--accent-ink);padding:5px 10px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.06em;font-family:JetBrains Mono,monospace;">' +
              esc(p.flag) +
            '</div>' : '') +
          '</div>' +
          (statsHtml ? '<div style="font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">College Production</div>' +
          '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-bottom:18px;">' + statsHtml + '</div>' : '') +
          (compsHtml ? '<div style="font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">Historical Comparables</div>' +
          '<div>' + compsHtml + '</div>' : '') +
        '</div>';
    }).join('');
    return '<div style="display:grid;gap:14px;">' + cards + '</div>';
  }

  // ─── Compare mode: two dropdowns → side-by-side table ──────────────────────
  function renderCompareMode(roster) {
    var state = window._labState;
    var pool = getPlayerPool();

    // Default the dropdowns sensibly the first time the user enters compare mode.
    if (state.selectedA === null && roster.length > 0) state.selectedA = roster[0]._idx;
    if (state.selectedB === null && roster.length > 1) state.selectedB = roster[1]._idx;

    function dropdown(id, currentIdx, otherIdx) {
      // The dropdown lists the filtered roster, but we always include the
      // currently selected player even if filters would exclude it (so the
      // selection doesn't silently vanish when the user changes filters).
      var options = roster.slice();
      var currentPlayer = pool.find(function(p) { return p._idx === currentIdx; });
      if (currentPlayer && !options.find(function(o) { return o._idx === currentIdx; })) {
        options.unshift(currentPlayer);
      }
      var opts = options.map(function(p) {
        var sel = (p._idx === currentIdx) ? ' selected' : '';
        var typeTag = p.type === 'pro' ? ' [PRO]' : '';
        var leaguePrefix = (p.type === 'pro') ? p.sport : (p.sport + ' DRAFT');
        return '<option value="' + p._idx + '"' + sel + '>' + esc(p.name) + ' — ' + esc(leaguePrefix) + '/' + esc(p.pos) + typeTag + '</option>';
      }).join('');
      return '<select id="' + id + '" onchange="setLabSelection(\'' + id + '\', this.value)" ' +
        'style="width:100%;padding:8px 10px;background:var(--surface-2);border:1px solid var(--rule);color:var(--ink-1);' +
        'border-radius:6px;font-size:13px;font-family:inherit;cursor:pointer;">' +
        '<option value="">— Pick a player —</option>' + opts + '</select>';
    }

    var playerA = pool.find(function(p) { return p._idx === state.selectedA; });
    var playerB = pool.find(function(p) { return p._idx === state.selectedB; });

    // Build the side-by-side comparison body.
    var compareBody = '';
    if (!playerA || !playerB) {
      compareBody = '<div style="padding:40px;text-align:center;color:var(--ink-3);border:1px dashed var(--rule);border-radius:8px;">' +
        'Pick two players above to see them side-by-side.' +
        '</div>';
    } else {
      compareBody = renderCompareTable(playerA, playerB);
    }

    return '' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;">' +
        '<div>' +
          '<div style="font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;font-family:JetBrains Mono,monospace;">Player A</div>' +
          dropdown('lab-select-a', state.selectedA, state.selectedB) +
        '</div>' +
        '<div>' +
          '<div style="font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;font-family:JetBrains Mono,monospace;">Player B</div>' +
          dropdown('lab-select-b', state.selectedB, state.selectedA) +
        '</div>' +
      '</div>' +
      compareBody;
  }

  // Side-by-side stat table for two players. We render their stat lines in
  // parallel rows; when stat labels match, they line up. When they don't
  // (e.g. a QB vs a WR), we show both lists with a divider.
  function renderCompareTable(a, b) {
    function header(p, side) {
      var typeBadge = p.type === 'pro'
        ? '<span style="background:rgba(35,163,106,.18);color:#23a36a;padding:2px 7px;border-radius:3px;font-size:9px;font-weight:700;letter-spacing:.08em;font-family:JetBrains Mono,monospace;margin-left:6px;vertical-align:middle;">PRO</span>'
        : '<span style="background:rgba(232,180,27,.18);color:#e8b41b;padding:2px 7px;border-radius:3px;font-size:9px;font-weight:700;letter-spacing:.08em;font-family:JetBrains Mono,monospace;margin-left:6px;vertical-align:middle;">PROSPECT</span>';
      return '' +
        '<div style="padding:16px;background:var(--surface);border:1px solid var(--rule);border-radius:8px 8px 0 0;border-bottom:none;">' +
          '<div style="font-size:10px;color:var(--ink-3);letter-spacing:.08em;font-family:JetBrains Mono,monospace;margin-bottom:6px;">' +
            leagueLine(p) + typeBadge +
          '</div>' +
          '<div style="font-size:18px;font-weight:800;color:var(--ink-1);line-height:1.15;">' + esc(p.name) + '</div>' +
          '<div style="font-size:11px;color:var(--ink-3);margin-top:4px;">' + esc(p.year) + '</div>' +
          (p.flag ? '<div style="margin-top:8px;font-size:10px;color:var(--ink-2);font-style:italic;">' + esc(p.flag) + '</div>' : '') +
        '</div>';
    }

    // Build a unified row list: for each unique stat label across both players,
    // emit one row with their respective values (or "—" if missing).
    var aStats = a.stats || [];
    var bStats = b.stats || [];
    var labels = [];
    var seen = {};
    aStats.concat(bStats).forEach(function(s) {
      if (!seen[s.label]) { seen[s.label] = true; labels.push(s.label); }
    });

    var rows = labels.map(function(label) {
      var av = aStats.find(function(s) { return s.label === label; });
      var bv = bStats.find(function(s) { return s.label === label; });
      function cell(v) {
        if (!v) return '<div style="padding:10px 12px;color:var(--ink-3);font-size:13px;text-align:center;">—</div>';
        return '<div style="padding:10px 12px;">' +
          '<div style="font-size:17px;font-weight:700;color:var(--ink-1);line-height:1.1;">' + esc(v.value) + '</div>' +
          (v.detail ? '<div style="font-size:11px;color:var(--ink-3);margin-top:3px;">' + esc(v.detail) + '</div>' : '') +
          '</div>';
      }
      return '' +
        '<div style="display:grid;grid-template-columns:1fr 200px 1fr;border-bottom:1px solid var(--rule);background:var(--surface);">' +
          cell(av) +

  // ═════════════════════════════════════════════════════════════════════════
  // TRADE VALUE — Jimmy Johnson chart for NFL draft picks, live.
  //
  // The Jimmy Johnson chart is the league-standard valuation for draft picks,
  // used by every NFL front office since the early 1990s. It assigns a point
  // value to each pick (1.1 = 3000 pts; later picks fall off rapidly).
  //
  // Math is fully self-contained (no API). We render:
  //   1. The full 1.1–7.32 chart in a sortable grid (visual + searchable)
  //   2. A trade calculator: pick 1 + pick 2 = X points; what's that equal to?
  //   3. Recent real-world trades as comparables (hand-curated)
  // ═════════════════════════════════════════════════════════════════════════

  // Jimmy Johnson chart values. The canonical published chart covers picks
  // 1-224 across 7 rounds (modern NFL = 32 picks/round, 224 total before comp).
  // Values are pre-tabulated for performance; sourced from the published chart.
  var JJ_CHART = (function() {
    // Round-by-round value floors (pick 1 of round N) and decay slopes are
    // tabulated below. The actual published chart for picks 1-30:
    var r1 = [3000,2600,2200,1800,1700,1600,1500,1400,1350,1300,1250,1200,1150,1100,1050,1000,
             950, 900, 875, 850, 800, 780, 760, 740, 720, 700, 680, 660, 640, 620, 600, 590];
    var r2 = [580, 560, 550, 540, 530, 520, 510, 500, 490, 480, 470, 460, 450, 440, 430, 420,
             410, 400, 390, 380, 370, 360, 350, 340, 330, 320, 310, 300, 292, 284, 276, 270];
    var r3 = [265, 260, 256, 252, 248, 244, 240, 236, 232, 228, 224, 220, 216, 212, 208, 204,
             200, 196, 192, 188, 184, 180, 176, 172, 168, 164, 160, 156, 152, 148, 144, 140];
    var r4 = [136, 132, 128, 124, 120, 116, 112, 108, 104, 100,  96,  92,  88,  86,  84,  82,
              80,  78,  76,  74,  72,  70,  68,  66,  64,  62,  60,  58,  56,  54,  52,  50];
    var r5 = [ 49,  48,  47,  46,  45,  44,  43,  42,  41,  40,  39,  38,  37,  36,  35,  34,
              33,  32,  31,  30,  29,  28,  27,  26,  25,  24,  23,  22,  21,  20,  19,  18];
    var r6 = [ 17,  16,  15,  14,  13,  12,  11,  10,  9.5, 9,   8.5, 8,   7.5, 7,   6.8, 6.6,
              6.4, 6.2, 6,   5.8, 5.6, 5.4, 5.2, 5,   4.8, 4.6, 4.4, 4.2, 4,   3.8, 3.6, 3.4];
    var r7 = [ 3.2, 3,   2.8, 2.6, 2.4, 2.2, 2,   1.8, 1.6, 1.4, 1.3, 1.2, 1.1, 1,   0.95,0.9,
              0.85,0.8, 0.75,0.7, 0.65,0.6, 0.55,0.5, 0.45,0.4, 0.35,0.3, 0.25,0.2, 0.15,0.1];
    var chart = {};
    [r1,r2,r3,r4,r5,r6,r7].forEach(function(round, rIdx) {
      round.forEach(function(val, pIdx) {
        var overall = rIdx * 32 + pIdx + 1;
        chart[overall] = { value: val, round: rIdx + 1, slot: pIdx + 1 };
      });
    });
    return chart;
  })();

          '<h2 style="margin:0;font-size:22px;font-weight:800;">Trade Value · Live</h2>' +
          '<div style="font-size:13px;color:var(--ink-3);margin-top:6px;line-height:1.5;">' +
            'Jimmy Johnson chart values for every NFL draft pick, plus a live calculator and real-world trade comparables. ' +

        '<div id="trade-calc" style="border:1px solid var(--accent);border-radius:8px;padding:14px;background:var(--surface);margin-bottom:18px;">' +

  // ─── Trade calculator helpers (window-scoped, used by onclick handlers) ───
  window.addTradePick = function(pickNum) {
    var entry = JJ_CHART[pickNum];
    if (!entry) return;
    window.__tradePicks = window.__tradePicks || [];
    window.__tradePicks.push({ pick: pickNum, value: entry.value, round: entry.round });
    refreshTradeCalc();
  };

  window.clearTradeCalc = function() {
    window.__tradePicks = [];
    refreshTradeCalc();
  };

  function refreshTradeCalc() {
    var picks = window.__tradePicks || [];
    var total = picks.reduce(function(s, p) { return s + p.value; }, 0);
    var picksEl = document.getElementById('trade-picks');
    var totalEl = document.getElementById('trade-total');
    var equivEl = document.getElementById('trade-equivalent');
    if (!picksEl || !totalEl) return;

    if (picks.length === 0) {
      picksEl.innerHTML = '<span style="color:var(--ink-3);font-size:12px;font-style:italic;">Click picks below to add them →</span>';
    } else {
      picksEl.innerHTML = picks.map(function(p, i) {
        return '<button onclick="removeTradePick(' + i + ')" ' +
          'style="background:var(--surface-2);border:1px solid var(--rule);padding:4px 8px;border-radius:4px;font-family:JetBrains Mono,monospace;font-size:11px;color:var(--ink-1);cursor:pointer;" ' +
          'title="Click to remove">' +
          '#' + p.pick + ' <span style="color:var(--ink-3);">(' + p.value + ')</span> ✕' +
        '</button>';
      }).join('');
    }
    totalEl.textContent = (Math.round(total * 10) / 10) + ' pts';

    // Find the single pick whose chart value is closest to this total ("equivalent pick").
    if (total > 0 && equivEl) {
      var best = null;
      var bestDiff = Infinity;
      for (var k in JJ_CHART) {
        var d = Math.abs(JJ_CHART[k].value - total);
        if (d < bestDiff) { bestDiff = d; best = k; }
      }
      if (best) {
        equivEl.textContent = '≈ equivalent to pick #' + best + ' (' + JJ_CHART[best].value + ' pts)';
      }
    } else if (equivEl) {
      equivEl.textContent = '';
    }
  }

  window.removeTradePick = function(idx) {
    if (!window.__tradePicks) return;
    window.__tradePicks.splice(idx, 1);
    refreshTradeCalc();
  };
