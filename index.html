  // Live draft pick tracker — reads from stories.json, populated by generate.js
  // which fetches ESPN's Core API server-side (no CORS issues there) and resolves
  // team + athlete refs. Falls back to Claude-extracted news picks if ESPN is unreachable.
  // Collapsible: header strip by default, full grid on click. Preference persisted.
  function renderDraftTracker(data) {
    var banner = document.getElementById('draft-tracker');
    if (!banner) return;
    // HARD GUARD: even if stories.json or the live fetcher passes us picks,
    // if today is not inside an active draft window, the banner stays hidden.
    // This prevents stale draft data from a previous event from leaking onto
    // the page after the draft is over.
    if (!getActiveDraftWindow()) {
      banner.style.display = 'none';
      banner.innerHTML = '';
      return;
    }
    var dt = data && data.draftTracker;
    if (!dt || !dt.active || !Array.isArray(dt.picks) || dt.picks.length === 0) {
      banner.style.display = 'none';
      banner.innerHTML = '';
      return;
    }
    var picks = dt.picks.slice().sort(function(a,b){return (a.pick||999)-(b.pick||999);});
    var sourceLabel = dt.source === 'espn' ? 'ESPN live feed' : dt.source === 'news' ? 'Extracted from news' : '';
    // Latest pick = highest pick number, for the collapsed-state preview
    var latest = picks[picks.length - 1];
    var latestPreview = latest ? (
      '<span class="dt-latest">' +
        '<span class="dt-latest-num">#' + (latest.pick || '?') + '</span>' +
        esc(latest.team || '') + ' — ' + esc(latest.player || '') +
        (latest.position ? ' <span style="color:rgba(255,255,255,0.45)">(' + esc(latest.position) + ')</span>' : '') +
      '</span>'
    ) : '';

    // Collapsed by default; honor saved preference
    var isExpanded = localStorage.getItem('sb_draft_expanded') === '1';

    var html =
      '<div class="dt-header" onclick="toggleDraftTracker()">' +
        '<span class="dt-live">● LIVE</span>' +
        '<span class="dt-title">' + esc(dt.event || 'NFL Draft') + '</span>' +
        '<span class="dt-count">' + picks.length + ' pick' + (picks.length===1?'':'s') +
          (sourceLabel ? ' · ' + esc(sourceLabel) : '') + '</span>' +
        latestPreview +
        '<span class="dt-toggle">' +
          '<span class="dt-toggle-label">' + (isExpanded ? 'Hide' : 'View all') + '</span>' +
          '<span class="dt-chevron">▼</span>' +
        '</span>' +
      '</div>' +
      '<div class="dt-list">' +
        picks.map(function(p) {
          var num = p.pick ? '#' + p.pick : '?';
          var roundLabel = p.round ? 'Round ' + p.round : '';
          var school = p.school ? ' <span class="dt-school">· ' + esc(p.school) + '</span>' : '';
          return '<div class="dt-pick">' +
            '<div class="dt-num">' + num +
              (roundLabel ? '<span class="dt-num-round">' + esc(roundLabel) + '</span>' : '') +
            '</div>' +
            '<div class="dt-body">' +
              '<div class="dt-player">' + esc(p.player||'TBD') +
                (p.position ? '<span class="dt-pos">' + esc(p.position) + '</span>' : '') +
              '</div>' +
              '<div class="dt-team">→ ' + esc(p.team||'') + school + '</div>' +
              (p.note ? '<div class="dt-note">' + esc(p.note) + '</div>' : '') +
            '</div>' +
          '</div>';
        }).join('') +
      '</div>';
    banner.innerHTML = html;
    banner.className = 'draft-tracker ' + (isExpanded ? 'expanded' : 'collapsed');
    banner.style.display = 'block';
  }

  function toggleDraftTracker() {
    var banner = document.getElementById('draft-tracker');
    if (!banner) return;
    var isExpanded = banner.classList.contains('expanded');
    var nextExpanded = !isExpanded;
    banner.classList.toggle('expanded', nextExpanded);
    banner.classList.toggle('collapsed', !nextExpanded);
    localStorage.setItem('sb_draft_expanded', nextExpanded ? '1' : '0');
    var label = banner.querySelector('.dt-toggle-label');
    if (label) label.textContent = nextExpanded ? 'Hide' : 'View all';
  }

  // ─── Client-side ESPN draft feed (real-time during active draft) ──────────
  // Fetches directly from ESPN Core API so picks appear in the browser without
  // waiting for the 2-hour cron. Mirrors the server-side fetchNflDraftLive()
  // logic. Caches briefly to avoid re-hammering ESPN on rapid UI events, but
  // stays short enough that Round 2+ picks surface within ~30-60s of being made.
  var liveDraftCache = { ts: 0, data: null, lastPickCount: 0, lastRoundCount: 0 };
  var LIVE_DRAFT_TTL_MS = 25 * 1000; // was 60s — tighter so later rounds don't stall
  var draftTimer = null;

  // Known draft windows for major US sports leagues. Each window covers ONLY
  // the actual event days — no post-event buffer. The moment the draft ends,
  // the banner disappears. To extend, just edit the dates here.
  var DRAFT_WINDOWS = [
    // 2026 NFL Draft: April 23-25, 2026 (3-day event, Thu-Sat)
    { id: 'nfl-2026', sport: 'football', league: 'nfl', year: 2026, label: 'NFL Draft', start: '2026-04-23', end: '2026-04-25' },
    // 2026 NBA Draft: typically late June (2-night event)
    { id: 'nba-2026', sport: 'basketball', league: 'nba', year: 2026, label: 'NBA Draft', start: '2026-06-25', end: '2026-06-26' },
    // 2026 NHL Draft: typically late June (2-day event)
    { id: 'nhl-2026', sport: 'hockey', league: 'nhl', year: 2026, label: 'NHL Draft', start: '2026-06-26', end: '2026-06-27' },
    // 2026 MLB Draft: typically mid-July (3-day event)
    { id: 'mlb-2026', sport: 'baseball', league: 'mlb', year: 2026, label: 'MLB Draft', start: '2026-07-12', end: '2026-07-14' },
    // 2027 placeholders — adjust dates when official schedules are published
    { id: 'nfl-2027', sport: 'football', league: 'nfl', year: 2027, label: 'NFL Draft', start: '2027-04-22', end: '2027-04-24' },
    { id: 'nba-2027', sport: 'basketball', league: 'nba', year: 2027, label: 'NBA Draft', start: '2027-06-24', end: '2027-06-25' },
    { id: 'nhl-2027', sport: 'hockey', league: 'nhl', year: 2027, label: 'NHL Draft', start: '2027-06-25', end: '2027-06-26' },
    { id: 'mlb-2027', sport: 'baseball', league: 'mlb', year: 2027, label: 'MLB Draft', start: '2027-07-11', end: '2027-07-13' },
  ];

  // Returns the active draft window if today falls inside one, else null.
  // Today is computed as YYYY-MM-DD in the user's local time.
  function getActiveDraftWindow() {
    var d = new Date();
    var today = d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
    for (var i = 0; i < DRAFT_WINDOWS.length; i++) {
      var w = DRAFT_WINDOWS[i];
      if (today >= w.start && today <= w.end) return w;
    }
    return null;
  }

  async function fetchLiveDraft() {
    // First check: are we in a draft window at all? If not, return null and
    // the renderer will hide the banner. This is what stops the tracker from
    // permanently showing "2026 NFL Draft" weeks after the draft ended.
    var win = getActiveDraftWindow();
    if (!win) {
      console.log('[draft] no active draft window — banner hidden');
      return null;
    }

    if (liveDraftCache.data && liveDraftCache.windowId === win.id && Date.now() - liveDraftCache.ts < LIVE_DRAFT_TTL_MS) {
      return liveDraftCache.data;
    }

    async function fetchJson(url) {
      try {
        var r = await fetch(url.replace(/^http:/, 'https:'), { signal: AbortSignal.timeout(8000) });
        if (!r.ok) return null;
        return await r.json();
      } catch (e) { return null; }
    }

    var url = 'https://sports.core.api.espn.com/v2/sports/' + win.sport + '/leagues/' + win.league + '/seasons/' + win.year + '/draft/rounds?limit=300';
    console.log('[draft] active window: ' + win.label + ' ' + win.year + ', fetching:', url);
    var rounds = await fetchJson(url);
    if (!rounds || !Array.isArray(rounds.items)) {
      console.warn('[draft] no rounds returned for', win.id);
      return null;
    }
    var pickedYear = win.year;
    var draftLabel = win.label;

    // Filter by ref-presence (permissive) rather than status name
    var rawPicks = [];
    for (var r = 0; r < rounds.items.length; r++) {
      var round = rounds.items[r];
      var roundNum = round.number || 1;
      var picks = round.picks;
      if (picks && picks.$ref && !Array.isArray(picks)) {
        var sub = await fetchJson(picks.$ref);
        picks = sub && sub.items || [];
      }
      if (!Array.isArray(picks)) continue;
      for (var j = 0; j < picks.length; j++) {
        var p = picks[j];
        if (p && p.$ref && !p.status && !p.overall) {
          p = await fetchJson(p.$ref);
          if (!p) continue;
        }
        var teamRef    = p && p.team    && p.team.$ref;
        var athleteRef = p && p.athlete && p.athlete.$ref;
        if (teamRef && athleteRef) {
          rawPicks.push({
            pick:       p.overall || p.pick || null,
            round:      roundNum,
            teamRef:    teamRef,
            athleteRef: athleteRef,
            tradeNote:  p.tradeNote || '',
          });
        }
      }
    }
    console.log('[draft] pickable:', rawPicks.length);
    if (rawPicks.length === 0) {
      var emptyOut = { active: false, event: '', picks: [], source: 'espn' };
      liveDraftCache = { ts: Date.now(), data: emptyOut, windowId: win.id };
      return emptyOut;
    }

    var resolved = [];
    var BATCH = 12;
    for (var bi = 0; bi < rawPicks.length; bi += BATCH) {
      var batch = rawPicks.slice(bi, bi + BATCH);
      var results = await Promise.all(batch.map(async function(p) {
        var teamP    = p.teamRef    ? fetchJson(p.teamRef)    : null;
        var athleteP = p.athleteRef ? fetchJson(p.athleteRef) : null;
        var team = await teamP, ath = await athleteP;
        var playerName = '';
        if (ath) {
          playerName = ath.fullName || ath.displayName || '';
          if (!playerName && (ath.firstName || ath.lastName)) {
            playerName = ((ath.firstName||'') + ' ' + (ath.lastName||'')).trim();
          }
        }
        return {
          pick:     p.pick,
          round:    p.round,
          team:     team ? (team.displayName || team.name || team.shortDisplayName || '') : '',
          player:   playerName,
          position: ath && ath.position ? (ath.position.abbreviation || ath.position.name || '') : '',
          school:   ath && ath.college  ? (ath.college.name || '') : '',
          note:     p.tradeNote ? 'Trade: ' + p.tradeNote : '',
        };
      }));
      resolved = resolved.concat(results);
    }

    var clean = resolved.filter(function(p) { return p && p.team && p.player; });
    clean.sort(function(a,b){ return (a.pick||999) - (b.pick||999); });
    console.log('[draft] resolved', clean.length, 'picks with names');

    // Derive current round from the highest-numbered pick's round value. Shows
    // as "2026 NFL Draft · Round 2" in the banner so users know we're tracking
    // round 2+ correctly.
    var roundsWithPicks = {};
    clean.forEach(function(p){ if (p.round) roundsWithPicks[p.round] = true; });
    var roundNumbers = Object.keys(roundsWithPicks).map(Number).sort(function(a,b){return a-b;});
    var roundLabel = '';
    if (roundNumbers.length > 0) {
      var maxRound = roundNumbers[roundNumbers.length - 1];
      roundLabel = roundNumbers.length === 1
        ? 'Round ' + maxRound
        : 'Rounds 1–' + maxRound;
    }

    var out = {
      active: clean.length > 0,
      event:  pickedYear + ' ' + draftLabel + (roundLabel ? ' · ' + roundLabel : ''),
      picks:  clean,
      source: 'espn',
    };

    // Capture growth signals for adaptive polling. If picks grew vs. last fetch,
    // we know the draft is active — poll faster next time.
    var prevCount = liveDraftCache.lastPickCount || 0;
    var grew = clean.length > prevCount;
    liveDraftCache = {
      ts: Date.now(),
      data: out,
      windowId: win.id,
      lastPickCount: clean.length,
      lastRoundCount: roundNumbers.length,
      isGrowing: grew,
    };
    return out;
  }

  async function refreshDraftTracker() {
    var live = await fetchLiveDraft();
    var inWindow = !!getActiveDraftWindow();
    if (live && live.picks && live.picks.length > 0) {
      renderDraftTracker({ draftTracker: live });
    } else if (inWindow && allData && allData.draftTracker && allData.draftTracker.active) {
      // Inside an active window but ESPN live fetch failed — fall back to
      // the news-extracted picks from generate.js. This is the only path that
      // uses stale-ish data, and only during a real window.
      var fallback = Object.assign({}, allData.draftTracker);
      if (!fallback.source) fallback.source = 'news';
      renderDraftTracker({ draftTracker: fallback });
    } else {
      renderDraftTracker({ draftTracker: { active: false, picks: [] } });
    }
    // Adaptive polling: if the draft is actively adding picks, poll every 30s.
    // If it's stable (nothing changed last cycle), relax to 2 minutes. Outside
    // a draft window, stop polling entirely — there's nothing to refresh.
    var banner = document.getElementById('draft-tracker');
    var visible = banner && banner.style.display !== 'none';
    if (draftTimer) { clearInterval(draftTimer); draftTimer = null; }
    if (visible && inWindow) {
      var pollMs = liveDraftCache.isGrowing ? 30 * 1000 : 120 * 1000;
      draftTimer = setInterval(refreshDraftTracker, pollMs);
    }
  }

  async function loadStories() {
    var btn = document.getElementById('refresh-btn');
    if (btn) { btn.disabled = true; btn.classList.add('spinning'); }
    try {
      var res = await fetch('stories.json?nc=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var data = await res.json();
      if (!data || !data.clusters || data.clusters.length === 0) throw new Error('empty');
      allData = data;
      if (data.poll && data.poll.question) {
        var prevQ = localStorage.getItem('sb_poll_question');
        if (prevQ !== data.poll.question) { localStorage.removeItem('sb_poll_v1'); localStorage.setItem('sb_poll_question', data.poll.question); }
        POLL = data.poll;
      }
      if (Array.isArray(data.picks) && data.picks.length) {
        PICKS = data.picks;
        // Annotate with scheduled timestamps so the retrograde grader can
        // evaluate them later. Parse "Today H:MM PM ET" / "Tomorrow H:MM PM ET".
        PICKS.forEach(function(p) {
          if (p._scheduledTs) return; // already stamped
          var m = String(p.when||'').match(/^(Today|Tomorrow)\s+(\d{1,2}):(\d{2})\s*(AM|PM)\s*ET$/i);
          if (!m) return;
          var dayOffset = /tomorrow/i.test(m[1]) ? 1 : 0;
          var hour = parseInt(m[2], 10);
          var min = parseInt(m[3], 10);
          if (/PM/i.test(m[4]) && hour < 12) hour += 12;
          if (/AM/i.test(m[4]) && hour === 12) hour = 0;
          var d = new Date();
          d.setDate(d.getDate() + dayOffset);
          d.setHours(hour, min, 0, 0);
          p._scheduledTs = d.getTime();
        });
        persistPendingPicks(PICKS);
      }
      if (Array.isArray(data.predictions) && data.predictions.length) PREDICTIONS = data.predictions;
      if (Array.isArray(data.highlights) && data.highlights.length) HIGHLIGHTS = data.highlights;
      // Server-built Reels feed (direct YouTube RSS, fetched by the generator).
      // This replaces the old in-browser rss2json fetches that rate-limited
      // into a permanently empty Reels tab.
      if (Array.isArray(data.reels) && data.reels.length) SERVER_REELS = data.reels;
      // Injuries are extracted by the cluster call from the day's news feeds.
      // Power the new Injury Desk sub-tab under Sports Analytics.
      if (Array.isArray(data.injuries)) INJURIES = data.injuries;
      // Dispatch the re-render to whichever tab is currently active. Previously
      // this always called renderFeed(), which uses the cluster-category filter
      // and incorrectly showed "No stories in this category" when the user was
      // viewing Market Tracker or Reels (those tabs have their own renderers
      // and aren't cluster-driven).
      if      (activeCat === 'analytics') renderActiveSub();
      else if (activeCat === 'market')    renderMarketTracker(true);
      else if (activeCat === 'reels')     renderReelsFeed();
      else                                renderFeed(allData);
      renderSidebar(allData);
      refreshDraftTracker();
      renderWidget();
      var t = data.updatedAt ? new Date(data.updatedAt).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}) : '';
      document.getElementById('updated-label').textContent = 'Feed updated ' + t + ' · auto-refreshes every 2h';
      if (typeof renderTicker === 'function') renderTicker(allData);
    } catch(err) {
      console.warn('loadStories error:', err.message);
      if (allData) {
        // Same tab-aware dispatch as the success path — don't fall through to
        // renderFeed() unconditionally or Market Tracker / Reels users see a
        // misleading "No stories in this category" error.
        if      (activeCat === 'analytics') renderActiveSub();
        else if (activeCat === 'market')    renderMarketTracker();
        else if (activeCat === 'reels')     renderReelsFeed();
        else                                renderFeed(allData);
      } else {
        document.getElementById('main-feed').innerHTML = '<div class="loading-state"><div class="loading-title">Loading stories...</div><div class="loading-sub">If this persists, go to GitHub Actions and run the Refresh Stories workflow.</div></div>';
      }
    } finally {
      var btn2 = document.getElementById('refresh-btn');
      if (btn2) { btn2.disabled = false; btn2.classList.remove('spinning'); }
    }
  }
  // Cache of fetched events keyed by `${league}:${date}` so the modal can
  // resolve event IDs back to full event objects.
  var scoresEventCache = {};

  // ─── Game Detail Modal — opens when user clicks a score card ──────────────
  // Pulls from ESPN's /summary?event={id} endpoint which returns box score,
  // leaders, scoring plays, and (for soccer) formations + lineups when
  // available. Some data (lineups especially) only exists 30-90 min before
  // kickoff. Modal handles missing sections gracefully.
  var _gdSummaryCache = {};

  // ESPN summary endpoint URL pattern depends on the sport. We map league IDs
  // back to the right base URL.
  function summaryUrlFor(leagueId, eventId) {
    var league = ESPN_LEAGUES.find(function(l){ return l.id === leagueId; });
    if (!league) return null;
    // ESPN's summary endpoint replaces /scoreboard with /summary?event=ID
    return league.url.replace('/scoreboard', '/summary') + '?event=' + eventId;
  }

  window.openGameDetail = async function(cacheKey, eventId) {
    var overlay = document.getElementById('gd-overlay');
    var content = document.getElementById('gd-content');
    if (!overlay || !content) return;

    var leagueId = cacheKey.split(':')[0];
    var events = scoresEventCache[cacheKey] || [];
    var ev = events.find(function(e){ return String(e.id) === String(eventId); });
    if (!ev) {
      content.innerHTML = '<div class="gd-loading">Could not load game data.</div>';
      overlay.classList.add('open');
      return;
    }

    // Render header immediately from cached scoreboard data — it has team
    // names, scores, status. Then fetch /summary for the deeper details.
    content.innerHTML = renderGameDetailShell(ev, leagueId) +
      '<div class="gd-body">' +
        '<div class="gd-loading">Loading game details…</div>' +
      '</div>';
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';

    // Fetch summary data
    var summary = _gdSummaryCache[eventId];
    if (!summary) {
      try {
        var url = summaryUrlFor(leagueId, eventId);
        if (!url) throw new Error('no summary URL');
        var res = await fetch(url, { signal: AbortSignal.timeout(8000) });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        summary = await res.json();
        _gdSummaryCache[eventId] = summary;
      } catch (e) {
        console.warn('[game-detail] summary fetch failed:', e.message);
        summary = null;
      }
    }

    // Detect if this is a soccer league for formation rendering
    var isSoccer = ['epl','laliga','bundesliga','seriea','ligue1','ucl','mls','worldcup','euros','copaamerica'].indexOf(leagueId) !== -1;

    var bodyHtml = '';
    if (!summary) {
      bodyHtml = '<div class="gd-loading">Detail data unavailable for this game.</div>';
    } else {
      bodyHtml += renderGameTeamComparison(summary, ev);
      if (isSoccer) {
        // Goals (with minutes) and lineups/formation are what soccer fans want.
        bodyHtml += renderGameGoalscorers(summary);
      }
      // Per-player box score is the primary detail (replaces the old, thin
      // "Top Performers" cards). Box score for every sport.
      bodyHtml += renderGameBoxScore(summary, leagueId);
      if (isSoccer) {
        bodyHtml += renderGameFormations(summary);
      }
      // Keep top-performers ONLY as a fallback when no full box score rendered
      // (some lower-coverage leagues), so the panel is never empty.
      if (bodyHtml.indexOf('Full Box Score') === -1) {
        bodyHtml += renderGameLeaders(summary);
      }
      bodyHtml += '<div class="gd-disclaimer">Source: ESPN. Lineups appear ~30-90 min before kickoff. Some leagues have less detail than others.</div>';
    }

    content.innerHTML = renderGameDetailShell(ev, leagueId) +
      '<div class="gd-body">' + bodyHtml + '</div>';
  };

  window.closeGameDetail = function(ev) {
    if (ev && ev.target && ev.target.id !== 'gd-overlay' && typeof ev.stopPropagation !== 'undefined') return;
    var overlay = document.getElementById('gd-overlay');
    if (overlay) overlay.classList.remove('open');
    document.body.style.overflow = '';
  };

  function renderGameDetailShell(ev, leagueId) {
    var comp = ev.competitions && ev.competitions[0];
    var teams = (comp && comp.competitors) || [];
    var home = teams.find(function(t){return t.homeAway==='home';}) || teams[0] || {};
    var away = teams.find(function(t){return t.homeAway==='away';}) || teams[1] || {};
    var status = ev.status || {};
    var stateType = status.type && status.type.name;
    var hScore = parseInt(home.score) || 0;
    var aScore = parseInt(away.score) || 0;
    var hasScore = stateType !== 'STATUS_SCHEDULED';
    var isLive = stateType === 'STATUS_IN_PROGRESS' || stateType === 'STATUS_HALFTIME';
    var statusTxt = (status.type && (status.type.shortDetail || status.type.detail)) || '';
    var leagueLabel = (ESPN_LEAGUES.find(function(l){return l.id===leagueId;}) || {}).label || '';
    var venue = (comp && comp.venue && comp.venue.fullName) ? ' · ' + comp.venue.fullName : '';

    return '<div class="gd-header">' +
      '<button class="gd-close" onclick="closeGameDetail()">✕</button>' +
      '<div class="gd-league">' + esc(leagueLabel) + esc(venue) + '</div>' +
      '<div class="gd-teams">' +
        '<div class="gd-team away">' +
          '<div class="gd-team-name">' + esc(away.team && (away.team.displayName || away.team.shortDisplayName) || '') + '</div>' +
          (away.records && away.records[0] ? '<div class="gd-team-record">' + esc(away.records[0].summary || '') + '</div>' : '') +
        '</div>' +
        (hasScore
          ? '<div class="gd-score-divider"><span class="gd-score-cell ' + (aScore < hScore ? 'dim' : '') + '">' + aScore + '</span> – <span class="gd-score-cell ' + (hScore < aScore ? 'dim' : '') + '">' + hScore + '</span></div>'
          : '<div class="gd-score-divider">@</div>') +
        '<div class="gd-team home">' +
          '<div class="gd-team-name">' + esc(home.team && (home.team.displayName || home.team.shortDisplayName) || '') + '</div>' +
          (home.records && home.records[0] ? '<div class="gd-team-record">' + esc(home.records[0].summary || '') + '</div>' : '') +
        '</div>' +
      '</div>' +
      '<div class="gd-status' + (isLive ? ' live' : '') + '">' + esc(statusTxt) + '</div>' +
    '</div>';
  }

  // Renders the team-stats comparison from /summary boxscore. ESPN stores each
  // team's stats in boxscore.teams[].statistics[], where each entry has
  // { name, label, displayValue, value }. We align the two teams by the stable
  // `name` key (NOT the human label, which can collide or vary), and always
  // prefer displayValue (already formatted, e.g. "53.6%" or "5/12") over the
  // raw numeric value. This fixes the earlier bug where columns desynced and
  // percentages showed as raw ratios like "0.9".
  function renderGameTeamComparison(summary, ev) {
    var box = summary && summary.boxscore;
    if (!box || !box.teams || box.teams.length < 2) return '';
    var t1 = box.teams[0];
    var t2 = box.teams[1];
    var s1 = (t1.statistics || []);
    var s2 = (t2.statistics || []);
    if (s1.length === 0 && s2.length === 0) return '';

    // Use each team's ACTUAL name from the boxscore so the columns are labeled
    // correctly. ESPN does not guarantee teams[0]=away, so we never assume —
    // column 1 is whatever t1 is, column 2 is t2, and the header says which.
    function teamName(t) {
      return (t.team && (t.team.abbreviation || t.team.shortDisplayName || t.team.displayName)) || '';
    }
    var name1 = teamName(t1), name2 = teamName(t2);

    function statKey(st) { return (st.name || st.label || '').toString(); }
    function statVal(st) {
      if (st.displayValue !== undefined && st.displayValue !== null && st.displayValue !== '') return String(st.displayValue);
      if (st.value !== undefined && st.value !== null) return String(st.value);
      return '';
    }

    var statsMap = {};
    var order = [];
    s1.forEach(function(st) {
      var k = statKey(st);
      if (!k) return;
      if (!statsMap[k]) { statsMap[k] = { label: st.label || st.name, c1: '', c2: '' }; order.push(k); }
      statsMap[k].c1 = statVal(st);
    });
    s2.forEach(function(st) {
      var k = statKey(st);
      if (!k) return;
      if (!statsMap[k]) { statsMap[k] = { label: st.label || st.name, c1: '', c2: '' }; order.push(k); }
      statsMap[k].c2 = statVal(st);
    });

    var rows = order.map(function(k) {
      var s = statsMap[k];
      if (s.c1 === '' && s.c2 === '') return '';
      return '<div class="gd-stat-away">' + esc(s.c1 || '—') + '</div>' +
             '<div class="gd-stat-label">' + esc(s.label || k) + '</div>' +
             '<div class="gd-stat-home">' + esc(s.c2 || '—') + '</div>';
    }).filter(Boolean).join('');

    if (!rows) return '';
    // Header row naming each column's team so "Argentina's stats on Austria's
    // side" can't happen — the team name sits directly above its own column.
    var header = '<div class="gd-stat-away gd-stat-teamhead">' + esc(name1) + '</div>' +
                 '<div class="gd-stat-label"></div>' +
                 '<div class="gd-stat-home gd-stat-teamhead">' + esc(name2) + '</div>';
    return '<div class="gd-section">' +
      '<div class="gd-section-title">Team Stats</div>' +
      '<div class="gd-boxscore-grid">' + header + rows + '</div>' +
    '</div>';
  }

  // Renders top-performer cards from summary.leaders[] (NBA/NFL/MLB/NHL) or
  // summary.boxscore.players (some leagues). Filters out empty categories.
  function renderGameLeaders(summary) {
    var leaders = summary && summary.leaders;
    if (!Array.isArray(leaders) || leaders.length === 0) return '';
    var cards = [];
    // ESPN structure: leaders is an array per team, each with leaders[].leaders[]
    leaders.forEach(function(teamBlock) {
      var teamName = teamBlock.team && (teamBlock.team.shortDisplayName || teamBlock.team.displayName) || '';
      (teamBlock.leaders || []).forEach(function(catBlock) {
        var catLabel = catBlock.displayName || catBlock.name || '';
        var topPlayer = (catBlock.leaders || [])[0];
        if (!topPlayer) return;
        var name = topPlayer.athlete && topPlayer.athlete.displayName || '';
        var stat = topPlayer.displayValue || topPlayer.value || '';
        if (!name || !stat) return;
        cards.push('<div class="gd-leader-card">' +
          '<div class="gd-leader-cat">' + esc(catLabel) + '</div>' +
          '<div class="gd-leader-name">' + esc(name) + '</div>' +
          '<div class="gd-leader-team">' + esc(teamName) + '</div>' +
          '<div class="gd-leader-stat">' + esc(stat) + '</div>' +
        '</div>');
      });
    });
    if (cards.length === 0) return '';
    return '<div class="gd-section">' +
      '<div class="gd-section-title">Top Performers</div>' +
      '<div class="gd-leaders">' + cards.join('') + '</div>' +
    '</div>';
  }

  // Soccer goalscorers with minute markers, parsed from summary.keyEvents[].
  // ESPN marks scoring plays with type.id/text containing "Goal". Each event
  // has clock.displayValue (e.g. "23'"), the scorer in participants/athletesInvolved,
  // and the team. Renders "Messi 23', 67' (pen)" style lines per team.
  function renderGameGoalscorers(summary) {
    var events = summary && summary.keyEvents;
    if (!Array.isArray(events) || events.length === 0) return '';
    var goals = events.filter(function(e) {
      var typeText = (e.type && (e.type.text || e.type.name) || '').toLowerCase();
      var txt = (e.text || '').toLowerCase();
      // include goals + penalties + own goals; exclude cards/subs
      return /goal/.test(typeText) || /scores|penalty kick (is )?good|own goal/.test(txt);
    });
    if (goals.length === 0) return '';

    var lines = goals.map(function(g) {
      var minute = (g.clock && g.clock.displayValue) ? g.clock.displayValue : '';
      var scorer = '';
      if (Array.isArray(g.participants) && g.participants[0] && g.participants[0].athlete) {
        scorer = g.participants[0].athlete.displayName || g.participants[0].athlete.shortName || '';
      } else if (Array.isArray(g.athletesInvolved) && g.athletesInvolved[0]) {
        scorer = g.athletesInvolved[0].displayName || g.athletesInvolved[0].shortName || '';
      }
      var team = (g.team && (g.team.abbreviation || g.team.displayName)) || '';
      var txt = (g.text || '').toLowerCase();
      var tag = /own goal/.test(txt) ? ' (OG)' : (/penalt/.test(txt) ? ' (pen)' : '');
      if (!scorer && !minute) return '';
      return '<div class="gd-goal-line">' +
        '<span class="gd-goal-min">' + esc(minute || '—') + '</span>' +
        '<span class="gd-goal-scorer">⚽ ' + esc(scorer || 'Goal') + esc(tag) + '</span>' +
        (team ? '<span class="gd-goal-team">' + esc(team) + '</span>' : '') +
      '</div>';
    }).filter(Boolean).join('');

    if (!lines) return '';
    return '<div class="gd-section">' +
      '<div class="gd-section-title">Goals</div>' +
      '<div class="gd-goals">' + lines + '</div>' +
    '</div>';
  }

  // Renders the full per-player box score from summary.boxscore.players[].
  // Structure varies by sport but follows: each team has statistics[] groups
  // (e.g., "starters" / "bench" for NBA, "passing" / "rushing" / "receiving"
  // for NFL), and each group has keys + labels + athletes[]. We render one
  // table per team-group, defaulting collapsed (only home + away "main" group
  // expanded) to keep the modal manageable.
  function renderGameBoxScore(summary, leagueId) {
    var box = summary && summary.boxscore;
    var teamsData = box && box.players;
    if (!Array.isArray(teamsData) || teamsData.length === 0) return '';

    var teamHtml = teamsData.map(function(teamBlock, teamIdx) {
      var teamName = (teamBlock.team && (teamBlock.team.displayName || teamBlock.team.shortDisplayName)) || ('Team ' + (teamIdx + 1));
      var statsGroups = teamBlock.statistics || [];
      if (statsGroups.length === 0) return '';

      var groupsHtml = statsGroups.map(function(group, groupIdx) {
        var keys = group.keys || group.descriptions || [];
        var labels = group.labels || group.names || keys;
        var athletes = group.athletes || [];
        if (athletes.length === 0 || keys.length === 0) return '';

        // Header row
        var headerCells = labels.map(function(lbl, i) {
          return '<th>' + esc(String(lbl).toUpperCase()) + '</th>';
        }).join('');

        // Player rows. Each athlete has stats[] aligned to keys[] by index.
        var rows = athletes.map(function(a) {
          var name = (a.athlete && (a.athlete.displayName || a.athlete.shortName)) || '';
          var jersey = a.athlete && a.athlete.jersey ? '#' + a.athlete.jersey + ' ' : '';
          var pos = a.athlete && a.athlete.position && (a.athlete.position.abbreviation || '') ;
          var didNotPlay = a.didNotPlay === true || a.starter === false && (a.stats || []).every(function(s){ return !s || s === '0' || s === '00:00' || s === '--'; });
          var nameCell = '<td class="gd-bs-name">' +
            '<div>' + esc(jersey + name) + (pos ? ' <span class="gd-bs-pos">' + esc(pos) + '</span>' : '') + '</div>' +
          '</td>';
          var statCells = (a.stats || []).map(function(s) {
            return '<td>' + esc(s == null ? '—' : String(s)) + '</td>';
          }).join('');
          return '<tr' + (didNotPlay ? ' class="gd-bs-dnp"' : '') + '>' + nameCell + statCells + '</tr>';
        }).join('');

        var groupName = group.text || group.name || '';
        var groupLabel = groupName ? '<div class="gd-bs-group-label">' + esc(groupName) + '</div>' : '';

        return groupLabel +
          '<div class="gd-bs-table-wrap">' +
            '<table class="gd-bs-table">' +
              '<thead><tr><th class="gd-bs-name-h">PLAYER</th>' + headerCells + '</tr></thead>' +
              '<tbody>' + rows + '</tbody>' +
            '</table>' +
          '</div>';
      }).join('');

      // First team expanded by default; second team collapsed (toggleable).
      var openByDefault = teamIdx === 0;
      var detailsId = 'gd-bs-team-' + teamIdx;
      return '<details class="gd-bs-team-block"' + (openByDefault ? ' open' : '') + '>' +
        '<summary class="gd-bs-team-summary">' + esc(teamName) + '</summary>' +
        '<div class="gd-bs-team-content">' + groupsHtml + '</div>' +
      '</details>';
    }).join('');

    if (!teamHtml.trim()) return '';
    return '<div class="gd-section">' +
      '<div class="gd-section-title">Full Box Score</div>' +
      teamHtml +
    '</div>';
  }

  // Renders soccer formations + starting lineups from summary.rosters[] +
  // summary.formations[]. Both are league-dependent — when missing, render a
  // friendly "not available" rather than blank.
  function renderGameFormations(summary) {
    var rosters = summary && summary.rosters;
    var formations = summary && summary.formations;
    var hasRosters = Array.isArray(rosters) && rosters.length >= 2;
    var hasFormations = Array.isArray(formations) && formations.length >= 2;
    if (!hasRosters && !hasFormations) {
      return '<div class="gd-section">' +
        '<div class="gd-section-title">Lineups &amp; Formation</div>' +
        '<div class="gd-no-data">Lineups and formation data not available for this match. ESPN typically posts these 30-90 minutes before kickoff.</div>' +
      '</div>';
    }
    var teamCols = [0, 1].map(function(idx) {
      var roster = hasRosters ? rosters[idx] : null;
      var formationItem = hasFormations ? formations[idx] : null;
      var teamName = (roster && roster.team && (roster.team.displayName || roster.team.shortDisplayName)) ||
                     (formationItem && formationItem.team && formationItem.team.displayName) || '';
      var shape = formationItem && (formationItem.formation || formationItem.name) || '';

      var listHtml = '';
      if (roster && Array.isArray(roster.roster)) {
        var starters = roster.roster.filter(function(p){ return p.starter; }).slice(0, 11);
        if (starters.length > 0) {
          listHtml = starters.map(function(p) {
            var pos = p.position && (p.position.abbreviation || p.position.name) || '';
            var name = p.athlete && (p.athlete.displayName || p.athlete.shortName) || '';
            var jersey = p.jersey || '';
            return '<div>' + (jersey ? '<span class="gd-formation-num">#' + esc(jersey) + '</span>' : '') + esc(name) + (pos ? ' <span style="color:var(--ink-3);font-size:10px;">(' + esc(pos) + ')</span>' : '') + '</div>';
          }).join('');
        }
      }
      if (!listHtml) {
        listHtml = '<div style="color:var(--ink-3);font-style:italic;">Lineup not posted yet</div>';
      }

      return '<div class="gd-formation-team">' +
        '<div class="gd-formation-team-name">' + esc(teamName || (idx === 0 ? 'Away' : 'Home')) + '</div>' +
        (shape ? '<div class="gd-formation-shape">' + esc(shape) + '</div>' : '') +
        '<div class="gd-formation-list">' + listHtml + '</div>' +
      '</div>';
    }).join('');

    return '<div class="gd-section">' +
      '<div class="gd-section-title">Lineups &amp; Formation</div>' +
      '<div class="gd-formation">' + teamCols + '</div>' +
    '</div>';
  }

  async function fetchScores(leagueId) {
    activeLeague = leagueId;
    document.querySelectorAll('.main-score-tab').forEach(function(t){
      var lg = ESPN_LEAGUES.find(function(l){return l.id===leagueId;});
      t.classList.toggle('active', lg && t.textContent === lg.label);
    });
    var el = document.getElementById('scores-games');
    if (!el) return;

    var dateKey = scoresActiveDate || 'today';
    var cacheKey = leagueId + ':' + dateKey;
    var cached = scoresCache[cacheKey];
    if (cached && Date.now() - cached.ts < 300000) { el.innerHTML = cached.html; return; }

    el.innerHTML = '<div class="score-loading">Loading scores...</div>';
    try {
      var league = ESPN_LEAGUES.find(function(l){return l.id===leagueId;});
      // Add ?dates=YYYYMMDD only if user picked a non-today date.
      var url = league.url;
      if (scoresActiveDate) {
        var dateParam = scoresActiveDate.replace(/-/g, ''); // YYYY-MM-DD → YYYYMMDD
        url += (url.indexOf('?') === -1 ? '?' : '&') + 'dates=' + dateParam;
      }
      var res  = await fetch(url);
      var data = await res.json();
      var events = data.events || [];
      scoresEventCache[cacheKey] = events;
      if (events.length === 0) {
        el.innerHTML = '<div class="score-loading">No games on this date.</div>';
        return;
      }

      var html = events.slice(0, 24).map(function(ev) {
        var comp   = ev.competitions[0];
        var teams  = comp.competitors;
        var home   = teams.find(function(t){return t.homeAway==='home';}) || teams[0];
        var away   = teams.find(function(t){return t.homeAway==='away';}) || teams[1];
        var status = ev.status;
        var stateType = status.type.name;
        var statusTxt, isLive = false;
        if (stateType === 'STATUS_FINAL' || stateType === 'STATUS_FULL_TIME') {
          statusTxt = status.type.shortDetail || 'Final';
        } else if (stateType === 'STATUS_IN_PROGRESS' || stateType === 'STATUS_HALFTIME') {
          if (stateType === 'STATUS_HALFTIME') {
            statusTxt = 'HT';
          } else if (status.displayClock && !status.period) {
            // Soccer: displayClock is the match minute (e.g. "67'")
            statusTxt = status.displayClock;
          } else {
            statusTxt = status.displayClock ? (status.period ? 'Q'+status.period+' ' : '') + status.displayClock : 'Live';
          }
          isLive = true;
        } else {
          var d = new Date(ev.date);
          statusTxt = d.toLocaleDateString('en-US',{weekday:'short'}) + ' ' +
                      d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
        }
        var hScore = parseInt(home.score) || 0;
        var aScore = parseInt(away.score) || 0;
        var hWin = (stateType==='STATUS_FINAL' || stateType==='STATUS_FULL_TIME') && hScore > aScore;
        var aWin = (stateType==='STATUS_FINAL' || stateType==='STATUS_FULL_TIME') && aScore > hScore;
        var hName = home.team.shortDisplayName || home.team.abbreviation || '';
        var aName = away.team.shortDisplayName || away.team.abbreviation || '';
        var hDisp = stateType==='STATUS_SCHEDULED' ? '' : hScore;
        var aDisp = stateType==='STATUS_SCHEDULED' ? '' : aScore;

        // Goalscorers with minutes, straight from the scoreboard event's
        // competitions[0].details (no extra fetch). ESPN marks goals with
        // scoringPlay=true; each has clock.displayValue and athletesInvolved.
        // We list them under the score so soccer cards show who scored when,
        // before you even click in.
        var goalsHtml = '';
        try {
          var details = (comp.details || []).filter(function(d){
            return d.scoringPlay === true || (d.type && /goal/i.test(d.type.text||''));
          });
          if (details.length) {
            var gl = details.map(function(d){
              var min = (d.clock && d.clock.displayValue) ? d.clock.displayValue : '';
              var who = (Array.isArray(d.athletesInvolved) && d.athletesInvolved[0] &&
                         (d.athletesInvolved[0].displayName || d.athletesInvolved[0].shortName)) || '';
              var pen = /penalt/i.test((d.type&&d.type.text)||'') ? ' (P)' : (/own goal/i.test((d.type&&d.type.text)||'') ? ' (OG)' : '');
              if (!who && !min) return '';
              return '<div class="main-score-goal">⚽ ' + esc(min) + ' ' + esc(who || 'Goal') + esc(pen) + '</div>';
            }).filter(Boolean).join('');
            if (gl) goalsHtml = '<div class="main-score-goals">' + gl + '</div>';
          }
        } catch(e) {}

        return '<div class="main-score-card" onclick="openGameDetail(\'' + esc(cacheKey) + '\',\'' + esc(String(ev.id)) + '\')" style="cursor:pointer;">'+
          '<div class="main-score-row '+(aWin?'winner':'')+'"><span class="main-score-team">'+esc(aName)+'</span><span class="main-score-num">'+aDisp+'</span></div>'+
          '<div class="main-score-row '+(hWin?'winner':'')+'"><span class="main-score-team">'+esc(hName)+'</span><span class="main-score-num">'+hDisp+'</span></div>'+
          goalsHtml+
          '<div class="main-score-footer'+(isLive?' live':'')+'">'+(isLive?'● ':'')+esc(statusTxt)+'</div>'+
        '</div>';
      }).join('');

      scoresCache[cacheKey] = { html: html, ts: Date.now() };
      el.innerHTML = html;
    } catch(err) {
      el.innerHTML = '<div class="score-loading">Could not load scores.</div>';
    }
  }


  setDateline();
  setInterval(setDateline, 60000);
  renderWidget();

  // ─── One-time pick-history reset ──────────────────────────────────────────
  // The pick W-L record lives in each visitor's localStorage. To "reset to 0-0"
  // NOTE: The auto-reset version mechanism was removed. Previously this block
  // wiped localStorage W-L on every page load where the stored version key
  // didn't match a hardcoded string. That was the root cause of "the Spurs pick
  // hit and the tracker isn't updating" — wins recorded before a version bump
  // got silently cleared.
  //
  // Authoritative grading now lives server-side in pick_history.json (written
  // by the workflow whenever a pick's game finishes). The front-end merges
  // those results with localStorage at load time. Users can still reset their
  // local tally via the explicit reset button in the pick history modal.

  loadStories();
  loadPickHistory_fetchServer(); // canonical W-L record from server-side grading
  refreshDraftTracker();  // parallel with stories.json — live ESPN data doesn't need to wait
  retrogradePendingPicks(); // catch up on any pending picks whose games have finished since last visit
  // Re-check every 5 minutes while tab is open so finishes happen live
  setInterval(retrogradePendingPicks, 5 * 60 * 1000);
</script>
<div id="gd-overlay" class="ph-overlay" onclick="closeGameDetail(event)">
  <div class="ph-modal" onclick="event.stopPropagation()" style="max-width:880px;">
    <div id="gd-content"></div>
  </div>
</div>
<div id="ph-overlay" class="ph-overlay" onclick="closePickHistory(event)">
  <div class="ph-modal" onclick="event.stopPropagation()">
    <div id="ph-content"></div>
  </div>
</div>
<div id="video-overlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.88);z-index:2000;align-items:center;justify-content:center;" onclick="closeVideo()">
  <div style="position:relative;width:90%;max-width:900px;aspect-ratio:16/9;" onclick="event.stopPropagation()">
    <iframe id="video-frame" src="" width="100%" height="100%" frameborder="0" allowfullscreen allow="autoplay" style="border-radius:4px;"></iframe>
    <button onclick="closeVideo()" style="position:absolute;top:-36px;right:0;background:none;border:none;color:#fff;font-size:22px;cursor:pointer;line-height:1;">&#x2715;</button>
  </div>
</div>
<div id="article-modal"  style="display:none;" class="article-modal-overlay" onclick="closeArticle(event)">
  <div class="article-modal">
    <button class="article-modal-close" onclick="closeArticleBtn()">&#x2715;</button>
    <div id="modal-tag" class="article-modal-tag"></div>
    <div id="modal-headline" class="article-modal-headline"></div>
    <div id="modal-meta" class="article-modal-meta"></div>
    <div id="modal-body" class="article-modal-body"></div>
  </div>
</div>
</body>
